<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spectral Sky HDRI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen instrument. Viewport (panorama) left, parameter rack right; stacks on phones. Dark by design so HDR previews are judged against a dim surround. */
:root{
  --bg:#0a0d11; --panel:#10141a; --raise:#161b23; --line:#222a35; --line2:#2c3644;
  --fg:#dde3ea; --muted:#8893a1; --faint:#5c6774;
  --accent:#9ec5ff; --accent-ink:#0b1626; --sun:#f0c27f; --moon:#bcc7d8; --warn:#e8a35a; --bad:#e8766a;
  --ui:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.45 var(--ui);overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,select,input{font:inherit;color:inherit}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 372px}
#stage{min-width:0;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;border-right:1px solid var(--line)}
/* the tool strip sits over the top of the image on large screens and in its own row above it on small ones */
#stage>*{grid-column:1} #stage>.bar{grid-row:1} #stage>.view{grid-row:2/4} #stage>.tools{grid-row:2} #stage>.readouts{grid-row:4}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 16px;border-bottom:1px solid var(--line);min-width:0}
@media (max-width:1250px){.brand .tag{display:none}}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand b{font-weight:600;font-size:15px;letter-spacing:.01em}
.brand .tag{font:11px var(--mono);color:var(--muted);letter-spacing:.04em}
.mark{width:12px;height:12px;border-radius:50%;align-self:center;background:radial-gradient(circle at 50% 50%,#fff 0 18%,var(--sun) 30%,rgba(240,194,127,0) 70%),linear-gradient(#5f8fd6,#c7dcf5);}
.pre-wrap{position:relative;flex:none}
.pre-btn{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;max-width:300px}
.pre-btn .pre-lbl{color:var(--muted)}
.pre-btn b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pre-btn .caret{color:var(--muted);font-size:10px;transition:transform .15s}
.pre-btn[aria-expanded="true"] .caret{transform:rotate(180deg)}
.presets{position:absolute;top:calc(100% + 8px);left:0;z-index:40;width:min(540px,calc(100vw - 32px));max-height:min(70vh,560px);overflow:auto;
  background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:6px 14px 14px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.pre-grp h4{margin:10px 0 7px;font:600 10.5px var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.pre-chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{flex:none;border:1px solid var(--line2);background:transparent;border-radius:999px;padding:4px 11px;color:var(--muted);cursor:pointer;white-space:nowrap}
.chip:hover{color:var(--fg);border-color:var(--faint)}
.chip.on{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.view{position:relative;min-height:0;background:#07090c;overflow:hidden;touch-action:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.overlay{position:absolute;inset:0;pointer-events:none}
.compass{position:absolute;font:10px var(--mono);color:rgba(230,236,244,.7);transform:translateX(-50%);letter-spacing:.06em}
.hline{position:absolute;height:0;border-top:1px dashed rgba(230,236,244,.18)}
.tools{position:relative;z-index:15;align-self:start;justify-self:start;margin:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:calc(100% - 24px);min-width:0}
.seg{display:inline-flex;background:rgba(16,20,26,.86);border:1px solid var(--line2);border-radius:8px;padding:2px;backdrop-filter:blur(6px)}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:6px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--raise);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.seg button:hover{color:var(--fg)}
.expo{display:inline-flex;align-items:center;gap:8px;background:rgba(16,20,26,.86);border:1px solid var(--line2);border-radius:8px;padding:4px 10px;backdrop-filter:blur(6px)}
.expo input[type=range]{width:110px}
.expo .v{font:11px var(--mono);color:var(--muted);min-width:66px}
.status{position:absolute;right:12px;bottom:10px;font:11px var(--mono);color:var(--muted);background:rgba(10,13,17,.8);padding:3px 8px;border-radius:6px}
.brush{position:absolute;border:1.5px solid #5fd08c;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.45),inset 0 0 0 1px rgba(0,0,0,.25)}
.brush.rem{border-color:#f0675c}
.hint{position:absolute;left:12px;bottom:10px;font:11px var(--mono);color:var(--muted);background:rgba(10,13,17,.8);padding:3px 8px;border-radius:6px}
.map{width:100%;aspect-ratio:2/1;border-radius:6px;display:block;cursor:crosshair;background:#0f1a26;touch-action:none;max-width:100%}
.tgrid{display:flex;flex-wrap:wrap;gap:6px}
.tchip{border:1px solid var(--line2);background:var(--raise);border-radius:6px;padding:4px 8px;cursor:pointer;font:11px var(--mono);font-variant-numeric:tabular-nums;color:var(--fg);text-align:left;display:grid;gap:1px}
.tchip span{font:10px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tchip:hover{border-color:var(--faint)}
.btn.rand{flex:none;padding:5px 12px;border-radius:999px}
.variety{flex:none;display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted)}
.variety input[type=range]{width:84px}
.variety b{font:600 11px var(--mono);color:var(--fg);min-width:62px}
.legend{position:absolute;left:12px;bottom:10px;display:flex;align-items:center;gap:6px;font:10px var(--mono);color:var(--muted);background:rgba(10,13,17,.8);padding:4px 8px;border-radius:6px}
.legend i{display:block;width:180px;height:8px;border-radius:2px;background:linear-gradient(90deg,#30123b,#4662d7,#36aaf9,#1ae4b6,#72fe5e,#c7ef34,#faba39,#f66b19,#ca2a04,#7a0403)}
.readouts{display:flex;flex-wrap:wrap;gap:0;border-top:1px solid var(--line);background:var(--panel)}
.ro{padding:8px 14px;border-right:1px solid var(--line);min-width:0}
.ro .k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.ro .v{font:500 13px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.ro .v small{color:var(--muted);font-weight:400;font-size:11px}
#panel{background:var(--panel);overflow-y:auto;min-width:0;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.sec{border-bottom:1px solid var(--line)}
.sec>h2{margin:0;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:12px 16px 4px;display:flex;justify-content:space-between;align-items:center}
.sec>h2 span{font:10px var(--mono);letter-spacing:0;text-transform:none;color:var(--faint)}
.rows{display:grid;gap:2px;padding:4px 16px 14px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:2px 10px;padding:3px 0}
.row label{color:var(--fg);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .val{font:12px var(--mono);color:var(--accent);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.row input[type=range]{grid-column:1/-1}
.row select,.row input[type=date],.row input[type=time],.row input[type=number]{background:var(--raise);border:1px solid var(--line2);border-radius:6px;padding:4px 6px;max-width:190px}
.row.full{grid-template-columns:1fr}
.note{color:var(--muted);font-size:12px;line-height:1.45}
.note b{color:var(--fg);font-weight:500}
.mono{font-family:var(--mono)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--line2);border-radius:2px}
input[type=range]::-moz-range-track{height:3px;background:var(--line2);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--fg);margin-top:-5px;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--faint)}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--fg);border:2px solid var(--panel)}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 2px var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line2);background:var(--raise);border-radius:7px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.err{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--fg);background:var(--bg)}
.err p{max-width:52ch;color:var(--muted)}
.safe-note{position:absolute;left:12px;right:12px;bottom:12px;z-index:30;max-width:560px;background:rgba(16,20,26,.94);border:1px solid var(--warn);border-radius:10px;padding:10px 12px;color:var(--fg);font-size:12.5px;line-height:1.5}
.safe-note i{color:var(--warn);font-style:normal}
.safe-note .btn{margin-left:8px;padding:2px 10px}
.ldc-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin:4px 0 2px}
.ldc-sw{aspect-ratio:1;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.ldc-hist{width:100%;height:auto;display:block;background:var(--raise);border-radius:6px;margin-top:4px}
.swatch{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
/* small screens: the tools get their own row, so nothing covers the image */
@media (max-width:860px), (max-height:560px){
  #stage>.view{grid-row:3} #stage>.tools{grid-row:2}
  .tools{margin:0;padding:8px 10px;max-width:none;justify-self:stretch;gap:6px;border-bottom:1px solid var(--line);background:var(--bg)}
  .seg button{padding:5px 9px}
  .tools .seg{flex-wrap:wrap;max-width:100%}
  .expo input[type=range]{width:90px}
}
@media (max-width:860px){
  body{overflow:auto}
  #app{grid-template-columns:1fr;height:auto}
  /* a 2:1 panorama fills the width; look-around gets a little more height */
  #stage{border-right:0;grid-template-rows:auto auto clamp(200px, 62vw, 60vh) auto}
  #panel{overflow:visible}
  .bar{flex-wrap:wrap;gap:8px;padding:10px 12px}
  .presets{width:calc(100vw - 24px)}
  .ro{padding:6px 10px}
}
/* short landscape screens (phones turned sideways): one scrolling row of tools and of readouts, a narrower rack */
@media (max-height:560px) and (min-width:561px){
  body{overflow:hidden}
  #app{height:100%;grid-template-columns:minmax(0,1fr) min(320px, 40vw)}
  #stage{border-right:1px solid var(--line);grid-template-rows:auto auto minmax(0,1fr) auto}
  #panel{overflow-y:auto}
  .bar{flex-wrap:nowrap;overflow-x:auto;padding:6px 10px;gap:8px;scrollbar-width:none}
  .brand .tag{display:none}
  .tools{flex-wrap:nowrap;overflow-x:auto;padding:6px 10px;scrollbar-width:none}
  .tools>*{flex:none}
  .readouts{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .ro{padding:4px 10px;flex:none}
  .ro .k{font-size:9px}
  .ro .v{font-size:12px}
}
.loader{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(7,9,12,.86);transition:opacity .45s ease,background .45s ease}
.loader.light{background:rgba(7,9,12,.3)}
.loader.gone{opacity:0;pointer-events:none}
.ld-card{width:min(340px,100%);background:rgba(16,20,26,.94);border:1px solid var(--line2);border-radius:12px;padding:18px 20px 16px;text-align:center;box-shadow:0 16px 48px rgba(0,0,0,.5)}
.ld-spin{width:30px;height:30px;margin:0 auto 12px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--sun);animation:ldspin .9s linear infinite}
@keyframes ldspin{to{transform:rotate(360deg)}}
.ld-title{font-weight:600;font-size:14px}
.ld-step{color:var(--muted);margin-top:3px;min-height:1.45em;font-size:12.5px}
.ld-bar{height:3px;background:var(--line2);border-radius:2px;margin-top:12px;overflow:hidden}
.ld-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s ease}
.ld-hint{color:var(--faint);font-size:11.5px;margin-top:10px;line-height:1.45}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}.ld-spin{animation-duration:3s}.loader,.ld-bar i{transition:none}}
</style>

<div id="app">
  <section id="stage">
    <header class="bar">
      <div class="brand"><span class="mark" aria-hidden="true"></span><b>Spectral Sky</b><span class="tag">HDRI · 24-band</span></div>
      <div class="pre-wrap">
        <button class="btn pre-btn" id="presetBtn" aria-haspopup="true" aria-expanded="false" aria-controls="presets"><span class="pre-lbl">Preset</span><b id="presetName">Fair-weather cumulus</b><span class="caret" aria-hidden="true">▼</span></button>
        <nav class="presets" id="presets" aria-label="Weather presets" hidden></nav>
      </div>
      <button class="btn rand" id="randAll" title="Random time of day, sun and moon, ground, atmosphere and clouds">Randomize all</button>
      <button class="btn rand" id="randWx" title="Random atmosphere and clouds; keeps the sun, moon and ground">Randomize weather</button>
      <label class="variety" title="How far the randomize buttons stray from real-world weather. Realistic: weather types whose settings belong together, at the rates they really occur, matched to the time of day, season and (with a place picked) the local climate. Wild: anything goes."><span>Variety</span><input type="range" id="variety" min="0" max="1" step="0.05" value="0" aria-label="Randomize variety, realistic to wild"><b id="varVal">Realistic</b></label>
    </header>
    <div class="tools" id="tools">
      <div class="seg" id="viewSeg" role="group" aria-label="View">
        <button data-v="0" class="on">Panorama</button><button data-v="1">Look around</button><button data-v="2">Luminance</button><button data-v="3">Look-dev</button><button data-v="4">Shot</button>
      </div>
      <div class="expo"><label><input type="checkbox" id="autoEx" checked> Auto</label><input type="range" id="exSlider" min="-8" max="8" step="0.1" value="0" aria-label="Exposure"><span class="v" id="exVal">±0.0 EV</span></div>
      <div class="seg" id="resSeg" role="group" aria-label="Preview resolution" title="Preview resolution. 4K and 8K render strip by strip and take longer (8K uses about 0.5 GB of graphics memory).">
        <button data-r="1024">1K</button><button data-r="2048">2K</button><button data-r="4096">4K</button><button data-r="8192">8K</button>
      </div>
      <div class="seg" id="placeSeg" role="group" aria-label="Click to place">
        <button data-p="none">Orbit</button><button data-p="sun" class="on"><span class="swatch" style="background:var(--sun)"></span>Place sun</button><button data-p="moon"><span class="swatch" style="background:var(--moon)"></span>Place moon</button><button data-p="add"><span class="swatch" style="background:#5fd08c"></span>Paint clouds</button><button data-p="remove"><span class="swatch" style="background:#f0675c"></span>Erase clouds</button>
      </div>
    </div>
    <div class="view" id="view">
      <canvas id="gl"></canvas>
      <div class="overlay" id="overlay"></div>
      <div class="loader" id="loader" role="status" aria-live="polite">
        <div class="ld-card"><div class="ld-spin" aria-hidden="true"></div>
          <div class="ld-title" id="ldTitle">Loading Spectral Sky</div>
          <div class="ld-step" id="ldStep">Starting…</div>
          <div class="ld-bar"><i id="ldBar"></i></div>
          <div class="ld-hint" id="ldHint">The first launch after an update compiles the GPU shaders, which can take a little while.</div></div></div>
      <div class="legend" id="legend" hidden><span>10⁻⁴</span><i></i><span>10⁹ cd/m²</span></div>
      <div class="brush" id="brush" hidden></div>
      <div class="status" id="status">Starting…</div>
    </div>
    <footer class="readouts" id="readouts"></footer>
  </section>
  <aside id="panel"></aside>
</div>

<script>
'use strict';
/* =====================================================================
   Spectral Sky HDRI — physically based sky renderer (WebGL2)
   Units: lengths in km, extinction in 1/km, spectral irradiance W·m⁻²·nm⁻¹,
   spectral radiance W·m⁻²·sr⁻¹·nm⁻¹; output CIE XYZ with Y in cd/m².
   ===================================================================== */
const $ = s => document.querySelector(s);
const NL = 24, NG = 6, DL = 15;
const LAM = Array.from({length:NL}, (_,i) => 387.5 + DL*i);
const f32 = a => new Float32Array(a);
const clamp = (x,a,b) => Math.min(b, Math.max(a, x));
const D2R = Math.PI/180, R2D = 180/Math.PI;

/* ---------- spectral tables ---------- */
function lerpT(t, x){ if (x<=t[0][0]) return t[0][1]; const n=t.length; if (x>=t[n-1][0]) return t[n-1][1];
  for (let i=1;i<n;i++) if (x<=t[i][0]){ const a=t[i-1], b=t[i]; return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0]); } }
const binAvg = (fn,l) => { let s=0; for (let k=-7;k<=7;k++) s+=fn(l+k); return s/15; };
// Extraterrestrial solar spectral irradiance at 1 AU (W m^-2 nm^-1), smoothed ASTM E-490
const SOLAR=[[380,1.10],[390,1.09],[400,1.69],[410,1.70],[420,1.75],[430,1.60],[440,1.83],[450,2.05],[460,2.07],[470,2.03],[480,2.07],[490,1.95],[500,1.95],[510,1.89],[520,1.85],[530,1.92],[540,1.86],[550,1.88],[560,1.83],[570,1.83],[580,1.84],[590,1.77],[600,1.75],[610,1.71],[620,1.66],[630,1.62],[640,1.60],[650,1.53],[660,1.52],[670,1.51],[680,1.47],[690,1.43],[700,1.41],[710,1.38],[720,1.35],[730,1.32],[740,1.28],[750,1.26],[760,1.23]];
// O3 absorption cross-section, 293 K (cm^2) — Chappuis band
const O3XS=[[380,0.2e-23],[400,1.0e-23],[425,6.0e-23],[450,2.7e-22],[475,6.5e-22],[500,1.4e-21],[525,2.5e-21],[550,3.3e-21],[575,4.6e-21],[600,5.1e-21],[625,4.2e-21],[650,2.6e-21],[675,1.4e-21],[700,0.8e-21],[725,0.55e-21],[750,0.4e-21],[780,0.3e-21]];
// CIE 1931 2° colour matching functions (Wyman–Sloan–Shirley multi-lobe fit)
const gl_ = (x,m,s1,s2) => { const t=(x-m)/(x<m?s1:s2); return Math.exp(-0.5*t*t); };
const xbar = l => 1.056*gl_(l,599.8,37.9,31.0)+0.362*gl_(l,442.0,16.0,26.7)-0.065*gl_(l,501.1,20.4,26.2);
const ybar = l => 0.821*gl_(l,568.8,46.9,40.5)+0.286*gl_(l,530.9,16.3,31.1);
const zbar = l => 1.217*gl_(l,437.0,11.8,36.0)+0.681*gl_(l,459.0,26.0,13.8);
const CMFX = LAM.map(l=>binAvg(xbar,l)*DL*683), CMFY = LAM.map(l=>binAvg(ybar,l)*DL*683), CMFZ = LAM.map(l=>binAvg(zbar,l)*DL*683);
const SOLAR_BIN = LAM.map(l=>binAvg(x=>lerpT(SOLAR,x),l));
// Spectral ground reflectance (directional-hemispherical, treated as Lambertian)
const SURFACES = {
  grey:{name:'Neutral (set albedo)', t:null},
  grass:{name:'Green grass', t:[[400,.04],[450,.05],[500,.07],[550,.12],[600,.08],[650,.06],[680,.05],[700,.15],[720,.35],[740,.45]]},
  drygrass:{name:'Dry grass / savanna', t:[[400,.07],[500,.10],[550,.14],[600,.20],[650,.24],[700,.28],[740,.32]]},
  sand:{name:'Desert sand', t:[[400,.15],[450,.20],[500,.27],[550,.33],[600,.39],[650,.43],[700,.46],[740,.48]]},
  soil:{name:'Bare soil', t:[[400,.06],[500,.09],[600,.13],[700,.17],[740,.19]]},
  snow:{name:'Fresh snow', t:[[400,.96],[550,.95],[700,.92],[740,.90]]},
  asphalt:{name:'Asphalt', t:[[400,.05],[740,.09]]},
  concrete:{name:'Concrete', t:[[400,.22],[550,.30],[740,.35]]},
  water:{name:'Water (diffuse approx.)', t:[[400,.08],[550,.05],[740,.03]]},
};
const AEROSOLS = {

    else { const e = Math.log2(autoK()); ev = ev === null ? e : ev + (e - ev)*0.3; const k = P.tlExpo==='auto' ? Math.pow(2, ev) : k0;
      files.push({name: name+'.png', parts: [await pngFromRGB(rgb, P.tlRes, P.tlRes/2, k)]}); }
    const done = (i+1)/n, el = (performance.now()-t0)/1000; $('#tlProg i').style.width = (done*100).toFixed(1)+'%';
    $('#tlInfo').textContent = `Frame ${i+1} of ${n} · ${P.time} · ${fmtTime(el/done - el)} left`; }
  TL.rendering = false; $('#tlRender').disabled = false; $('#tlCancel').hidden = true; dirtyScene = true;
  if (files.length){ setStatus('Packing frames…'); const zip = zipFiles(files);
    try { const res = await saveParts(`timelapse_${base.date}_${P.tlStart.replace(':','')}_${files.length}f_${P.tlFormat}.zip`, zip, 'application/zip');
      $('#tlInfo').textContent = res==='declined' ? 'Download declined.' : `Saved ${files.length} frames. Assemble at 24–30 fps, for example: ffmpeg -framerate 30 -i frame_%04d.png -pix_fmt yuv420p timelapse.mp4`; setStatus('Timelapse saved'); }
    catch(e){ setStatus('Could not save the file: '+e.message); } }
}

  const log = [`GPU: ${GPU_NAME}`, `Browser: ${navigator.userAgent}`]; const out = () => box.querySelector('#dLog').textContent = log.join('\n');
  out(); let auto = false, release = null;
  const paint = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(r, 30))));
  diagGate = async (name) => { box.querySelector('#dNow').textContent = 'Next: ' + name; await paint();
    if (!auto) await new Promise(r => release = r); else await new Promise(r => setTimeout(r, 1000));
    box.querySelector('#dNow').textContent = 'RUNNING: ' + name + '  (if Chrome is frozen now, this is the step)'; log.push('… ' + name); out(); await paint(); };
  window.diagDone = (name, ms) => { log[log.length-1] = `✓ ${name} — ${ms.toFixed(0)} ms`; out(); };
  box.querySelector('#dNext').onclick = () => { if (release){ const r = release; release = null; r(); } };
  box.querySelector('#dAuto').onclick = () => { auto = true; if (release){ const r = release; release = null; r(); } };
  box.querySelector('#dCopy').onclick = (e) => copyText(log.join('\n'), e.target, box);
  window.diagFinish = () => { box.querySelector('#dNow').textContent = 'All steps finished. The app is running; use Copy log and paste it to Claude.'; log.push('✓ app running (frame loop started)'); out(); }; }
// copy text from a button click. Inside an embedded page the async clipboard API can be blocked, and its promise may never
// settle (the button then did nothing), so copy through a selected text box first, and leave that box visible as a fallback

/* ---------- cross-GPU consistency check: a small final render of the current scene, summarised so two machines can compare ---------- */
let GPU_REP = null;
function sceneHash(){ const skip = new Set(['previewRes','previewSpp','brushLayer','brushSize','brushStrength','maskShow','outRes','outSpp','format','rigUSD','layersOn','ldcFace','wipeOn','wipePos','variety','goboExt','goboRes','goboMode'].concat(Object.keys(P).filter(k => k.startsWith('shot'))));
  const o = {}; for (const k of Object.keys(P).sort()) if (!skip.has(k) && typeof P[k] !== 'function') o[k] = P[k];
  let h = 2166136261 >>> 0; const t = JSON.stringify(o) + '|' + (MASKINFO.any ? 'mask' : ''); for (let i=0;i<t.length;i++){ h ^= t.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h.toString(16).padStart(8, '0'); }
async function gpuCheck(){
  const el = $('#gpuChk'); if (finalJob || TL.rendering){ el.textContent = 'Wait for the current render to finish.'; return; }
  el.textContent = 'Rendering a 512 × 256 check image…';
  const W = 512, H = 256, rgb = await renderFinal({W, spp:8, quality:P.quality, units:'nits', label:'Consistency check'});
  if (!rgb){ el.textContent = 'Check cancelled.'; return; }
  // 16 × 8 regions over the whole panorama (sky and ground), mean luminance and colour of each
  const R = []; for (let j=0;j<8;j++) for (let i=0;i<16;i++){ let r = 0, g = 0, b = 0, n = 0;
    for (let y=j*H/8; y<(j+1)*H/8; y++) for (let x=i*W/16; x<(i+1)*W/16; x++){ const o = (y*W + x)*3; r += rgb[o]; g += rgb[o+1]; b += rgb[o+2]; n++; }
    R.push([r/n, g/n, b/n].map(v => +v.toPrecision(5))); }
  GPU_REP = {app:'spectral-sky-check', v:1, scene:sceneHash(), quality:P.quality, gpu:GPU_NAME, regions:R};
  const txt = JSON.stringify(GPU_REP);
  el.innerHTML = `Check rendered on <b>${GPU_NAME.replace(/</g,'&lt;')}</b> · scene ${GPU_REP.scene}.<div class="btns" style="margin-top:8px"><button class="btn" id="gpuCopy">Copy this report</button></div>
    <textarea id="gpuPaste" placeholder="Paste the report from the other machine here to compare" style="display:block;width:100%;height:64px;margin-top:8px;font:11px var(--mono);background:var(--raise);color:var(--fg);border:1px solid var(--line2);border-radius:6px;padding:6px"></textarea><div id="gpuCmp" style="margin-top:6px"></div>`;
  $('#gpuCopy').onclick = e => copyText(txt, e.target, el);
  $('#gpuPaste').oninput = e => gpuCompare(e.target.value); }
function gpuCompare(t){ const out = $('#gpuCmp'); let o; try { o = JSON.parse(t.trim()); } catch(_){ out.textContent = t.trim() ? 'That is not a check report.' : ''; return; }
  if (!o || o.app !== 'spectral-sky-check' || !Array.isArray(o.regions) || o.regions.length !== GPU_REP.regions.length){ out.textContent = 'That is not a check report from this version.'; return; }
  if (o.scene !== GPU_REP.scene || o.quality !== GPU_REP.quality){ out.innerHTML = '<span style="color:var(--warn)">The two checks used different scenes or ray-march quality: load the same scene file on both machines first.</span>'; return; }
  // relative difference per region and channel, against a floor of 1 % of the brightest region (so near-black regions do not dominate)
  let peak = 0; GPU_REP.regions.forEach(c => c.forEach(v => { peak = Math.max(peak, v); })); const fl = 0.01*peak;
  let mx = 0, sum = 0, n = 0; GPU_REP.regions.forEach((c, i) => c.forEach((v, k) => { const w = o.regions[i][k]; const d = Math.abs(v - w)/Math.max(Math.max(v, w), fl); mx = Math.max(mx, d); sum += d; n++; }));
  const pc = v => (v*100).toFixed(v < 0.001 ? 3 : 2) + ' %';
  out.innerHTML = `Against <b>${String(o.gpu).replace(/</g,'&lt;')}</b>: mean difference ${pc(sum/n)}, largest region ${pc(mx)}. ` +
    (mx < 0.01 ? '<span style="color:#5fd08c">Matches: well below anything visible.</span>' : mx < 0.03 ? '<span style="color:var(--warn)">Close, but a little more than expected. Send both reports to look into it.</span>' : '<span style="color:var(--bad)">These differ visibly. Send both reports to look into it.</span>'); }
function copyText(txt, btn, box){
  let ta = box.querySelector('textarea.copy-box');
  if (!ta){ ta = document.createElement('textarea'); ta.className = 'copy-box'; ta.readOnly = true; ta.style.cssText = 'display:block;width:100%;height:150px;margin-top:8px;font:11px ui-monospace,Menlo,Consolas,monospace;background:#0b0e12;color:#dde3ea;border:1px solid #2a3340;border-radius:6px'; box.appendChild(ta); }
  ta.value = txt; ta.focus(); ta.select(); let ok = false;
  try { ok = document.execCommand('copy'); } catch(_){}
  if (ok){ btn.textContent = 'Copied'; return; }
  btn.textContent = 'Select all and copy below';
  try { const pr = navigator.clipboard && navigator.clipboard.writeText(txt); if (pr) pr.then(() => { btn.textContent = 'Copied'; }, () => {}); } catch(_){} }
function crashReport(prev){ const lines = prev.map(e => `${new Date(e.t).toLocaleTimeString()}  ${e.msg}`);
  return ['Spectral Sky diagnostic report', `GPU: ${GPU_NAME}`, `Browser: ${navigator.userAgent}`, `Screen: ${screen.width}×${screen.height} @${devicePixelRatio}x`, '', 'Previous session:', ...lines.slice(-40)].join('\n'); }
function showReport(prev, crashed){
  const box = document.createElement('div'); box.className = 'safe-note'; const last = [...prev].reverse().find(e => /^START |GPU RESET/.test(e.msg));
  box.innerHTML = crashed
    ? `<b>The last session crashed</b> while <i>${(last ? last.msg.replace(/^START /,'') : 'starting').replace(/</g,'&lt;')}</i>. Starting in safe mode (1024 × 512 preview, one sample). <button class="btn" data-a="copy" type="button">Copy diagnostic report</button><button class="btn" data-a="ok" type="button">OK</button>`
    : `<b>Diagnostics.</b> GPU: <i>${GPU_NAME.replace(/</g,'&lt;')}</i>. <button class="btn" data-a="copy" type="button">Copy diagnostic report</button><button class="btn" data-a="ok" type="button">OK</button>`;
  box.querySelector('[data-a=copy]').onclick = (e) => copyText(crashReport(prev), e.target, box);
  box.querySelector('[data-a=ok]').onclick = () => box.remove(); $('#view').appendChild(box); }
async function bootApp(){
  setStatus('Starting…'); if (DIAG_MANUAL) diagSetup(); await JOURNAL.open();
  const prevAll = await JOURNAL.all(); const lastRun = prevAll.length ? prevAll[prevAll.length-1].run : null;
  const prev = prevAll.filter(e => e.run === lastRun); const lastMsg = prev.length ? prev[prev.length-1].msg : null;
  let closedRun = null; try { closedRun = localStorage.getItem('ssky_closed'); } catch(e){}
  const crashed = lastMsg !== null && lastMsg !== 'closed' && lastMsg !== 'running' && closedRun !== lastRun && (/^START |GPU RESET/.test(lastMsg) || prev.some(e => /GPU RESET/.test(e.msg)));
  await JOURNAL.clear(); await JOURNAL.put(`GPU: ${GPU_NAME}`); await JOURNAL.put(`Browser: ${navigator.userAgent}`);
  if (crashed){ P.previewRes = 1024; P.previewSpp = 1; syncUI(); }
  if (crashed || /[?#&]debug/.test(location.href)) showReport(prev, crashed);
  window.DIAG = { report: () => crashReport(prev) };
  const SRC = {noise:FS_NOISE, transmittance:FS_TRANS, 'multiple scattering':FS_MS, ambient:FS_AMB, shadow:FS_SHADOW, clouds:FS_CLOUD, composite:FS_COMP,
    'mid clouds':FS_CLOUD_M, 'high clouds':FS_CLOUD_H, 'mid shadow':FS_SHADOW_M, 'high shadow':FS_SHADOW_H,
    accumulate:FS_ACCUM, display:FS_DISPLAY, 'look-dev':FS_PT, coverage:FS_COVER};
  BOOT_N = PROGRAMS.length + 10 + (PAR_EXT ? 1 : 0);
  if (PAR_EXT){   // queue every compile in the background, then collect them one by one while the page stays responsive
    await step('queueing shader compiles (background)', ()=>{ for (const [name] of PROGRAMS) SRC[name] = programStart(SRC[name]); });
    for (const [name, fn] of PROGRAMS){ LAST_STAGE = `compiling the ${name} shader`; setStatus(`Compiling shaders… ${name} (the first launch on a GPU can take a while)`);
      LOADER.set(`Compiling GPU shaders · ${name}`, 0.85*BOOT_I/BOOT_N); await JOURNAL.put('START waiting for the ' + name + ' shader'); const t0 = performance.now(); await programWait(SRC[name]);
      await step(`compiling the ${name} shader`, ()=>fn(SRC[name])); if (window.diagDone) diagDone(`compiling the ${name} shader (background ${(performance.now()-t0).toFixed(0)} ms)`, performance.now()-t0); } }
  else for (const [name, fn] of PROGRAMS) await step(`compiling the ${name} shader`, ()=>fn());
  bindAll();
  await step('building cloud noise', buildNoise);
  await step('building weather maps', buildWeather);
  await step('building atmosphere tables', ()=>{ computePhysics(); buildLUTs(); dirtyLUT = false; });
  await step('calibrating cloud cover', calibrateCoverage);
  await step('building the cloud shadow map', buildShadow);
  await step('measuring sky light', ()=>{ buildAmbient(); skyIrradiance(); });
  await step('preparing the scene', ()=>{ prepare(); dirtyScene = false; });
  await step('rendering one strip of the quick preview', ()=>{ const U = passUniforms(CTX_QUICK, 512, 256, 0, 0, QUALITY.quick, {}); const b = [0, 32, 0, 512]; cloudPass(CTX_QUICK, U, b); compPass(CTX_QUICK, U, b); });
  await step('rendering the quick preview', ()=>{ renderSample(CTX_QUICK, 0, QUALITY.quick, 512, 256, 0); previewN = 1; quickDone = true; shownCtx = CTX_QUICK; });
  await step('rendering a preview test strip', ()=>{ const pr = P.previewRes; CTX_PREVIEW = makePreviewCtx(pr); (CTX_PREVIEW.big ? renderBandBig : renderBand)(CTX_PREVIEW, 0, QUALITY.preview, 0, 8); previewN = 0; PJ = null; });
  await JOURNAL.put('START rendering the preview (frame loop)'); LAST_STAGE = 'rendering the preview';
  quickMode = false; LOADER.light(); LOADER.set('Rendering the preview…', 0.85); requestAnimationFrame(frame); if (window.diagFinish) diagFinish(); }   // edits made during start-up stay dirty and render next
bootApp();
</script>
