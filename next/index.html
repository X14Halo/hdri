<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spectral Sky Next</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%23f0c27f%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#0a0d11; --panel:#10141a; --raise:#161b23; --line:#222a35; --line2:#2c3644;
  --fg:#dde3ea; --muted:#8893a1; --faint:#5c6774;
  --accent:#9ec5ff; --accent-ink:#0b1626; --sun:#f0c27f; --moon:#bcc7d8; --warn:#e8a35a; --bad:#e8766a;
  --ui:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.45 var(--ui);overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,select,input{font:inherit;color:inherit}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 372px}
#stage{min-width:0;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;border-right:1px solid var(--line)}
/* the tool strip sits over the top of the image on large screens and in its own row above it on small ones */
#stage>*{grid-column:1} #stage>.bar{grid-row:1} #stage>.view{grid-row:2/4} #stage>.tools{grid-row:2} #stage>.readouts{grid-row:4}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 16px;border-bottom:1px solid var(--line);min-width:0}
@media (max-width:1250px){.brand .tag{display:none}}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand b{font-weight:600;font-size:15px;letter-spacing:.01em}
.brand .tag{font:11px var(--mono);color:var(--muted);letter-spacing:.04em}
.mark{width:12px;height:12px;border-radius:50%;align-self:center;background:radial-gradient(circle at 50% 50%,#fff 0 18%,var(--sun) 30%,rgba(240,194,127,0) 70%),linear-gradient(#5f8fd6,#c7dcf5);}
.pre-wrap{position:relative;flex:none}
.pre-btn{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;max-width:300px}
.pre-btn .pre-lbl{color:var(--muted)}
.pre-btn b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pre-btn .caret{color:var(--muted);font-size:10px;transition:transform .15s}
.pre-btn[aria-expanded="true"] .caret{transform:rotate(180deg)}
.presets{position:absolute;top:calc(100% + 8px);left:0;z-index:40;width:min(540px,calc(100vw - 32px));max-height:min(70vh,560px);overflow:auto;
  background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:6px 14px 14px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.pre-grp h4{margin:10px 0 7px;font:600 10.5px var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.pre-chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{flex:none;border:1px solid var(--line2);background:transparent;border-radius:999px;padding:4px 11px;color:var(--muted);cursor:pointer;white-space:nowrap}
.chip:hover{color:var(--fg);border-color:var(--faint)}
.chip.on{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.view{position:relative;min-height:0;background:#07090c;overflow:hidden;touch-action:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.overlay{position:absolute;inset:0;pointer-events:none}
.compass{position:absolute;font:10px var(--mono);color:rgba(230,236,244,.7);transform:translateX(-50%);letter-spacing:.06em}
.hline{position:absolute;height:0;border-top:1px dashed rgba(230,236,244,.18)}
.tools{position:relative;z-index:15;align-self:start;justify-self:start;margin:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:calc(100% - 24px);min-width:0}
.seg{display:inline-flex;background:rgba(16,20,26,.86);border:1px solid var(--line2);border-radius:8px;padding:2px;backdrop-filter:blur(6px)}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:6px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--raise);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.seg button:hover{color:var(--fg)}
.expo{display:inline-flex;align-items:center;gap:8px;background:rgba(16,20,26,.86);border:1px solid var(--line2);border-radius:8px;padding:4px 10px;backdrop-filter:blur(6px)}
.expo input[type=range]{width:110px}
.expo .v{font:11px var(--mono);color:var(--muted);min-width:66px}
.status{position:absolute;right:12px;bottom:10px;font:11px var(--mono);color:var(--muted);background:rgba(10,13,17,.8);padding:3px 8px;border-radius:6px}
.brush{position:absolute;border:1.5px solid #5fd08c;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.45),inset 0 0 0 1px rgba(0,0,0,.25)}
.brush.rem{border-color:#f0675c}
.hint{position:absolute;left:12px;bottom:10px;font:11px var(--mono);color:var(--muted);background:rgba(10,13,17,.8);padding:3px 8px;border-radius:6px}
.map{width:100%;aspect-ratio:2/1;border-radius:6px;display:block;cursor:crosshair;background:#0f1a26;touch-action:none;max-width:100%}
.tgrid{display:flex;flex-wrap:wrap;gap:6px}
.tchip{border:1px solid var(--line2);background:var(--raise);border-radius:6px;padding:4px 8px;cursor:pointer;font:11px var(--mono);font-variant-numeric:tabular-nums;color:var(--fg);text-align:left;display:grid;gap:1px}
.tchip span{font:10px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tchip:hover{border-color:var(--faint)}
.btn.rand{flex:none;padding:5px 12px;border-radius:999px}
.variety{flex:none;display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted)}
.variety input[type=range]{width:84px}
.variety b{font:600 11px var(--mono);color:var(--fg);min-width:62px}
.legend{position:absolute;left:12px;bottom:10px;display:flex;align-items:center;gap:6px;font:10px var(--mono);color:var(--muted);background:rgba(10,13,17,.8);padding:4px 8px;border-radius:6px}
.legend i{display:block;width:180px;height:8px;border-radius:2px;background:linear-gradient(90deg,#30123b,#4662d7,#36aaf9,#1ae4b6,#72fe5e,#c7ef34,#faba39,#f66b19,#ca2a04,#7a0403)}
.readouts{display:flex;flex-wrap:wrap;gap:0;border-top:1px solid var(--line);background:var(--panel)}
.ro{padding:8px 14px;border-right:1px solid var(--line);min-width:0}
.ro .k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.ro .v{font:500 13px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.ro .v small{color:var(--muted);font-weight:400;font-size:11px}
#panel{background:var(--panel);overflow-y:auto;min-width:0;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.sec{border-bottom:1px solid var(--line)}
.sec>h2{margin:0;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:12px 16px 4px;display:flex;justify-content:space-between;align-items:center}
.sec>h2 span{font:10px var(--mono);letter-spacing:0;text-transform:none;color:var(--faint)}
.rows{display:grid;gap:2px;padding:4px 16px 14px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:2px 10px;padding:3px 0}
.row label{color:var(--fg);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .val{font:12px var(--mono);color:var(--accent);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.row input[type=range]{grid-column:1/-1}
.row select,.row input[type=date],.row input[type=time],.row input[type=number]{background:var(--raise);border:1px solid var(--line2);border-radius:6px;padding:4px 6px;max-width:190px}
.row.full{grid-template-columns:1fr}
.note{color:var(--muted);font-size:12px;line-height:1.45}
.note b{color:var(--fg);font-weight:500}
.mono{font-family:var(--mono)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--line2);border-radius:2px}
input[type=range]::-moz-range-track{height:3px;background:var(--line2);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--fg);margin-top:-5px;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--faint)}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--fg);border:2px solid var(--panel)}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 2px var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line2);background:var(--raise);border-radius:7px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.err{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--fg);background:var(--bg)}
.err p{max-width:52ch;color:var(--muted)}
.safe-note{position:absolute;left:12px;right:12px;bottom:12px;z-index:30;max-width:560px;background:rgba(16,20,26,.94);border:1px solid var(--warn);border-radius:10px;padding:10px 12px;color:var(--fg);font-size:12.5px;line-height:1.5}
.safe-note i{color:var(--warn);font-style:normal}
.safe-note .btn{margin-left:8px;padding:2px 10px}
.ldc-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin:4px 0 2px}
.ldc-sw{aspect-ratio:1;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.ldc-hist{width:100%;height:auto;display:block;background:var(--raise);border-radius:6px;margin-top:4px}
.swatch{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
/* small screens: the tools get their own row, so nothing covers the image */
@media (max-width:860px), (max-height:560px){
  #stage>.view{grid-row:3} #stage>.tools{grid-row:2}
  .tools{margin:0;padding:8px 10px;max-width:none;justify-self:stretch;gap:6px;border-bottom:1px solid var(--line);background:var(--bg)}
  .seg button{padding:5px 9px}
  .tools .seg{flex-wrap:wrap;max-width:100%}
  .expo input[type=range]{width:90px}
}
@media (max-width:860px){
  body{overflow:auto}
  #app{grid-template-columns:1fr;height:auto}
  /* a 2:1 panorama fills the width; look-around gets a little more height */
  #stage{border-right:0;grid-template-rows:auto auto clamp(200px, 62vw, 60vh) auto}
  #panel{overflow:visible}
  .bar{flex-wrap:wrap;gap:8px;padding:10px 12px}
  .presets{width:calc(100vw - 24px)}
  .ro{padding:6px 10px}
}
/* short landscape screens (phones turned sideways): one scrolling row of tools and of readouts, a narrower rack */
@media (max-height:560px) and (min-width:561px){
  body{overflow:hidden}
  #app{height:100%;grid-template-columns:minmax(0,1fr) min(320px, 40vw)}
  #stage{border-right:1px solid var(--line);grid-template-rows:auto auto minmax(0,1fr) auto}
  #panel{overflow-y:auto}
  .bar{flex-wrap:nowrap;overflow-x:auto;padding:6px 10px;gap:8px;scrollbar-width:none}
  .brand .tag{display:none}
  .tools{flex-wrap:nowrap;overflow-x:auto;padding:6px 10px;scrollbar-width:none}
  .tools>*{flex:none}
  .readouts{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .ro{padding:4px 10px;flex:none}
  .ro .k{font-size:9px}
  .ro .v{font-size:12px}
}
.loader{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(7,9,12,.86);transition:opacity .45s ease,background .45s ease}
.loader.light{background:rgba(7,9,12,.3)}
.loader.gone{opacity:0;pointer-events:none}
.ld-card{width:min(340px,100%);background:rgba(16,20,26,.94);border:1px solid var(--line2);border-radius:12px;padding:18px 20px 16px;text-align:center;box-shadow:0 16px 48px rgba(0,0,0,.5)}
.ld-spin{width:30px;height:30px;margin:0 auto 12px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--sun);animation:ldspin .9s linear infinite}
@keyframes ldspin{to{transform:rotate(360deg)}}
.ld-title{font-weight:600;font-size:14px}
.ld-step{color:var(--muted);margin-top:3px;min-height:1.45em;font-size:12.5px}
.ld-bar{height:3px;background:var(--line2);border-radius:2px;margin-top:12px;overflow:hidden}
.ld-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s ease}
.ld-hint{color:var(--faint);font-size:11.5px;margin-top:10px;line-height:1.45}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}.ld-spin{animation-duration:3s}.loader,.ld-bar i{transition:none}}

</style>
</head>
<body>
<div id="app">
  <section id="stage">
    <header class="bar">
      <div class="brand"><span class="mark" aria-hidden="true"></span><b>Spectral Sky</b><span class="tag">Next · WebGPU · 24-band</span></div>
    </header>
    <div class="tools" id="tools">
      <div class="seg" id="viewSeg" role="group" aria-label="View">
        <button data-v="0" class="on">Panorama</button><button data-v="1">Look around</button><button data-v="2">Luminance</button>
      </div>
      <div class="expo"><label><input type="checkbox" id="autoEx" checked> Auto</label><input type="range" id="exSlider" min="-8" max="8" step="0.1" value="0" aria-label="Exposure"><span class="v" id="exVal">±0.0 EV</span></div>
      <div class="seg" id="resSeg" role="group" aria-label="Preview resolution">
        <button data-r="1024" class="on">1K</button><button data-r="2048">2K</button><button data-r="4096">4K</button>
      </div>
    </div>
    <div class="view" id="view">
      <canvas id="gl"></canvas>
      <div class="overlay" id="overlay"></div>
      <div class="loader" id="loader" role="status" aria-live="polite">
        <div class="ld-card"><div class="ld-spin" aria-hidden="true"></div>
          <div class="ld-title" id="ldTitle">Loading Spectral Sky</div>
          <div class="ld-step" id="ldStep">Starting…</div>
          <div class="ld-hint" id="ldHint">Needs a browser with WebGPU (Chrome, Edge, Safari 26 or newer).</div></div></div>
      <div class="legend" id="legend" hidden><span>10⁻⁴</span><i></i><span>10⁹ cd/m²</span></div>
      <div class="status" id="status">Starting…</div>
    </div>
    <footer class="readouts" id="readouts"></footer>
  </section>
  <aside id="panel"></aside>
</div>
<script>
// Spectral Sky Next — shared core: constants, spectral tables, vectors, ephemerides.
// Loaded by both the UI thread and the render worker.
// Units: lengths km, extinction 1/km, spectral irradiance W·m⁻²·nm⁻¹, radiance W·m⁻²·sr⁻¹·nm⁻¹; output CIE XYZ, Y in cd/m².
'use strict';
const NL = 24, NG = 6, DL = 15;
const LAM = Array.from({length:NL}, (_,i) => 387.5 + DL*i);
const f32 = a => new Float32Array(a);
const clamp = (x,a,b) => Math.min(b, Math.max(a, x));
const D2R = Math.PI/180, R2D = 180/Math.PI;

/* ---------- spectral tables ---------- */
function lerpT(t, x){ if (x<=t[0][0]) return t[0][1]; const n=t.length; if (x>=t[n-1][0]) return t[n-1][1];
  for (let i=1;i<n;i++) if (x<=t[i][0]){ const a=t[i-1], b=t[i]; return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0]); } }
const binAvg = (fn,l) => { let s=0; for (let k=-7;k<=7;k++) s+=fn(l+k); return s/15; };
// Extraterrestrial solar spectral irradiance at 1 AU (W m^-2 nm^-1), smoothed ASTM E-490
const SOLAR=[[380,1.10],[390,1.09],[400,1.69],[410,1.70],[420,1.75],[430,1.60],[440,1.83],[450,2.05],[460,2.07],[470,2.03],[480,2.07],[490,1.95],[500,1.95],[510,1.89],[520,1.85],[530,1.92],[540,1.86],[550,1.88],[560,1.83],[570,1.83],[580,1.84],[590,1.77],[600,1.75],[610,1.71],[620,1.66],[630,1.62],[640,1.60],[650,1.53],[660,1.52],[670,1.51],[680,1.47],[690,1.43],[700,1.41],[710,1.38],[720,1.35],[730,1.32],[740,1.28],[750,1.26],[760,1.23]];
// O3 absorption cross-section, 293 K (cm^2) — Chappuis band
const O3XS=[[380,0.2e-23],[400,1.0e-23],[425,6.0e-23],[450,2.7e-22],[475,6.5e-22],[500,1.4e-21],[525,2.5e-21],[550,3.3e-21],[575,4.6e-21],[600,5.1e-21],[625,4.2e-21],[650,2.6e-21],[675,1.4e-21],[700,0.8e-21],[725,0.55e-21],[750,0.4e-21],[780,0.3e-21]];
// CIE 1931 2° colour matching functions (Wyman–Sloan–Shirley multi-lobe fit)
const gl_ = (x,m,s1,s2) => { const t=(x-m)/(x<m?s1:s2); return Math.exp(-0.5*t*t); };
const xbar = l => 1.056*gl_(l,599.8,37.9,31.0)+0.362*gl_(l,442.0,16.0,26.7)-0.065*gl_(l,501.1,20.4,26.2);
const ybar = l => 0.821*gl_(l,568.8,46.9,40.5)+0.286*gl_(l,530.9,16.3,31.1);
const zbar = l => 1.217*gl_(l,437.0,11.8,36.0)+0.681*gl_(l,459.0,26.0,13.8);
const CMFX = LAM.map(l=>binAvg(xbar,l)*DL*683), CMFY = LAM.map(l=>binAvg(ybar,l)*DL*683), CMFZ = LAM.map(l=>binAvg(zbar,l)*DL*683);
const SOLAR_BIN = LAM.map(l=>binAvg(x=>lerpT(SOLAR,x),l));
// Spectral ground reflectance (directional-hemispherical, treated as Lambertian)
const SURFACES = {
  grey:{name:'Neutral (set albedo)', t:null},
  grass:{name:'Green grass', t:[[400,.04],[450,.05],[500,.07],[550,.12],[600,.08],[650,.06],[680,.05],[700,.15],[720,.35],[740,.45]]},
  drygrass:{name:'Dry grass / savanna', t:[[400,.07],[500,.10],[550,.14],[600,.20],[650,.24],[700,.28],[740,.32]]},
  sand:{name:'Desert sand', t:[[400,.15],[450,.20],[500,.27],[550,.33],[600,.39],[650,.43],[700,.46],[740,.48]]},
  soil:{name:'Bare soil', t:[[400,.06],[500,.09],[600,.13],[700,.17],[740,.19]]},
  snow:{name:'Fresh snow', t:[[400,.96],[550,.95],[700,.92],[740,.90]]},
  asphalt:{name:'Asphalt', t:[[400,.05],[740,.09]]},
  concrete:{name:'Concrete', t:[[400,.22],[550,.30],[740,.35]]},
  water:{name:'Water (diffuse approx.)', t:[[400,.08],[550,.05],[740,.03]]},
};
const AEROSOLS = {
  continental:{name:'Continental', alpha:1.3, ssa:()=>0.93, g:0.70, hyg:0.35},
  maritime:{name:'Maritime', alpha:0.45, ssa:()=>0.985, g:0.76, hyg:0.45},
  urban:{name:'Urban / industrial', alpha:1.45, ssa:()=>0.82, g:0.66, hyg:0.30},
  desert:{name:'Desert dust', alpha:0.25, ssa:l=>0.80+0.17*clamp((l-400)/300,0,1), g:0.73, hyg:0.05},
  smoke:{name:'Wildfire smoke', alpha:1.85, ssa:l=>0.86+0.06*clamp((l-400)/300,0,1), g:0.62, hyg:0.15},
  clean:{name:'Clean / polar', alpha:1.4, ssa:()=>0.97, g:0.70, hyg:0.30},
};
const ICE_N=[[400,1.3185],[450,1.3150],[500,1.3126],[550,1.3110],[600,1.3096],[650,1.3086],[700,1.3075],[750,1.3065]];
// Rayleigh: Peck–Reeder refractivity, Bates/Bodhaine King factor, Ns at 15°C/1013.25 hPa
function rayleighKm(lnm){ const l=lnm*1e-3, s2=1/(l*l);
  const n1=(8060.51+2480990/(132.274-s2)+17455.7/(39.32957-s2))*1e-8, n=1+n1;
  const FN2=1.034+3.17e-4*s2, FO2=1.096+1.385e-3*s2+1.448e-4*s2*s2, co2=0.042;
  const F=(78.084*FN2+20.946*FO2+0.934+co2*1.15)/(78.084+20.946+0.934+co2);

moonOn); v4('moonLight', ...ml, moonRad*P.moonScale);\n  v4('pole', ...pole, sunSquash(sunEl));\n  v4('eqX', ...eqX, sunEl < 0 ? 1 : 0); v4('eqY', ...eqY, P.stars ? 1 : 0); v4('eqZ', ...zp, P.starMag);\n  v4('galX', ...GALACTIC.x, P.mw); v4('galY', ...GALACTIC.y, Math.round(15*Math.log10(4600/2500))); v4('galZ', ...GALACTIC.z, P.includeSun ? 1 : 0);\n  v4('opts', P.atmSteps || 32, P.groundMode === 'black' ? 1 : 0, P.includeSun ? 1 : 0, 0);\n  // the tables depend only on the air and the ground, not on the sun (except the sky irradiance table, rebuilt per change)\n  const atmKey = [aodE, HM, alphaE, fogS, fogH, P.aerosol, P.ozone, P.surface, P.albedo, RH, P.siteAlt || 0].map(v => typeof v === 'number' ? v.toPrecision(5) : v).join('|');\n  const i550 = 11, h = P.camH, b550 = BETA_R[i550]*altK*Math.exp(-h/8) + (F[FRAME_OFF.BMs + i550] + F[FRAME_OFF.BMa + i550])*Math.exp(-h/HM) + fogS*Math.exp(-h/fogH);\n  const derived = {sunAz, sunEl, moonAz, moonEl, vis:3.912/b550, aodE, illum:(1 + Math.cos(phase))/2, phaseDeg, RHp, dawn, dusk, mistVis:mistS ? 3.912/mistS : 0};\n  return {frame:F, atmKey, derived};\n}\n\nconst WGSL = {\"atmo\":\"// ---------- lookups into the atmosphere tables (needs transTex, msTex, linSamp, amb bound by the including shader) ----------\\nfn transmittance(g: u32, r0: f32, mu: f32) -> vec4f {\\n  let r = max(r0, Rg + 1e-4);\\n  let H = sqrt(Rt*Rt - Rg*Rg); let rho = sqrt(max((r - Rg)*(r + Rg), 0.0));\\n  let d = distToTop(r, mu); let dmin = Rt - r; let dmax = rho + H;\\n  let xmu = clamp((d - dmin)/max(dmax - dmin, 1e-6), 0.0, 1.0); let xr = rho/H;\\n  let uv = vec2f(0.5/256.0 + xmu*(255.0/256.0), 0.5/64.0 + xr*(63.0/64.0));\\n  let T = textureSampleLevel(transTex, linSamp, uv, i32(g), 0.0);\\n  // the planet's shadow edge, softened over the solar disc\\n  let muH = -rho/r; let eps = 0.00465*sqrt(max(1.0 - muH*muH, 0.0)) + 1e-5;\\n  return T*smoothstep(muH - eps, muH + eps, mu);\\n}\\nfn msLUT(g: u32, h: f32, mus: f32) -> vec4f {\\n  var uv = vec2f(clamp(mus*0.5 + 0.5, 0.0, 1.0), sqrt(clamp(h/100.0, 0.0, 1.0)));\\n  uv = (0.5 + uv*31.0)/32.0;\\n  return textureSampleLevel(msTex, linSamp, uv, i32(g), 0.0);\\n}\\n// clear-sky irradiance on a level surface facing up (sky only, no direct sun or moon) at height h km\\nfn ambE(g: u32, h: f32) -> vec4f {\\n  let x = sqrt(clamp(h/20.0, 0.0, 1.0))*31.0; let i0 = u32(floor(x)); let i1 = min(i0 + 1u, 31u); let f = x - f32(i0);\\n  return mix(amb[i0*6u + g], amb[i1*6u + g], f);\\n}\\n\",\"common\":\"// ---------- shared constants, frame uniforms and atmosphere functions ----------\\n// Spectrum: 24 bands (387.5 … 732.5 nm, 15 nm wide), stored as 6 vec4 groups.\\nconst PI: f32 = 3.14159265358979;\\nconst Rg: f32 = 6360.0;          // planet radius, km\\nconst Rt: f32 = 6460.0;          // top of the atmosphere, km\\nconst C0: vec3f = vec3f(0.0, -6360.0, 0.0);   // planet centre; the camera stands at (0, camH, 0)\\n\\nstruct Frame {\\n  BR: array<vec4f, 6>,    // Rayleigh scattering at sea level, 1/km\\n  BMs: array<vec4f, 6>,   // aerosol scattering at the ground\\n  BMa: array<vec4f, 6>,   // aerosol absorption\\n  BO: array<vec4f, 6>,    // ozone absorption at the layer peak\\n  Alb: array<vec4f, 6>,   // ground albedo\\n  SunE: array<vec4f, 6>,  // solar irradiance at the top of the atmosphere\\n  MoonE: array<vec4f, 6>, // lunar irradiance\\n  SunK: array<vec4f, 6>,  // solar disc radiance at its centre\\n  SunA: array<vec4f, 6>,  // limb darkening exponent\\n  MoonK: array<vec4f, 6>, // lunar disc radiance scale\\n  Air: array<vec4f, 6>,   // airglow radiance at the zenith\\n  CMFx: array<vec4f, 6>, CMFy: array<vec4f, 6>, CMFz: array<vec4f, 6>,\\n  Star: array<vec4f, 96>, // blackbody spectra (16 temperatures × 6 groups), 1 cd/m² per unit\\n  atm: vec4f,      // x HR (Rayleigh scale height), y HM (aerosol scale height), z fog extinction, w fog scale height\\n  atm2: vec4f,     // x aerosol asymmetry g, y camera height km, z azimuth offset rad, w sun angular radius rad\\n  fogPh: vec4f,    // fog droplet phase (gHG, gD, alpha, wD)\\n  sunDir: vec4f,   // xyz, w sun on\\n  moonDir: vec4f,  // xyz, w moon on\\n  moonLight: vec4f,// direction of sunlight at the Moon, w moon angular radius\\n  pole: vec4f,     // celestial pole, w sun disc squash (refraction)\\n  eqX: vec4f, eqY: vec4f, eqZ: vec4f,   // equatorial frame; w: night, stars on, faintest star magnitude\\n  galX: vec4f, galY: vec4f, galZ: vec4f,// galactic frame; w: Milky Way strength, its spectrum index, include sun disc\\n  opts: vec4f,     // x atmosphere steps, y sky only (no ground), z sun disc on, w unused\\n}\\n\\nstruct Pass { rowOff: u32, frame: u32, W: u32, H: u32 }\\n\\nfn pcg3d(v0: vec3u) -> vec3u {\\n  var v = v0*1664525u + 1013904223u;\\n  v.x += v.y*v.z; v.y += v.z*v.x; v.z += v.x*v.y;\\n  v ^= v >> vec3u(16u);\\n  v.x += v.y*v.z; v.y += v.z*v.x; v.z += v.x*v.y;\\n  return v;\\n}\\nfn hash3(v: vec3u) -> vec3f { return vec3f(pcg3d(v))*(1.0/4294967295.0); }\\n\\n// ray/sphere around the planet centre from radius r, cos-zenith mu: (near, far), near < 0 … no hit gives (-1, -1)\\nfn sphereHit(r: f32, mu: f32, R: f32) -> vec2f {\\n  let b = -r*mu; let c = (r - R)*(r + R); let disc = b*b - c;\\n  if (disc < 0.0) { return vec2f(-1.0, -1.0); }\\n  let s = sqrt(disc); let q = select(b - s, b + s, b >= 0.0);\\n  let t1 = q; let t2 = select(0.0, c/q, abs(q) > 1e-12);\\n  return vec2f(min(t1, t2), max(t1, t2));\\n}\\nfn distToTop(r: f32, mu: f32) -> f32 { return max(sphereHit(r, mu, Rt).y, 0.0); }\\n// ground hit distance along the ray, or -1\\nfn groundHit(r: f32, mu: f32) -> f32 { let h = sphereHit(r, mu, Rg); if (h.x > 0.0) { return h.x; } return -1.0; }\\n\\nfn densR(h: f32) -> f32 { return exp(-h/F.atm.x); }\\nfn densM(h: f32) -> f32 { return exp(-h/F.atm.y); }\\nfn densO(h: f32) -> f32 { return max(0.0, 1.0 - abs(h - 25.0)/15.0); }\\nfn densF(h: f32) -> f32 { return F.atm.z*exp(-h/F.atm.w); }\\nfn extinctionAt(g: u32, h: f32) -> vec4f {\\n  return F.BR[g]*densR(h) + (F.BMs[g] + F.BMa[g])*densM(h) + F.BO[g]*densO(h) + vec4f(densF(h));\\n}\\nfn scatterAt(g: u32, h: f32) -> vec4f { return F.BR[g]*densR(h) + F.BMs[g]*densM(h) + vec4f(densF(h)); }\\n\\nfn phaseR(c: f32) -> f32 { let gm = 0.01415; return 3.0/(16.0*PI*(1.0 + 2.0*gm))*((1.0 + 3.0*gm) + (1.0 - gm)*c*c); }\\nfn phaseCS(c0: f32, g: f32) -> f32 { let c = clamp(c0, -1.0, 1.0); let g2 = g*g;\\n  return 3.0/(8.0*PI)*(1.0 - g2)*(1.0 + c*c)/((2.0 + g2)*pow(max(1.0 + g2 - 2.0*g*c, 1e-6), 1.5)); }\\nfn phaseHG(c0: f32, g: f32) -> f32 { let c = clamp(c0, -1.0, 1.0); let g2 = g*g; return (1.0 - g2)/(4.0*PI*pow(max(1.0 + g2 - 2.0*g*c, 1e-7), 1.5)); }\\nfn phaseDraine(c0: f32, g: f32, a: f32) -> f32 { let c = clamp(c0, -1.0, 1.0); let g2 = g*g;\\n  return (1.0 - g2)*(1.0 + a*c*c)/(4.0*PI*(1.0 + a*(1.0 + 2.0*g2)/3.0)*pow(max(1.0 + g2 - 2.0*g*c, 1e-7), 1.5)); }\\nfn phaseFog(c: f32) -> f32 { return mix(phaseHG(c, F.fogPh.x), phaseDraine(c, F.fogPh.y, F.fogPh.z), F.fogPh.w); }\\n\\nfn dirFromPixel(px: vec2f, W: f32, H: f32) -> vec3f {\\n  let az = (px.x/W - 0.5)*2.0*PI + F.atm2.z; let el = (0.5 - px.y/H)*PI;\\n  return normalize(vec3f(sin(az)*cos(el), sin(el), cos(az)*cos(el)));\\n}\\nfn toXYZ(L: array<vec4f, 6>) -> vec3f {\\n  var xyz = vec3f(0.0);\\n  for (var g = 0u; g < 6u; g++) { xyz += vec3f(dot(L[g], F.CMFx[g]), dot(L[g], F.CMFy[g]), dot(L[g], F.CMFz[g])); }\\n  return xyz;\\n}\\n\",\"display\":\"// ---------- display: the accumulated panorama, exposed and tone mapped (AgX), as a panorama or a pinhole camera ----------\\nstruct Disp {\\n  canvas: vec2f, pano: vec2f,      // canvas size px; panorama size px\\n  rect: vec4f,                     // panorama placement in the canvas (x, y, w, h)\\n  view: vec4f,                     // x mode (0 panorama, 1 look around, 2 luminance), y yaw, z pitch, w vertical fov\\n  ex: vec4f,                       // x exposure (multiplies cd/m²), y azimuth offset\\n}\\n@group(0) @binding(0) var<uniform> D: Disp;\\n@group(0) @binding(1) var<storage, read> accum: array<vec4f>;\\n\\nstruct VO { @builtin(position) pos: vec4f }\\n@vertex fn vs(@builtin(vertex_index) i: u32) -> VO {\\n  let p = vec2f(f32((i << 1u) & 2u), f32(i & 2u));\\n  var o: VO; o.pos = vec4f(p*2.0 - 1.0, 0.0, 1.0); return o;\\n}\\nfn agxContrast(x: vec3f) -> vec3f { let x2 = x*x; let x4 = x2*x2; return 15.5*x4*x2 - 40.14*x4*x + 31.96*x4 - 6.868*x2*x + 0.4298*x2 + 0.1191*x - 0.00232; }\\nfn agx(v0: vec3f) -> vec3f {\\n  let M = mat3x3f(0.842479062253094, 0.0423282422610123, 0.0423756549057051, 0.0784335999999992, 0.878468636469772, 0.0784336, 0.0792237451477643, 0.0791661274605434, 0.879142973793104);\\n  let Mi = mat3x3f(1.19687900512017, -0.0528968517574562, -0.0529716355144438, -0.0980208811401368, 1.15190312990417, -0.0980434501171241, -0.0990297440797205, -0.0989611768448433, 1.15107367264116);\\n  let mn = -12.47393; let mx = 4.026069;\\n  var v = M*v0; v = clamp(log2(max(v, vec3f(1e-10))), vec3f(mn), vec3f(mx)); v = (v - mn)/(mx - mn);\\n  return clamp(Mi*agxContrast(v), vec3f(0.0), vec3f(1.0));\\n}\\nfn turbo(x: f32) -> vec3f {\\n  let kR = vec4f(0.13572138, 4.61539260, -42.66032258, 132.13108234); let kR2 = vec2f(-152.94239396, 59.28637943);\\n  let kG = vec4f(0.09140261, 2.19418839, 4.84296658, -14.18503333); let kG2 = vec2f(4.27729857, 2.82956604);\\n  let kB = vec4f(0.10667330, 12.64194608, -60.58204836, 110.36276771); let kB2 = vec2f(-89.90310912, 27.34824973);\\n  let v4 = vec4f(1.0, x, x*x, x*x*x); let v2 = v4.zw*v4.z;\\n  return clamp(vec3f(dot(v4, kR) + dot(v2, kR2), dot(v4, kG) + dot(v2, kG2), dot(v4, kB) + dot(v2, kB2)), vec3f(0.0), vec3f(1.0));\\n}\\nfn texel(x: i32, y: i32) -> vec3f {\\n  let W = i32(D.pano.x); let H = i32(D.pano.y);\\n  let xx = ((x % W) + W) % W; let yy = clamp(y, 0, H - 1);\\n  let a = accum[u32(yy*W + xx)]; return a.xyz/max(a.w, 1e-6);\\n}\\nfn samplePano(uv: vec2f) -> vec3f {   // bilinear, wrapping in azimuth\\n  let p = uv*D.pano - 0.5; let i = floor(p); let f = p - i; let x = i32(i.x); let y = i32(i.y);\\n  return mix(mix(texel(x, y), texel(x + 1, y), f.x), mix(texel(x, y + 1), texel(x + 1, y + 1), f.x), f.y);\\n}\\n@fragment fn fs(v: VO) -> @location(0) vec4f {\\n  let fc = v.pos.xy; var xyz: vec3f;\\n  let mode = i32(D.view.x);\\n  if (mode == 1) {\\n    // look around: pinhole camera (yaw from north, clockwise; pitch up)\\n    let ndc = vec2f(fc.x/D.canvas.x*2.0 - 1.0, 1.0 - fc.y/D.canvas.y*2.0); let tf = tan(D.view.w*0.5);\\n    let dc = normalize(vec3f(ndc.x*tf*D.canvas.x/D.canvas.y, ndc.y*tf, 1.0));\\n    let cy = cos(D.view.y); let sy = sin(D.view.y); let cp = cos(D.view.z); let sp = sin(D.view.z);\\n    let fwd = vec3f(sy*cp, sp, cy*cp); let right = normalize(vec3f(cy, 0.0, -sy)); let up = cross(fwd, right);\\n    let d = normalize(fwd*dc.z + right*dc.x + up*dc.y);\\n    let az = atan2(d.x, d.z) - D.ex.y; let el = asin(clamp(d.y, -1.0, 1.0));\\n    xyz = samplePano(vec2f(fract(az/(2.0*PI) + 0.5), 0.5 - el/PI));\\n  } else {\\n    let q = (fc - D.rect.xy)/D.rect.zw;\\n    if (any(q < vec2f(0.0)) || any(q > vec2f(1.0))) { return vec4f(0.027, 0.035, 0.047, 1.0); }\\n    xyz = texel(i32(q.x*D.pano.x), i32(q.y*D.pano.y));\\n  }\\n  if (mode == 2) { let l = (log(max(xyz.y, 1e-7))/log(10.0) + 4.0)/13.0; return vec4f(turbo(clamp(l, 0.0, 1.0)), 1.0); }\\n  let X2R = mat3x3f(3.2404542, -0.9692660, 0.0556434, -1.5371385, 1.8760108, -0.2040259, -0.4985314, 0.0415560, 1.0572252);\\n  let lin = max(X2R*xyz, vec3f(0.0))*D.ex.x;\\n  return vec4f(agx(lin), 1.0);\\n}\\nconst PI: f32 = 3.14159265358979;\\n\",\"luts\":\"// ---------- atmosphere tables: transmittance, multiple scattering (Hillaire 2020), sky irradiance vs height ----------\\n// three entry points; each pipeline binds only what its entry point uses\\n@group(0) @binding(0) var<uniform> F: Frame;\\n@group(0) @binding(1) var transOut: texture_storage_2d_array<rgba16float, write>;\\n@group(0) @binding(2) var transTex: texture_2d_array<f32>;\\n@group(0) @binding(3) var msTex: texture_2d_array<f32>;\\n@group(0) @binding(4) var linSamp: sampler;\\n@group(0) @binding(5) var msOut: texture_storage_2d_array<rgba16float, write>;\\n@group(0) @binding(6) var<storage, read_write> ambOut: array<vec4f>;\\n@group(0) @binding(7) var<storage, read> amb: array<vec4f>;   // (unused here; atmo.wgsl names it)\\n\\n@compute @workgroup_size(8, 8, 1)\\nfn transLUT(@builtin(global_invocation_id) id: vec3u) {\\n  if (id.x >= 256u || id.y >= 64u) { return; }\\n  let g = id.z;\\n  let xmu = f32(id.x)/255.0; let xr = f32(id.y)/63.0;\\n  let H = sqrt(Rt*Rt - Rg*Rg); let rho = H*xr; let r = sqrt(rho*rho + Rg*Rg);\\n  let dmin = Rt - r; let dmax = rho + H; let d = dmin + xmu*(dmax - dmin);\\n  let mu = select(clamp((H*H - rho*rho - d*d)/(2.0*r*d), -1.0, 1.0), 1.0, d <= 0.0);\\n  var tau = vec4f(0.0); let N = 80; let dt = d/f32(N);\\n  for (var i = 0; i < N; i++) {\\n    let t = (f32(i) + 0.5)*dt; let h = sqrt(max(r*r + t*t + 2.0*r*mu*t, 0.0)) - Rg;\\n    tau += extinctionAt(g, max(h, 0.0))*dt;\\n  }\\n  textureStore(transOut, vec2u(id.xy), g, exp(-tau));\\n}\\n\\n@compute @workgroup_size(8, 8, 1)\\nfn msLUTpass(@builtin(global_invocation_id) id: vec3u) {\\n  if (id.x >= 32u || id.y >= 32u) { return; }\\n  let g = id.z;\\n  let uv = vec2f(id.xy)/31.0; let mus = uv.x*2.0 - 1.0; let h = max(uv.y*uv.y*100.0, 0.005); let r = Rg + h;\\n  let sd = vec3f(sqrt(max(1.0 - mus*mus, 0.0)), mus, 0.0); let pos = vec3f(0.0, r, 0.0);\\n  var L2 = vec4f(0.0); var fms = vec4f(0.0);\\n  for (var i = 0; i < 8; i++) { for (var j = 0; j < 8; j++) {\\n    let u = (f32(i) + 0.5)/8.0; let v = (f32(j) + 0.5)/8.0; let ct = 1.0 - 2.0*v; let st = sqrt(max(1.0 - ct*ct, 0.0)); let ph = 2.0*PI*u;\\n    let rd = vec3f(st*cos(ph), ct, st*sin(ph)); let mu = ct;\\n    let gN = groundHit(r, mu); let hitG = gN > 0.0;\\n    let tmax = select(distToTop(r, mu), gN, hitG);\\n    let N = 24; let dt = tmax/f32(N); var T = vec4f(1.0);\\n    for (var k = 0; k < N; k++) {\\n      let t = (f32(k) + 0.5)*dt; let p = pos + rd*t; let rr = length(p); let hh = rr - Rg; let up = p/rr;\\n      let sT = extinctionAt(g, hh); let sS = scatterAt(g, hh); let Ts = transmittance(g, rr, dot(up, sd));\\n      let att = exp(-sT*dt); let S = sS*Ts*(0.25/PI);\\n      L2 += T*(S - S*att)/max(sT, vec4f(1e-9)); fms += T*(sS - sS*att)/max(sT, vec4f(1e-9)); T *= att;\\n    }\\n    if (hitG) { let p = pos + rd*gN; let up = normalize(p); let m = dot(up, sd); L2 += T*transmittance(g, Rg, m)*max(m, 0.0)*F.Alb[g]/PI; }\\n  } }\\n  L2 /= 64.0; fms /= 64.0;\\n  textureStore(msOut, vec2u(id.xy), g, L2/max(vec4f(1.0) - fms, vec4f(1e-3)));\\n}\\n\\n// sky irradiance on a level surface at 32 heights (0 … 20 km, square-root spaced), cosine-weighted directions\\n@compute @workgroup_size(32, 1, 1)\\nfn ambPass(@builtin(global_invocation_id) id: vec3u) {\\n  let hi = id.x; let g = id.y;\\n  let x = f32(hi)/31.0; let h = x*x*20.0; let r = Rg + h; let pos = vec3f(0.0, r, 0.0);\\n  let Ls = F.sunDir.xyz; let Lm = F.moonDir.xyz;\\n  var E = vec4f(0.0);\\n  for (var i = 0; i < 8; i++) { for (var j = 0; j < 16; j++) {\\n    let u1 = (f32(i) + 0.5)/8.0; let u2 = (f32(j) + 0.5)/16.0; let rr = sqrt(u1); let ph = 2.0*PI*u2;\\n    let rd = vec3f(rr*cos(ph), sqrt(1.0 - u1), rr*sin(ph)); let tmax = distToTop(r, rd.y);\\n    let cS = dot(rd, Ls); let cM = dot(rd, Lm);\\n    let pRs = phaseR(cS); let pMs = phaseCS(cS, F.atm2.x); let pFs = phaseFog(cS);\\n    let pRm = phaseR(cM); let pMm = phaseCS(cM, F.atm2.x); let pFm = phaseFog(cM);\\n    let N = 16; var T = vec4f(1.0); var L = vec4f(0.0);\\n    for (var k = 0; k < N; k++) {\\n      let f0 = f32(k)/f32(N); let f1 = f32(k + 1)/f32(N); let ta = tmax*f0*f0; let tb = tmax*f1*f1; let dt = tb - ta;\\n      let p = pos + rd*(ta + 0.5*dt); let rp = length(p); let hp = rp - Rg; let up = p/rp;\\n      let dF = densF(hp); let sR = F.BR[g]*densR(hp); let sM = F.BMs[g]*densM(hp); let ext = extinctionAt(g, hp); let sT = sR + sM + vec4f(dF);\\n      let muS = dot(up, Ls); let muM = dot(up, Lm); var S = vec4f(0.0);\\n      if (F.sunDir.w > 0.5) { S += F.SunE[g]*((sR*pRs + sM*pMs + dF*pFs)*transmittance(g, rp, muS) + sT*msLUT(g, hp, muS)); }\\n      if (F.moonDir.w > 0.5) { S += F.MoonE[g]*((sR*pRm + sM*pMm + dF*pFm)*transmittance(g, rp, muM) + sT*msLUT(g, hp, muM)); }\\n      let att = exp(-ext*dt); L += T*(S - S*att)/max(ext, vec4f(1e-9)); T *= att;\\n    }\\n    E += L;\\n  } }\\n  ambOut[hi*6u + g] = E*(PI/128.0);\\n}\\n\",\"meter\":\"// ---------- metering: illuminance on the ground (for auto exposure) ----------\\n@group(0) @binding(0) var<uniform> F: Frame;\\n@group(0) @binding(1) var transTex: texture_2d_array<f32>;\\n@group(0) @binding(2) var msTex: texture_2d_array<f32>;\\n@group(0) @binding(3) var linSamp: sampler;\\n@group(0) @binding(4) var<storage, read> amb: array<vec4f>;\\n@group(0) @binding(5) var<storage, read_write> meterOut: array<f32>;\\n\\n@compute @workgroup_size(1)\\nfn main() {\\n  let h = F.atm2.y; let r = Rg + h;\\n  var Ed = 0.0; var Esky = 0.0;\\n  for (var g = 0u; g < 6u; g++) {\\n    let a = ambE(g, h); Esky += dot(a, F.CMFy[g]);\\n    var dir = vec4f(0.0);\\n    if (F.sunDir.w > 0.5) { dir += F.SunE[g]*transmittance(g, r, F.sunDir.y)*max(F.sunDir.y, 0.0); }\\n    if (F.moonDir.w > 0.5) { dir += F.MoonE[g]*transmittance(g, r, F.moonDir.y)*max(F.moonDir.y, 0.0); }\\n    Ed += dot(dir, F.CMFy[g]);\\n  }\\n  meterOut[0] = Ed + Esky; meterOut[1] = Ed; meterOut[2] = Esky; meterOut[3] = 0.0;\\n}\\n\",\"sky\":\"// ---------- the panorama: one sample per pixel per pass, added into the accumulation buffer ----------\\n@group(0) @binding(0) var<uniform> F: Frame;\\n@group(0) @binding(1) var transTex: texture_2d_array<f32>;\\n@group(0) @binding(2) var msTex: texture_2d_array<f32>;\\n@group(0) @binding(3) var linSamp: sampler;\\n@group(0) @binding(4) var<storage, read> amb: array<vec4f>;\\n@group(0) @binding(5) var<uniform> PS: Pass;\\n@group(0) @binding(6) var<storage, read_write> accum: array<vec4f>;\\n\\nconst MARIA = /*@MARIA*/;\\nconst CRATERS = /*@CRATERS*/;\\nconst RAYS = /*@RAYS*/;\\n\\nfn vnoise(p: vec3f) -> f32 {\\n  let i = floor(p); var f = p - i; f = f*f*(3.0 - 2.0*f); let b = vec3u(vec3i(i) + vec3i(4096));\\n  let a000 = hash3(b).x; let a100 = hash3(b + vec3u(1u, 0u, 0u)).x; let a010 = hash3(b + vec3u(0u, 1u, 0u)).x; let a110 = hash3(b + vec3u(1u, 1u, 0u)).x;\\n  let a001 = hash3(b + vec3u(0u, 0u, 1u)).x; let a101 = hash3(b + vec3u(1u, 0u, 1u)).x; let a011 = hash3(b + vec3u(0u, 1u, 1u)).x; let a111 = hash3(b + vec3u(1u, 1u, 1u)).x;\\n  return mix(mix(mix(a000, a100, f.x), mix(a010, a110, f.x), f.y), mix(mix(a001, a101, f.x), mix(a011, a111, f.x), f.y), f.z);\\n}\\nfn fbm3(p0: vec3f) -> f32 { var s = 0.0; var a = 0.5; var p = p0; for (var i = 0; i < 5; i++) { s += a*vnoise(p); p *= 2.03; a *= 0.5; } return s; }\\nfn selDir(ll: vec2f) -> vec3f { let lo = radians(ll.x); let la = radians(ll.y); return vec3f(cos(la)*sin(lo), sin(la), cos(la)*cos(lo)); }\\nfn moonHeight(n: vec3f) -> f32 { return fbm3(n*16.0)*0.6 + vnoise(n*48.0)*0.3 + vnoise(n*140.0)*0.1; }\\nfn moonAlbedo(n: vec3f) -> f32 {\\n  var dark = 0.0;\\n  let wv = (fbm3(n*5.0 + 11.0) - 0.47)*2.0;\\n  for (var i = 0; i < i32(arrayLength_MARIA); i++) { let m = MARIA[i]; let ang = degrees(acos(clamp(dot(n, selDir(m.xy)), -1.0, 1.0))) + wv*m.z*0.45;\\n    dark = max(dark, m.w*(1.0 - smoothstep(m.z*0.55, m.z*1.2, ang))); }\\n  var a = 1.0 - dark*(0.75 + 0.5*fbm3(n*12.0)) + 0.09*(fbm3(n*9.0) - 0.5) + 0.07*(vnoise(n*42.0) - 0.5)*(1.0 - dark) + 0.05*(vnoise(n*130.0) - 0.5);\\n  a += 0.3*smoothstep(0.86, 0.97, vnoise(n*95.0))*(1.0 - 0.6*dark) + 0.2*smoothstep(0.9, 0.98, vnoise(n*230.0 + 5.0));\\n  for (var i = 0; i < i32(arrayLength_CRATERS); i++) { let c = CRATERS[i]; let ang = degrees(acos(clamp(dot(n, selDir(c.xy)), -1.0, 1.0))); a += c.w*(1.0 - smoothstep(c.z*0.6, c.z*1.3, ang)); }\\n  for (var i = 0; i < i32(arrayLength_RAYS); i++) { let r = RAYS[i]; let c = selDir(r.xy); let ang = degrees(acos(clamp(dot(n, c), -1.0, 1.0)));\\n    if (ang < r.z) { let e1 = normalize(cross(c, vec3f(0.0, 1.0, 0.0))); let e2 = cross(c, e1); let v = n - c*dot(n, c); let ph = atan2(dot(v, e2), dot(v, e1));\\n      let pat = pow(vnoise(vec3f(cos(ph)*11.0, sin(ph)*11.0, f32(i)*7.31)), 3.0) + 0.5*pow(vnoise(vec3f(cos(ph)*29.0, sin(ph)*29.0, f32(i)*3.7 + 40.0)), 4.0);\\n      a += r.w*pat*pow(1.0 - ang/r.z, 1.4)*smoothstep(1.0, 2.5, ang)*(0.7 + 0.6*vnoise(n*60.0)); } }\\n  return max(a, 0.2);\\n}\\nfn starSpec(t: u32, g: u32) -> vec4f { return F.Star[t*6u + g]; }\\n\\n// stars found near this direction (at most 9), their weights and blackbody index, gathered once per pixel\\nstruct Stars { w: array<f32, 9>, t: array<u32, 9>, n: u32 }\\n\\n@compute @workgroup_size(8, 8, 1)\\nfn main(@builtin(global_invocation_id) id: vec3u) {\\n  let W = PS.W; let H = PS.H; let py = id.y + PS.rowOff;\\n  if (id.x >= W || py >= H) { return; }\\n  let fW = f32(W); let fH = f32(H);\\n  let n = PS.frame;\\n  let jit = select(vec2f(fract(0.5 + f32(n)*0.7548776662) - 0.5, fract(0.5 + f32(n)*0.5698402910) - 0.5), vec2f(0.0), n == 0u);\\n  let px = vec2f(f32(id.x), f32(py)) + 0.5 + jit;\\n  let rd = dirFromPixel(px, fW, fH);\\n  let camH = F.atm2.y; let ro = vec3f(0.0, camH, 0.0); let r0 = Rg + camH; let mu = rd.y;\\n  let gN = groundHit(r0, mu); let hitG = gN > 0.0 && F.opts.y < 0.5;\\n  let tEnd = select(distToTop(r0, mu), gN, gN > 0.0);\\n  let Ls = F.sunDir.xyz; let Lm = F.moonDir.xyz; let cS = dot(rd, Ls); let cM = dot(rd, Lm);\\n  let pRs = phaseR(cS); let pMs = phaseCS(cS, F.atm2.x); let pFs = phaseFog(cS);\\n  let pRm = phaseR(cM); let pMm = phaseCS(cM, F.atm2.x); let pFm = phaseFog(cM);\\n  let ign = fract(hash3(vec3u(id.x, py, 977u)).x + f32(n)*0.61803398875);\\n  let jt = select(fract(0.5 + f32(n)*0.61803398875 + (ign - 0.5)*0.3), 0.5, n == 0u);\\n  let NS = u32(F.opts.x);\\n\\n  // ---- what lies behind, as wavelength-independent factors: ground, sun disc, moon disc, stars, Milky Way\\n  var ground = vec4f(0.0, 0.0, 0.0, 0.0);   // x: μ_sun, y: μ_moon at the ground // Spectral Sky Next — UI thread: the settings panel, the view, and messages to the render worker.
'use strict';
const $ = s => document.querySelector(s);
const P = JSON.parse(JSON.stringify(DEFAULTS));
try { const q = new URLSearchParams(location.search).get('p'); if (q) Object.assign(P, JSON.parse(q)); } catch (e){}
const view = {mode:0, yaw:0, pitch:0.1, fov:75*D2R, expoComp:0, auto:true};
let worker = null, lastStatus = null, ready = false;

/* ---------- panel schema ---------- */
const fmtDeg = v => `${(+v).toFixed(1)}°`;
const SECTIONS = [
  {title:'Sun & moon', items:[
    {k:'mode', label:'Position from', type:'select', opts:[['manual', 'Set by hand'], ['location', 'Place, date and time']]},

    {k:'sunAz', label:'Sun azimuth', min:0, max:360, step:0.5, fmt:fmtDeg, show:() => P.mode === 'manual'},
    {k:'moonEl', label:'Moon elevation', min:-20, max:90, step:0.1, fmt:fmtDeg, show:() => P.mode === 'manual'},
    {k:'moonAz', label:'Moon azimuth', min:0, max:360, step:0.5, fmt:fmtDeg, show:() => P.mode === 'manual'},
    {k:'date', label:'Date', type:'date', show:() => P.mode === 'location'},
    {k:'time', label:'Local time', type:'time', show:() => P.mode === 'location'},
    {k:'utc', label:'UTC offset (h)', type:'number', min:-12, max:14, step:0.5, show:() => P.mode === 'location'},
    {k:'lat', label:'Latitude', min:-90, max:90, step:0.1, fmt:fmtDeg, show:() => P.mode === 'location'},
    {k:'lon', label:'Longitude', min:-180, max:180, step:0.1, fmt:fmtDeg, show:() => P.mode === 'location'},
    {k:'moonOverride', label:'Set the moon phase by hand', type:'check'},
    {k:'moonIllum', label:'Moon illuminated', min:0, max:1, step:0.01, fmt:v => `${Math.round(v*100)}%`, show:() => P.moonOverride},
  ]},
  {title:'Air', items:[
    {k:'aerosol', label:'Aerosol type', type:'select', opts:Object.entries(AEROSOLS).map(([k, a]) => [k, a.name])},
    {k:'aod', label:'Haze (aerosol optical depth, 550 nm)', min:0.01, max:2, log:true, fmt:v => v.toFixed(3)},
    {k:'humidity', label:'Relative humidity', min:5, max:97, step:1, fmt:v => `${Math.round(v)}%`},
    {k:'aerH', label:'Haze layer height', min:0.3, max:4, step:0.05, fmt:v => `${v.toFixed(2)} km`},

    {k:'fogH', label:'Fog depth', min:0.02, max:1, step:0.01, fmt:v => `${Math.round(v*1000)} m`, show:() => P.fogVis < 49.5},
    {k:'diurnal', label:'Morning mist and evening haze follow the sun', type:'check'},

/* ---------- panel ---------- */
const CTRL = [];
function sliderPos(it, v){ return it.log ? Math.log(v/it.min)/Math.log(it.max/it.min) : v; }
function sliderVal(it, x){ return it.log ? it.min*Math.pow(it.max/it.min, x) : x; }
function buildPanel(){
  const panel = $('#panel'); panel.innerHTML = '';
  for (const sec of SECTIONS){
    const el = document.createElement('section'); el.className = 'sec'; el.innerHTML = `<h2>${sec.title}</h2>`; const rows = document.createElement('div'); rows.className = 'rows'; el.appendChild(rows);
    for (const it of sec.items){
      const row = document.createElement('div'); row.className = 'row'; rows.appendChild(row);
      if (it.type === 'note'){ row.classList.add('full'); row.innerHTML = `<div class="note">${it.html}</div>`; CTRL.push({it, row}); continue; }
      const id = 'c_' + it.k;
      if (it.type === 'select'){ row.innerHTML = `<label for="${id}">${it.label}</label><select id="${id}">${it.opts.map(([v, t]) => `<option value="${v}">${t}</option>`).join('')}</select>`;
        const s = row.querySelector('select'); s.onchange = () => { P[it.k] = s.value; changed(); }; CTRL.push({it, row, set:() => { s.value = P[it.k]; }}); }
      else if (it.type === 'check'){ row.innerHTML = `<label for="${id}">${it.label}</label><input type="checkbox" id="${id}">`;
        const c = row.querySelector('input'); c.onchange = () => { P[it.k] = c.checked; changed(); }; CTRL.push({it, row, set:() => { c.checked = !!P[it.k]; }}); }
      else if (it.type === 'date' || it.type === 'time' || it.type === 'number'){ row.innerHTML = `<label for="${id}">${it.label}</label><input type="${it.type}" id="${id}" ${it.step ? `step="${it.step}"` : ''}>`;
        const c = row.querySelector('input'); c.onchange = () => { P[it.k] = it.type === 'number' ? +c.value : c.value; changed(); }; CTRL.push({it, row, set:() => { c.value = P[it.k]; }}); }
      else { // range
        row.innerHTML = `<label for="${id}">${it.label}</label><span class="val"></span><input type="range" id="${id}">`;
        const r = row.querySelector('input'), val = row.querySelector('.val');
        if (it.log){ r.min = 0; r.max = 1; r.step = 0.001; } else { r.min = it.min; r.max = it.max; r.step = it.step || 0.01; }
        r.oninput = () => { P[it.k] = sliderVal(it, +r.value); val.textContent = it.fmt ? it.fmt(P[it.k]) : P[it.k]; changed(true); };
        CTRL.push({it, row, set:() => { r.value = sliderPos(it, P[it.k]); val.textContent = it.fmt ? it.fmt(P[it.k]) : P[it.k]; }});
      }
    }
    panel.appendChild(el);
  }
  syncUI();
}
function syncUI(){ for (const c of CTRL){ if (c.set) c.set(); c.row.hidden = c.it.show ? !c.it.show() : false; } }

/* ---------- talking to the worker ---------- */
let sendPending = false;
function changed(fromSlider){ if (!fromSlider) syncUI(); else for (const c of CTRL) c.row.hidden = c.it.show ? !c.it.show() : false;
  if (sendPending) return; sendPending = true; requestAnimationFrame(() => { sendPending = false; sendParams(); }); }
function sendParams(){ if (worker) worker.postMessage({type:'params', P}); drawOverlay(); }
function sendView(extra){ if (!worker) return; worker.postMessage({type:'view', view:{...view, ...extra}}); }

function setStatus(t){ $('#status').textContent = t; }
function readouts(st){
  const d = st.derived || {}, m = st.meter || {}; const lux = v => v >= 1000 ? `${(v/1000).toFixed(1)} klx` : v >= 1 ? `${v.toFixed(1)} lx` : `${v.toPrecision(2)} lx`;
  const items = [['Sun', `${(d.sunEl ?? 0).toFixed(1)}° <small>az ${(d.sunAz ?? 0).toFixed(0)}°</small>`], ['Moon', `${(d.moonEl ?? 0).toFixed(1)}° <small>${Math.round((d.illum ?? 0)*100)}% lit</small>`],
    ['Visibility', d.vis ? `${d.vis >= 10 ? d.vis.toFixed(0) : d.vis.toFixed(1)} km` : '–'], ['Ground light', m.E ? `${lux(m.E)} <small>${lux(m.Ed || 0)} direct</small>` : '–'], ['Humidity', d.RHp ? `${Math.round(d.RHp)}%` : '–']];
  $('#readouts').innerHTML = items.map(([k, v]) => `<div class="ro"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
}

/* ---------- view: overlay (compass, horizon), dragging, sizing ---------- */
const cv = $('#gl');
function canvasSize(){ const r = $('#view').getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2); return [Math.max(1, Math.round(r.width*dpr)), Math.max(1, Math.round(r.height*dpr)), r]; }
function panoRect(){ const [, , r] = canvasSize(); let w = r.width, h = w/2; if (h > r.height){ h = r.height; w = h*2; } return {x:(r.width - w)/2, y:(r.height - h)/2, w, h}; }
function drawOverlay(){
  const ov = $('#overlay'); if (view.mode === 1){ ov.innerHTML = ''; return; }
  const pr = panoRect(); let html = `<div class="hline" style="left:${pr.x}px;width:${pr.w}px;top:${pr.y + pr.h/2}px"></div>`;
  ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'].forEach((n, i) => { const az = i*45; const u = (((az - P.azOff)/360 + 0.5) % 1 + 1) % 1; html += `<div class="compass" style="left:${pr.x + u*pr.w}px;top:${pr.y + pr.h/2 + 4}px">${n}</div>`; });
  ov.innerHTML = html; }
function resize(){ const [w, h] = canvasSize(); sendView({cw:w, ch:h}); drawOverlay(); }
new ResizeObserver(resize).observe($('#view'));
let drag = null;
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); drag = {x:e.clientX, y:e.clientY, yaw:view.yaw, pitch:view.pitch, moved:false}; });
cv.addEventListener('pointermove', e => { if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.hypot(dx, dy) > 3) drag.moved = true;
  if (view.mode === 1 && drag.moved){ const k = view.fov/cv.getBoundingClientRect().height; view.yaw = drag.yaw - dx*k; view.pitch = clamp(drag.pitch + dy*k, -1.5, 1.5); sendView(); }
  else if (view.mode !== 1 && P.mode === 'manual') placeSun(e); });
cv.addEventListener('pointerup', e => { if (drag && !drag.moved && view.mode !== 1 && P.mode === 'manual') placeSun(e); drag = null; });
cv.addEventListener('wheel', e => { if (view.mode !== 1) return; e.preventDefault(); view.fov = clamp(view.fov*Math.exp(e.deltaY*0.001), 10*D2R, 140*D2R); sendView(); }, {passive:false});
function placeSun(e){ const pr = panoRect(), r = $('#view').getBoundingClientRect(); const u = (e.clientX - r.left - pr.x)/pr.w, v = (e.clientY - r.top - pr.y)/pr.h; if (u < 0 || u > 1 || v < 0 || v > 1) return;
  P.sunAz = ((((u - 0.5)*360 + P.azOff) % 360) + 360) % 360; P.sunEl = clamp((0.5 - v)*180, -20, 90); changed(); }
document.querySelectorAll('#viewSeg button').forEach(b => b.onclick = () => { document.querySelectorAll('#viewSeg button').forEach(x => x.classList.toggle('on', x === b)); view.mode = +b.dataset.v; $('#legend').hidden = view.mode !== 2; sendView(); drawOverlay(); });
document.querySelectorAll('#resSeg button').forEach(b => b.onclick = () => { document.querySelectorAll('#resSeg button').forEach(x => x.classList.toggle('on', x === b)); P.previewRes = +b.dataset.r; changed(); });
$('#autoEx').onchange = e => { view.auto = e.target.checked; sendView(); };
$('#exSlider').oninput = e => { view.expoComp = +e.target.value; $('#exVal').textContent = `${view.expoComp >= 0 ? '+' : '−'}${Math.abs(view.expoComp).toFixed(1)} EV`; sendView(); };

/* ---------- start ---------- */
const pending = new Map(); let rbId = 0;
function start(){
  buildPanel(); readouts({});
  if (!navigator.gpu){ $('#ldStep').textContent = 'This browser has no WebGPU.'; setStatus('No WebGPU'); return; }
  const blob = new Blob([WORKER_SRC], {type:'text/javascript'}); worker = new Worker(URL.createObjectURL(blob));
  const off = cv.transferControlToOffscreen();
  worker.onmessage = e => { const m = e.data;
    if (m.type === 'log') console.log('[worker] ' + m.text);
    else if (m.type === 'stage') $('#ldStep').textContent = m.text[0].toUpperCase() + m.text.slice(1) + '…';
    else if (m.type === 'ready'){ ready = true; $('#loader').classList.add('gone'); resize(); sendParams(); window.__sky.adapter = m.adapter; }
    else if (m.type === 'status'){ lastStatus = m; readouts(m);
      setStatus(m.done ? `${m.W}×${m.H} · ${m.sample} samples · ${(m.total/1000).toFixed(1)} s` : `${m.W}×${m.H} · sample ${m.sample + 1}/${m.target} · ${Math.round(m.row/m.H*100)}%`); }
    else if (m.type === 'error'){ console.error(m.message); setStatus('Error'); $('#loader').classList.remove('gone'); $('#ldTitle').textContent = 'Something went wrong'; $('#ldStep').textContent = m.message.slice(0, 400); window.__sky.error = m.message; }
    else if (m.type === 'shot'){ const r = pending.get(m.id); pending.delete(m.id); if (r) r(m); }
    else if (m.type === 'pixels'){ const r = pending.get(m.id); pending.delete(m.id); if (r) r(m); } };
  worker.onerror = e => { console.error('worker', e.message); $('#ldStep').textContent = 'Worker error: ' + e.message; window.__sky.error = e.message; };
  const [w, h] = canvasSize(); off.width = w; off.height = h;
  worker.postMessage({type:'init', canvas: off, noPresent: !!P.noPresent}, [off]);
}
// test hooks (used by the automated checks)
window.__sky = {
  P, view,
  set(o){ Object.assign(P, o); syncUI(); sendParams(); },
  status: () => lastStatus, ready: () => ready,
  readback: () => new Promise(res => { const id = ++rbId; pending.set(id, res); worker.postMessage({type:'readback', id}); }),
  setView(o){ Object.assign(view, o); sendView(); },
  shot: () => new Promise(res => { const id = ++rbId; pending.set(id, res); worker.postMessage({type:'shot', id}); }),
};
start();

</script>
