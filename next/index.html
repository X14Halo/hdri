  const nf = far ? 0 : Math.floor(r()*(1.2 + 2.2*L)*(1 - 0.6*dev));\n    for (let i = 0; i < nf; i++){ const rr = (0.55 + 0.9*r())*L*0.6, a2 = r()*2*Math.PI;\n      const D = Dmin*(1 + 1.6*r()*r());\n      cov += addCell(x + Math.cos(a2)*rr, z + Math.sin(a2)*rr, D, 1 + 0.8*r(), r()*Math.PI, 0.6 + 0.4*r(), 0.7); }\n    area += cov*0.8;   // (cells overlap within a complex)\n  }\n  return out;\n}\n\n// ---------- packing for the GPU: cloud records and a 2 km grid of which clouds reach each cell ----------\nfunction packCumulus(cu){\n  const n = cu.clouds.length, recs = new Float32Array(Math.max(n, 1)*12);\n  cu.clouds.forEach((c, i) => { recs.set([c.x, c.z, c.R, c.base, c.H, c.seed, c.sx, c.sz, c.sig, c.dev, c.el || 1, c.ang || 0], i*12); });\n  const G = VOL.GRID, NC = VOL.DOMAIN/G, half = VOL.DOMAIN/2;\n  const counts = new Uint32Array(NC*NC);\n  const cellsOf = (c, fn) => { const ext = c.R*1.3*(c.el || 1) + Math.hypot(c.sx, c.sz)*c.H*1.2 + 0.05;\n    const x0 = Math.max(0, Math.floor((c.x - ext + half)/G)), x1 = Math.min(NC - 1, Math.floor((c.x + ext + half)/G));\n    const z0 = Math.max(0, Math.floor((c.z - ext + half)/G)), z1 = Math.min(NC - 1, Math.floor((c.z + ext + half)/G));\n    for (let j = z0; j <= z1; j++) for (let i = x0; i <= x1; i++) fn(j*NC + i); };\n  const cells = cu.clouds.map(c => { const a = []; cellsOf(c, k => { a.push(k); counts[k]++; }); return a; });\n  const start = new Uint32Array(NC*NC + 1); for (let k = 0; k < NC*NC; k++) start[k + 1] = start[k] + counts[k];\n  const idx = new Uint32Array(Math.max(start[NC*NC], 1)), fill = start.slice(0, NC*NC);\n  cells.forEach((a, i) => { for (const k of a) idx[fill[k]++] = i; });\n  let maxPer = 0; for (let k = 0; k < NC*NC; k++) maxPer = Math.max(maxPer, counts[k]);\n  return {recs, start, idx, n, maxPer};\n}\n\n// ---------- the layered cloud types: the uniform block for the generator (struct Layers in cloudgen.wgsl) ----------\n// thr: per-layer coverage thresholds (from the measured distribution of each layer's field)\nfunction layerUniforms(P, thr){\n  const wl = Math.hypot(P.windX, P.windZ) || 1, wang = Math.atan2(P.windZ, P.windX);\n  const on = (k) => P[k + 'On'] && P[k + 'Cover'] > 0.001;\n  const sigAc = 6 + 26*clamp(P.acForm, 0, 1);\n  return new Float32Array([\n    on('sc') ? P.scCover : 0, P.scBase, P.scThick, P.scForm,   P.scCell, P.scSeed, (22 + 22*clamp(P.scForm, 0, 1))*P.scDens, wang,\n    on('ac') ? P.acCover : 0, P.acBase, P.acThick, P.acForm,   P.acCell, P.acSeed + 101, sigAc*P.acDens, wang,\n    on('ci') ? P.ciCover : 0, P.ciBase, P.ciThick, P.ciForm,   P.ciCell, P.ciSeed + 211, 1.4*P.ciDens, wang,\n    P.windX/wl, P.windZ/wl, 1.8*P.ciShear, P.ciFall,\n    thr.sc ?? 0.5, thr.ac ?? 0.5, thr.ci ?? 0.5, 0]);\n}\n// altitude range a layer can occupy (for the build slab and the renderer's cloud band)\nfunction layerBand(P){\n  let lo = 1e9, hi = 0;\n  if (P.scOn && P.scCover > 0.001){ lo = Math.min(lo, P.scBase - 0.05); hi = Math.max(hi, P.scBase + P.scThick*1.15); }\n  if (P.acOn && P.acCover > 0.001){ lo = Math.min(lo, P.acBase); hi = Math.max(hi, P.acBase + P.acThick); }\n  if (P.ciOn && P.ciCover > 0.001){ lo = Math.min(lo, P.ciBase - (P.ciForm > 0.2 ? P.ciFall : 0)); hi = Math.max(hi, P.ciBase + P.ciThick); }\n  return hi > 0 ? [Math.max(lo, 0), hi] : null;\n}\nconst LAYER_KEYS = {sc: /^sc(Form|Cell|Seed|Base|Thick)$/, ac: /^ac(Form|Cell|Seed|Base|Thick)$/, ci: /^ci(Form|Cell|Seed|Base|Thick)$/};\n\nconst WGSL = {\"atmo\":\"// ---------- lookups into the atmosphere tables (needs transTex, msTex, linSamp, amb bound by the including shader) ----------\\nfn transmittance(g: u32, r0: f32, mu: f32) -> vec4f {\\n  let r = max(r0, Rg + 1e-4);\\n  let H = sqrt(Rt*Rt - Rg*Rg); let rho = sqrt(max((r - Rg)*(r + Rg), 0.0));\\n  let d = distToTop(r, mu); let dmin = Rt - r; let dmax = rho + H;\\n  let xmu = clamp((d - dmin)/max(dmax - dmin, 1e-6), 0.0, 1.0); let xr = rho/H;\\n  let uv = vec2f(0.5/256.0 + xmu*(255.0/256.0), 0.5/64.0 + xr*(63.0/64.0));\\n  let T = textureSampleLevel(transTex, linSamp, uv, i32(g), 0.0);\\n  // the planet's shadow edge, softened over the solar disc\\n  let muH = -rho/r; let eps = 0.00465*sqrt(max(1.0 - muH*muH, 0.0)) + 1e-5;\\n  return T*smoothstep(muH - eps, muH + eps, mu);\\n}\\nfn msLUT(g: u32, h: f32, mus: f32) -> vec4f {\\n  var uv = vec2f(clamp(mus*0.5 + 0.5, 0.0, 1.0), sqrt(clamp(h/100.0, 0.0, 1.0)));\\n  uv = (0.5 + uv*31.0)/32.0;\\n  return textureSampleLevel(msTex, linSamp, uv, i32(g), 0.0);\\n}\\n// clear-sky irradiance on a level surface facing up (sky only, no direct sun or moon) at height h km\\nfn ambE(g: u32, h: f32) -> vec4f {\\n  let x = sqrt(clamp(h/20.0, 0.0, 1.0))*31.0; let i0 = u32(floor(x)); let i1 = min(i0 + 1u, 31u); let f = x - f32(i0);\\n  return mix(amb[i0*6u + g], amb[i1*6u + g], f);\\n}\\n\",\"cloudgen\":\"// ---------- building the cloud volume: every enabled layer evaluated at each voxel ----------\\n@group(0) @binding(0) var<uniform> CU: Cloud;\\n@group(0) @binding(1) var densOut: texture_storage_3d<rgba8unorm, write>;\\n@group(0) @binding(2) var<storage, read> cuRec: array<vec4f>;     // 3 per cloud: (x, z, R, base) (H, seed, shear x, shear z) (sigma, dev, -, -)\\n@group(0) @binding(3) var<storage, read> cuStart: array<u32>;     // grid cell → first index (cells of GRID km over DOMAIN km)\\n@group(0) @binding(4) var<storage, read> cuIdx: array<u32>;\\n@group(0) @binding(5) var<uniform> GP: vec4u;                     // x level, y first voxel row (altitude), z rows, w number of clouds\\n@group(0) @binding(6) var<uniform> LY: Layers;\\n@group(0) @binding(7) var noiseTex: texture_3d<f32>;\\n@group(0) @binding(8) var wrapSamp: sampler;\\n@group(0) @binding(9) var<uniform> F: Frame;                      // (declared for common.wgsl; unused here)\\n@group(0) @binding(10) var<storage, read_write> fieldOut: array<f32>;   // (coverage field samples, for calibrating cover)\\n\\n// the layered (field) cloud types. x cover, y base km, z thickness km, w form; second: x cell size km, y seed, z extinction /km,\\n// w wind direction (rad); thr: the coverage threshold of each layer, found so its cover matches the setting\\nstruct Layers { sc: vec4f, sc2: vec4f, ac: vec4f, ac2: vec4f, ci: vec4f, ci2: vec4f, wind: vec4f, thr: vec4f }\\n\\n// (levelE comes from cloudu.wgsl)\\nconst GRID: f32 = 2.0; const DOMAIN: f32 = 512.0; const NC: u32 = 256u;\\n\\nfn smax(a: f32, b: f32, k: f32) -> f32 { let h = clamp(0.5 + 0.5*(b - a)/k, 0.0, 1.0); return mix(a, b, h) + k*h*(1.0 - h); }\\n\\n// one cumulus: turrets (bubbles of rising air) stacked over a flat base, leaning downwind with the shear.\\n// returns (signed distance km, height within the cloud 0…1); distance < -0.5 when far outside\\nfn cuEval(p: vec3f, k: u32) -> vec2f {\\n  let a = cuRec[3u*k]; let b = cuRec[3u*k + 1u];\\n  let base = a.w; let H = b.x; let R = a.z; let y = p.y - base;\\n  if (y < -0.4 || y > H*1.35 + 0.1) { return vec2f(-1.0, 0.0); }\\n  let c2 = cuRec[3u*k + 2u]; let el = max(c2.z, 1.0);\\n  var q0 = p.xz - a.xy - b.zw*max(y, 0.0);\\n  if (dot(q0, q0) > (R*1.45*el + 0.3)*(R*1.45*el + 0.3)) { return vec2f(-1.0, 0.0); }\\n  let seed = u32(b.y); let dev = c2.y;\\n  // into the cloud's own frame: stretched along its long axis, outline made irregular by a gentle warp\\n  let ca = cos(c2.w); let sa = sin(c2.w); q0 = vec2f(ca*q0.x + sa*q0.y, -sa*q0.x + ca*q0.y); q0.x /= el;\\n  let hw = hash3(vec3u(seed, 91u, 3u));\\n  let wq = q0/R;\\n  q0 += R*0.3*vec2f(sin(wq.y*2.3 + 6.28*hw.x) + 0.5*sin(wq.x*4.1 + wq.y*1.7 + 6.28*hw.y), sin(wq.x*2.1 + 6.28*hw.z) + 0.5*sin(wq.y*3.7 - wq.x*1.3 + 6.28*hw.x));\\n  // body: a half-ellipsoid on the base (R across, H up); turrets: bubbles of rising air bulging from its upper surface,\\n  // smaller and more numerous on tall clouds (cauliflower), a few broad lumps on flat fair-weather ones\\n  let tall = clamp(H/(2.0*R), 0.0, 3.0);\\n  // (sides near vertical, top domed: h(r) = H·√(1 − (r/R)^2.5))\\n  // (continuous across the rim: a jump in the distance field would show as straight voxel-aligned edges)\\n  let rr = length(q0)/R; let ht = H*sqrt(max(1.0 - pow(min(rr, 1.0), 2.5), 0.0));\\n  var d = min((1.0 - rr)*R*0.8, (ht - y)*0.8);\\n  let nb = 9u + u32(6.0*clamp(tall, 0.0, 1.0)) + u32(5.0*dev);\\n  for (var i = 0u; i < nb; i++) {\\n    let h = hash3(vec3u(seed, i, 7u)); let h2 = hash3(vec3u(seed, i, 19u));\\n    // a point on the upper surface of the body: azimuth, and elevation weighted toward the top\\n    let az = 6.2831853*h.x; let el = mix(0.25, 1.45, pow(h.y, 0.7));\\n    let dir = vec3f(cos(az)*cos(el), sin(el), sin(az)*cos(el));\\n    let rb = min(R, H*1.3)*(0.2 + 0.24*h2.x)*(1.0 - 0.25*sin(el));\\n    // on the dome, but not bulging out past the base: a cloud is widest at or near its base\\n    let cr = min(cos(el)*(0.55 + 0.4*h.z), max(1.0 - 1.1*rb/R, 0.0)); let ch = H*sqrt(max(1.0 - pow(cr, 2.5), 0.0));\\n    let c = vec3f(cos(az)*cr*R, max(ch*(0.82 + 0.1*h2.z), rb*0.7), sin(az)*cr*R);\\n    let e = (vec3f(q0.x, y, q0.y) - c)/vec3f(rb, rb*(0.85 + 0.3*h2.y), rb);\\n    d = smax(d, (1.0 - length(e))*rb, 0.02 + 0.03*rb);\\n  }\\n  // the flat base (the condensation level), gently uneven\\n  let bn = (hash3(vec3u(u32(floor(q0.x*4.0) + 4096.0), u32(floor(q0.y*4.0) + 4096.0), seed)).x - 0.5)*0.0;\\n  d = min(d, y + bn);\\n  return vec2f(d, clamp(y/max(H, 1e-3), 0.0, 1.0));\\n}\\n\\n// ---------- noise for the layer fields: the tileable noise volume read at incommensurate scales (nothing repeats) ----------\\nfn nz(p: vec3f) -> f32 { return textureSampleLevel(noiseTex, wrapSamp, p, 0.0).a; }\\nfn nzb(p: vec3f) -> f32 { return textureSampleLevel(noiseTex, wrapSamp, p, 0.0).r; }\\nfn n2(xz: vec2f, km: f32, s: f32) -> f32 { return nz(vec3f(xz.x/km, s, xz.y/km)); }\\nfn fbm2s(xz: vec2f, km: f32, s: f32) -> f32 { return 0.6*n2(xz, km, s) + 0.4*n2(xz, km*0.377, s + 0.31); }\\n// cellular noise in 2D: (distance to nearest cell point, to second nearest)\\nfn worley2(p: vec2f, seed: u32) -> vec2f {\\n  let i = floor(p); let f = p - i; var d1 = 9.0; var d2 = 9.0;\\n  for (var y = -1; y <= 1; y++) { for (var x = -1; x <= 1; x++) {\\n    let o = vec2f(f32(x), f32(y)); let c = vec2u(vec2i(i + o) + vec2i(65536));\\n    let r = o + hash3(vec3u(c, seed)).xy - f; let d = dot(r, r);\\n    if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) { d2 = d; } } }\\n  return sqrt(vec2f(d1, d2));\\n}\\nfn rot(xz: vec2f, a: f32) -> vec2f { let c = cos(a); let s = sin(a); return vec2f(c*xz.x + s*xz.y, -s*xz.x + c*xz.y); }\\n\\n// ---------- stratocumulus / stratus: a deck of convective cells. Closed cells: cloud fills them, thin gaps between;\\n// open cells: cloud on the rims; stratus: a featureless sheet. Returns (coverage field, how central in its cell)\\nfn scField(xz: vec2f) -> vec2f {\\n  let cs = LY.sc2.x; let seed = u32(LY.sc2.y); let form = LY.sc.w;\\n  let w = vec2f(n2(xz, cs*3.1, 0.13) - 0.5, n2(xz, cs*3.1, 0.57) - 0.5)*cs*1.1;\\n  let q = rot(xz + w, LY.sc2.w)/vec2f(cs*1.35, cs);           // (a little stretched along the wind)\\n  let f = worley2(q, seed); let edge = f.y - f.x;\\n  let closed = smoothstep(0.02, 0.4, edge); let open = 1.0 - smoothstep(0.0, 0.3, edge);\\n  let cell = mix(mix(1.0, closed, smoothstep(0.0, 0.45, form)), open, smoothstep(0.55, 1.0, form));\\n  let det = fbm2s(xz, cs*0.45, 0.71);\\n  let meso = n2(xz, 38.0, 0.91) - 0.5;\\n  return vec2f(0.7*cell + 0.3*det + 0.45*meso, cell);\\n}\\n// ---------- altocumulus / altostratus: a sheet of cloudlets in rows across the wind (billows of the shear), in patches;\\n// altostratus: a thick grey veil with soft undulations. Returns (coverage field, lump height)\\nfn acField(xz: vec2f) -> vec2f {\\n  let cs = LY.ac2.x; let seed = u32(LY.ac2.y); let form = LY.ac.w;\\n  let w = vec2f(n2(xz, cs*4.3, 0.21) - 0.5, n2(xz, cs*4.3, 0.63) - 0.5)*cs*1.6;\\n  let q = rot(xz + w, LY.ac2.w)/vec2f(cs*0.8, cs*1.25);       // rows lie across the wind\\n  let f = worley2(q, seed + 5u);\\n  let lump = 1.0 - smoothstep(0.05, 0.75, f.x);\\n  let wave = 0.5 + 0.5*sin(6.2831853*q.x*0.9 + 4.0*n2(xz, cs*6.0, 0.37));\\n  let veil = 0.75 + 0.25*fbm2s(xz, 6.0, 0.45);\\n  let meso = fbm2s(xz, 22.0, 0.83) - 0.5;\\n  let c = mix(veil, 0.75*lump + 0.25*wave, form) + 0.7*meso;\\n  return vec2f(c, mix(veil, lump, form));\\n}\\n// ---------- cirrus: ice from generating cells high up, trailing fall streaks that hang back and curve as they sink into\\n// slower air (mares' tails); cirrostratus: a thin even veil; cirrocumulus: tiny ripples. (coverage field, fibre strength)\\nfn ciField(xz: vec2f) -> vec2f {\\n  let cs = LY.ci2.x; let seed = u32(LY.ci2.y); let form = LY.ci.w;\\n  let q = rot(xz, LY.ci2.w);\\n  let warp = (n2(xz, cs*5.0, 0.17) - 0.5)*cs*2.5;\\n  let fib = nz(vec3f(q.x/(cs*9.0), 0.33, (q.y + warp)/(cs*0.55)));            // fibres along the wind\\n  let fib2 = nz(vec3f(q.x/(cs*3.0), 0.77, (q.y + warp*0.6)/(cs*0.21)));\\n  let heads = 1.0 - smoothstep(0.1, 0.6, worley2(q/vec2f(cs*2.2, cs*1.4), seed + 9u).x);\\n  let veil = 0.8 + 0.2*fbm2s(xz, 9.0, 0.53);\\n  let cc = 1.0 - smoothstep(0.1, 0.7, worley2(q/(cs*0.12), seed + 13u).x);       // cirrocumulus grains\\n  let streak = 0.45*fib + 0.25*fib2 + 0.3*heads;\\n  var c = mix(veil, streak, smoothstep(0.0, 0.5, form));\\n  c = mix(c, 0.5*cc + 0.5*fib, smoothstep(0.6, 1.0, form));\\n  let meso = fbm2s(xz, 30.0, 0.29) - 0.5;\\n  return vec2f(c + 0.6*meso, fib);\\n}\\n\\nstruct Hit { d: f32, sig: f32, v: f32, r: f32 }\\nfn evalAt(p: vec3f) -> Hit {\\n  var best = Hit(-1.0, 0.0, 0.0, 0.0);\\n  // the layers (alpha codes the style for the renderer's fine detail: < 0.5 cumulus by size, 0.65 water sheets, 0.9 ice)\\n  if (LY.sc.x > 0.0 && p.y > LY.sc.y - 0.35 && p.y < LY.sc.y + LY.sc.z + 0.3) {\\n    // cells are domes: thickest in the middle, thinning to their edges (thin bright rims, dark cores seen from below), merging\\n    // into a continuous deck where the cover is high\\n    let f = scField(p.xz); let th = LY.sc.z; let m = smoothstep(LY.thr.x - 0.03, LY.thr.x + 0.28, f.x);\\n    let top = LY.sc.y + th*(0.2 + 0.8*m) + th*0.18*(n2(p.xz, 1.7, 0.41) - 0.5);\\n    let bot = LY.sc.y + th*0.22*(1.0 - m) + 0.05*(n2(p.xz, 2.3, 0.19) - 0.5);\\n    let dv = min(p.y - bot, top - p.y); let dh = (f.x - LY.thr.x)*LY.sc2.x*0.35;\\n    let d = min(dv, dh);\\n    // lumpy (cumuliform) except for stratus: the size code drives the renderer's billows in proportion to the deck\\n    let st = select(0.65, 0.5*clamp(th*0.9/2.4, 0.04, 0.5), LY.sc.w > 0.15);\\n    if (d > best.d) { best = Hit(d, LY.sc2.z, clamp((p.y - bot)/max(top - bot, 0.05), 0.0, 1.0), st); }\\n  }\\n  if (LY.ac.x > 0.0 && p.y > LY.ac.y - 0.3 && p.y < LY.ac.y + LY.ac.z + 0.3) {\\n    let f = acField(p.xz); let th = LY.ac.z; let form = LY.ac.w;\\n    let top = LY.ac.y + th*mix(0.85 + 0.15*f.y, 0.35 + 0.65*f.y, form);\\n    let bot = LY.ac.y + th*mix(0.05*(1.0 - f.y), 0.35*(1.0 - f.y), form);\\n    let dv = min(p.y - bot, top - p.y); let dh = (f.x - LY.thr.y)*LY.ac2.x*0.3;\\n    let d = min(dv, dh);\\n    let st = select(0.65, 0.5*clamp(LY.ac2.x*0.45/2.4, 0.03, 0.5), form > 0.3);\\n    if (d > best.d) { best = Hit(d, LY.ac2.z, clamp((p.y - bot)/max(top - bot, 0.05), 0.0, 1.0), st); }\\n  }\\n  if (LY.ci.x > 0.0 && p.y > LY.ci.y - LY.wind.w - 0.2 && p.y < LY.ci.y + LY.ci.z + 0.2) {\\n    // below the generating level the ice falls in streaks; a streak at depth dz traces back to a head displaced downwind\\n    let topI = LY.ci.y + LY.ci.z; let dz = max(topI - p.y, 0.0);\\n    let back = LY.wind.xy*LY.wind.z*pow(dz, 1.3);\\n    let f = ciField(p.xz + back);\\n    let inLayer = 1.0 - smoothstep(LY.ci.z*0.6, LY.ci.z, dz);\\n    let tail = exp(-max(dz - LY.ci.z*0.6, 0.0)/max(LY.wind.w*0.45, 0.05))*smoothstep(0.0, 0.3, LY.ci.w);\\n    let prof = max(inLayer, tail*f.y);\\n    let dv = min(p.y - (LY.ci.y - LY.wind.w*select(0.0, 1.0, LY.ci.w > 0.2)), topI - p.y);\\n    let dh = (f.x*prof - LY.thr.z)*LY.ci2.x*0.25;\\n    let d = min(dv, dh);\\n    if (d > best.d) { best = Hit(d, LY.ci2.z*(0.4 + 0.6*prof), clamp(1.0 - dz/(LY.ci.z + LY.wind.w), 0.0, 1.0), 0.9); }\\n  }\\n  if (GP.w > 0u) {\\n    let c = vec2i(floor((p.xz + 0.5*DOMAIN)/GRID));\\n    if (c.x >= 0 && c.y >= 0 && c.x < i32(NC) && c.y < i32(NC)) {\\n      let cell = u32(c.y)*NC + u32(c.x); let s0 = cuStart[cell]; let s1 = cuStart[cell + 1u];\\n      for (var j = s0; j < s1; j++) { let k = cuIdx[j]; let r = cuEval(p, k);\\n        if (r.x > best.d) { best = Hit(r.x, cuRec[3u*k + 2u].x, r.y, 0.5*clamp(cuRec[3u*k].z/2.4, 0.0, 1.0)); } }\\n    }\\n  }\\n  return best;\\n}\\nfn encodeSig(s: f32) -> f32 { return select(clamp(log2(s/0.05)/13.0, 1.0/255.0, 1.0), 0.0, s <= 0.0); }\\n\\n@compute @workgroup_size(4, 4, 4)\\nfn main(@builtin(global_invocation_id) id: vec3u) {\\n  let NX = u32(CU.res.x); let NZ = u32(CU.res.y); let l = GP.x;\\n  if (id.x >= NX || id.y >= NX || id.z >= GP.z) { return; }\\n  let k = GP.y + id.z; if (k >= NZ) { return; }\\n  let E = levelE(l); let vx = E/f32(NX); let alt = sliceToAlt(f32(k) + 0.5, f32(NZ)); let vz = sliceToAlt(f32(k) + 1.0, f32(NZ)) - sliceToAlt(f32(k), f32(NZ));\\n  let p = vec3f((f32(id.x) + 0.5)/f32(NX)*E - 0.5*E, alt, (f32(id.y) + 0.5)/f32(NX)*E - 0.5*E);\\n  var o = vec4f(0.0);\\n  if (f32(l) < CU.vol.w) {\\n    let h = evalAt(p);\\n    if (h.d > -0.5) { o = vec4f(clamp(h.d, -0.5, 0.5) + 0.5, encodeSig(h.sig), h.v, h.r); }\\n  } else {\\n    // coverage: the fraction of 8 points spread through the voxel that are inside a cloud\\n    var cov = 0.0; var sg = 0.0; var vv = 0.0; var st = 0.0;\\n    for (var s = 0u; s < 8u; s++) {\\n      let jt = (vec3f(f32(s & 1u), f32((s >> 1u) & 1u), f32((s >> 2u) & 1u)) - 0.5)*0.5 + (hash3(vec3u(id.x, id.y, k*8u + s)) - 0.5)*0.4;\\n      let h = evalAt(p + jt*vec3f(vx, vz, vx));\\n      let inside = smoothstep(-0.03, 0.03, h.d); cov += inside; sg = max(sg, h.sig); vv += h.v*inside; st = max(st, h.r*inside);\\n    }\\n    if (cov > 0.0) { o = vec4f(cov/8.0, encodeSig(sg), vv/cov, st); }\\n  }\\n  textureStore(densOut, vec3u(id.x, id.y, l*NZ + k), o);\\n}\\n\\n// the coverage field of one layer (GP.x: 0 low deck, 1 mid, 2 high) on a 256² grid over the central 64 km, for calibration\\n@compute @workgroup_size(8, 8, 1)\\nfn fieldMain(@builtin(global_invocation_id) id: vec3u) {\\n  if (id.x >= 256u || id.y >= 256u) { return; }\\n  let xz = (vec2f(id.xy) + 0.5)/256.0*64.0 - 32.0;\\n  var c = 0.0;\\n  if (GP.x == 0u) { c = scField(xz).x; } else if (GP.x == 1u) { c = acField(xz).x; } else { c = ciField(xz).x; }\\n  fieldOut[id.y*256u + id.x] = c;\\n}\\n\",\"cloudlight\":\"// ---------- the light volume: optical depth from each point to the sun, the moon, the sky above and the ground below ----------\\n@group(0) @binding(0) var<uniform> F: Frame;\\n@group(0) @binding(1) var<uniform> CU: Cloud;\\n@group(0) @binding(2) var densTex: texture_3d<f32>;\\n@group(0) @binding(3) var noiseTex: texture_3d<f32>;\\n@group(0) @binding(4) var linSamp: sampler;\\n@group(0) @binding(5) var wrapSamp: sampler;\\n@group(0) @binding(6) var lightOut: texture_storage_3d<rgba16float, write>;\\n@group(0) @binding(7) var<uniform> GP: vec4u;   // x level\\n\\n// optical depth along a straight line from p (world) toward L, through the cloud band (macro density, no erosion)\\nfn tauToward(p0: vec3f, L: vec3f) -> f32 {\\n  var tau = 0.0; var t = 0.0; let top = CU.band.y + 0.1;\\n  for (var i = 0; i < 96; i++) {\\n    let p = p0 + L*t; let q = volPos(p);\\n    if (q.y > top || q.y < -0.05 || max(abs(q.x), abs(q.z)) > 0.5*levelE(u32(CU.vol.z) - 1u)) { break; }\\n    let lb = levelOf(q.xz); let vs = levelE(u32(lb.x))/CU.res.x;   // step about one voxel of the level it is in\\n    let ds = clamp(vs*0.9, 0.04, 2.0)*select(1.0, 1.0 + 0.02*f32(i), i > 48);\\n    tau += densMacro(volPos(p0 + L*(t + 0.5*ds)))*ds; t += ds;\\n  }\\n  return tau;\\n}\\nfn tauVertical(q0: vec3f, dir: f32) -> f32 {\\n  var tau = 0.0; let dz = 0.06;\\n  var y = q0.y;\\n  let y1 = select(0.0, CU.band.y + 0.1, dir > 0.0);\\n  let n = min(i32(ceil(abs(y1 - y)/dz)), 160);\\n  let ds = abs(y1 - y)/max(f32(n), 1.0);\\n  for (var i = 0; i < n; i++) { let yy = y + dir*(f32(i) + 0.5)*ds; tau += densMacro(vec3f(q0.x, yy, q0.z))*ds; }\\n  return tau;\\n}\\n\\n@compute @workgroup_size(4, 4, 4)\\nfn main(@builtin(global_invocation_id) id: vec3u) {\\n  let NX = u32(CU.res.z); let NZ = u32(CU.res.w); let l = GP.x;\\n  if (id.x >= NX || id.y >= NX || id.z >= NZ) { return; }\\n  let E = levelE(l);\\n  let q = vec3f((f32(id.x) + 0.5)/f32(NX)*E - 0.5*E, sliceToAlt(f32(id.z) + 0.5, f32(NZ)), (f32(id.y) + 0.5)/f32(NX)*E - 0.5*E);\\n  var o = vec4f(0.0);\\n  if (q.y < CU.band.y + 0.1) {\\n    // world position of the voxel: x/z on the tangent plane, altitude along the local vertical\\n    let up = normalize(vec3f(q.x, Rg, q.z)); let p = C0 + up*(Rg + q.y);\\n    if (F.sunDir.w > 0.5 && F.sunDir.y > -0.2) { o.x = tauToward(p, F.sunDir.xyz); }\\n    if (F.moonDir.w > 0.5) { o.y = tauToward(p, F.moonDir.xyz); }\\n    o.z = tauVertical(q, 1.0);\\n    if (q.y > CU.band.x - 0.3) { o.w = tauVertical(q, -1.0); }\\n  }\\n  textureStore(lightOut, vec3u(id.x, id.y, l*NZ + id.z), o);\\n}\\n\",\"cloudlit\":\"// ---------- cloud light lookups (needs lightTex) ----------\\nfn rawLight(xz: vec2f, alt: f32, l: u32) -> vec4f { return textureSampleLevel(lightTex, linSamp, volUVW(xz, alt, l, CU.res.z, CU.res.w), 0.0); }\\n// optical depths at q: x toward the sun, y toward the moon, z straight up to the cloud tops, w straight down to the ground\\nfn lightAt(q: vec3f) -> vec4f {\\n  if (CU.band.z < 0.5 || q.y > CU.band.y + 0.1) { return vec4f(0.0); }\\n  let lb = levelOf(q.xz); let l = u32(lb.x);\\n  var s = rawLight(q.xz, max(q.y, 0.0), l); if (lb.y > 0.0) { s = mix(s, rawLight(q.xz, max(q.y, 0.0), l + 1u), lb.y); } return s;\\n}\\n\",\"cloudu\":\"// ---------- the cloud volume: lookups shared by the light pass and the renderer ----------\\n// Camera-centred levels (each twice as wide as the last) stacked along z in one 3D texture; all span altitude 0 … ZTOP km.\\n// Near levels (< SDF_LEVELS) store a signed distance to the cloud surface (km, ±0.5) so edges stay sharp below the voxel\\n// size and can be eroded by fine noise; far levels store coverage (the voxel-averaged fraction of cloud), which keeps small\\n// distant clouds' total extinction instead of losing them between voxels.\\n// texel: r distance/coverage, g core extinction (log), b height within the cloud (0 base … 1 top), a cloud style\\nstruct Cloud {\\n  vol: vec4f,    // x E0 (km, width of level 0), y ZTOP, z number of levels, w levels holding distances\\n  res: vec4f,    // x voxels across, y voxels up, z light voxels across, w light voxels up\\n  band: vec4f,   // x lowest cloud base, y highest cloud top (km), z cloud on, w erosion strength\\n  cph: vec4f,    // cloud droplet phase (gHG, gD, alpha, wD)\\n  ms: vec4f,     // multiple scattering: x a, y b, z c, w ambient strength\\n  wind: vec4f,   // x/y wind direction (x, z), z ice-fibre length km, w unused\\n}\\n\\nfn levelE(l: u32) -> f32 { return CU.vol.x*exp2(f32(l)); }\\n// the finest level holding p (horizontal), and how far toward the next level's edge it is (0 … 1, for blending)\\nfn levelOf(xz: vec2f) -> vec2f {\\n  let m = max(abs(xz.x), abs(xz.y)); let nl = CU.vol.z;\\n  let l = clamp(ceil(log2(max(m/(0.42*CU.vol.x), 1e-6))), 0.0, nl - 1.0);\\n  let e = 0.42*levelE(u32(l)); let b = clamp((m - 0.85*e)/(0.15*e), 0.0, 1.0);\\n  return vec2f(l, select(b, 0.0, l >= nl - 1.0));\\n}\\n// altitude ↔ slice: the lower 6 km (all but the highest clouds) get three quarters of the slices, the rest the upper 10 km\\nconst ZS: f32 = 6.0; const FZ: f32 = 0.75;\\nfn altToSlice(alt: f32, nz: f32) -> f32 { return select((FZ + (alt - ZS)/(CU.vol.y - ZS)*(1.0 - FZ))*nz, alt/ZS*FZ*nz, alt < ZS); }\\nfn sliceToAlt(z: f32, nz: f32) -> f32 { let f = z/nz; return select(ZS + (f - FZ)/(1.0 - FZ)*(CU.vol.y - ZS), f/FZ*ZS, f < FZ); }\\nfn volUVW(xz: vec2f, alt: f32, l: u32, nxz: f32, nz: f32) -> vec3f {\\n  let E = levelE(l); let u = xz/E + 0.5;\\n  let z = clamp(altToSlice(alt, nz), 0.5, nz - 0.5);\\n  return vec3f(u.x, u.y, (f32(l)*nz + z)/(nz*CU.vol.z));\\n}\\n\",\"cloudvol\":\"// ---------- cloud density lookups (needs densTex, noiseTex, linSamp, wrapSamp) ----------\\nfn rawCloud(xz: vec2f, alt: f32, l: u32) -> vec4f { return textureSampleLevel(densTex, linSamp, volUVW(xz, alt, l, CU.res.x, CU.res.y), 0.0); }\\nfn sigmaOf(v: vec4f) -> f32 { return select(0.05*exp2(v.g*13.0), 0.0, v.g <= 0.0); }\\nfn profileOf(v: f32) -> f32 { return 0.35 + 0.65*smoothstep(0.0, 0.8, v); }   // adiabatic: denser toward the tops\\n\\n// position in volume coordinates: horizontal x/z, altitude above the curved ground\\n// (gnomonic: the horizontal coordinates are where the point's vertical meets the tangent plane at the camera)\\nfn volPos(p: vec3f) -> vec3f { let d = p - C0; let r = length(d); let k = Rg/max(d.y, 1.0); return vec3f(d.x*k, r - Rg, d.z*k); }\\n\\n// extinction (1/km) without the fine erosion: for the light pass and quick tests\\nfn densMacroL(q: vec3f, l: u32) -> f32 {\\n  let v = rawCloud(q.xz, q.y, l);\\n  if (f32(l) < CU.vol.w) { let d = v.r - 0.5; return sigmaOf(v)*profileOf(v.b)*smoothstep(-0.02, 0.06, d); }\\n  return sigmaOf(v)*profileOf(v.b)*v.r;\\n}\\nfn densMacro(q: vec3f) -> f32 {\\n  if (q.y < CU.band.x - 0.3 || q.y > CU.band.y + 0.1) { return 0.0; }\\n  let lb = levelOf(q.xz); let l = u32(lb.x);\\n  var s = densMacroL(q, l); if (lb.y > 0.0) { s = mix(s, densMacroL(q, l + 1u), lb.y); } return s;\\n}\\n// signed distance to the nearest cloud surface (km, level 0–2 only; > 0 inside), for stepping through empty air\\n// how far the fine detail can push a cumulus surface outward (km), from the cloud's size code\\nfn cuPush(a: f32) -> f32 { return 0.03; }\\n// (the far levels hold coverage, not distances: there an empty voxel lets the ray skip half a voxel, anything else is sampled)\\nfn hintL(q: vec3f, l: u32) -> f32 {\\n  let v = rawCloud(q.xz, q.y, l);\\n  if (f32(l) < CU.vol.w) { return v.r - 0.5 + cuPush(v.a); }\\n  if (v.r <= 0.0) { return -0.5*levelE(l)/CU.res.x; }\\n  return 0.0;\\n}\\nfn distHint(q: vec3f) -> f32 {\\n  if (q.y < CU.band.x - 0.3 || q.y > CU.band.y + 0.1) { return 1e9; }\\n  let lb = levelOf(q.xz); let l = u32(lb.x);\\n  var h = hintL(q, l); if (lb.y > 0.0) { h = max(h, hintL(q, l + 1u)); }\\n  return h;\\n}\\nfn nzs(q: vec3f) -> vec4f { return textureSampleLevel(noiseTex, wrapSamp, q, 0.0); }\\n// puffs on puffs: billows at a third and a ninth of the cloud's own size (each cloud is lumpy in proportion to itself, so the\\n// lumps are self-similar and never tile) and at a fixed ~70 m, read through a slow swirl so outlines curl\\nfn cuDetail(q: vec3f, Rc: f32) -> vec2f {\\n  let w = (nzs(q/(2.3*Rc) + vec3f(0.11, 0.53, 0.29)).gba - 0.5)*0.4*Rc;\\n  let qw = q + w;\\n  // rounded bulges with sharp creases between them (inverted cellular noise): turrets at ~0.3 R, sub-turrets at ~0.1 R, and\\n  // the fine billows at fixed scales (as before, which read crisply)\\n  let t1 = nzs(qw/(8.0*0.3*Rc) + vec3f(0.31, 0.17, 0.73)).g;\\n  let t2 = nzs(qw/(8.0*0.1*Rc) + vec3f(0.6, 0.2, 0.4)).g;\\n  let f1 = nzs(qw/0.237 + vec3f(0.6, 0.2, 0.4)).r;\\n  let f2 = nzs(qw/0.071 + vec3f(0.1, 0.5, 0.9)).r;\\n  return vec2f(0.3*t1 + 0.25*t2 + 0.27*f1 + 0.18*f2, t2);\\n}\\nfn densFullL(q: vec3f, l: u32) -> f32 {\\n  let v = rawCloud(q.xz, q.y, l);\\n  let sig = sigmaOf(v); if (sig <= 0.0) { return 0.0; }\\n  if (f32(l) < CU.vol.w) {\\n    let d = v.r - 0.5; if (d < -cuPush(v.a) - 0.02) { return 0.0; }\\n    if (v.a < 0.55) {\\n      // cumulus: lumps push the surface out and cut into it (deep notches, separate turrets); the flat base stays nearly intact\\n      let Rc = clamp(v.a/0.5*2.4, 0.25, 2.4);\\n      let hfac = 0.2 + 0.8*smoothstep(0.02, 0.3, v.b);\\n      // erosion: subtractive (the surface is cut back between lumps, never inflated), deeper on big clouds\\n      let A = CU.band.w*min(0.1 + 0.16*Rc, 0.45)*hfac;\\n      let dd = cuDetail(q, Rc);\\n      let de = d - A*(1.0 - dd.x) + 0.03;\\n      // inside: water content varies from turret to turret (dark folds, bright bulges)\\n      let soft = 0.015 + 0.03*(1.0 - hfac);\\n      return sig*profileOf(v.b)*(0.7 + 0.6*dd.y)*smoothstep(0.0, soft, de);\\n    }\\n    if (v.a > 0.8) {\\n      // ice: fibres drawn out along the wind (crystals spread by shear into long thin strands), soft-edged and wispy\\n      let wd = CU.wind.xy; let al = dot(q.xz, wd); let ac = dot(q.xz, vec2f(-wd.y, wd.x)); let L = CU.wind.z;\\n      let f1 = nzs(vec3f(al/(4.0*L), q.y/0.6, ac/(0.25*L)) + vec3f(0.17, 0.41, 0.83)).a;\\n      let f2 = nzs(vec3f(al/(1.3*L), q.y/0.3, ac/(0.06*L)) + vec3f(0.53, 0.29, 0.07)).a;\\n      let fib = clamp(0.55*f1 + 0.45*f2, 0.0, 1.0);\\n      return sig*profileOf(v.b)*smoothstep(0.0, 0.12, d + 0.06)*smoothstep(0.35, 0.75, fib)*1.6;\\n    }\\n    // water sheets (stratus, altostratus): fine and shallow detail (their texture is in their fields)\\n    let e = CU.band.w*0.04;\\n    let n = nzs(q/0.237 + vec3f(0.6, 0.2, 0.4)).r*0.6 + nzs(q/0.071 + vec3f(0.1, 0.5, 0.9)).r*0.4;\\n    return sig*profileOf(v.b)*smoothstep(0.0, 0.035, d - e*(1.0 - n) + 0.02);\\n  }\\n  return sig*profileOf(v.b)*v.r;\\n}\\nfn densFull(q: vec3f) -> f32 {\\n  if (q.y < CU.band.x - 0.3 || q.y > CU.band.y + 0.1) { return 0.0; }\\n  let lb = levelOf(q.xz); let l = u32(lb.x);\\n  var s = densFullL(q, l); if (lb.y > 0.0) { s = mix(s, densFullL(q, l + 1u), lb.y); } return s;\\n}\\nfn phaseCloud(c0: f32) -> f32 {\\n  let c = clamp(c0, -1.0, 1.0); let g2 = CU.cph.x*CU.cph.x;\\n  let hg = (1.0 - g2)/(4.0*PI*pow(max(1.0 + g2 - 2.0*CU.cph.x*c, 1e-7), 1.5));\\n  let gd = CU.cph.y; let gd2 = gd*gd;\\n  let dr = (1.0 - gd2)*(1.0 + CU.cph.z*c*c)/(4.0*PI*(1.0 + CU.cph.z*(1.0 + 2.0*gd2)/3.0)*pow(max(1.0 + gd2 - 2.0*gd*c, 1e-7), 1.5));\\n  return mix(hg, dr, CU.cph.w);\\n}\\n\",\"common\":\"// ---------- shared constants, frame uniforms and atmosphere functions ----------\\n// Spectrum: 24 bands (387.5 … 732.5 nm, 15 nm wide), stored as 6 vec4 groups.\\nconst PI: f32 = 3.14159265358979;\\nconst Rg: f32 = 6360.0;          // planet radius, km\\nconst Rt: f32 = 6460.0;          // top of the atmosphere, km\\nconst C0: vec3f = vec3f(0.0, -6360.0, 0.0);   // planet centre; the camera stands at (0, camH, 0)\\n\\nstruct Frame {\\n  BR: array<vec4f, 6>,    // Rayleigh scattering at sea level, 1/km\\n  BMs: array<vec4f, 6>,   // aerosol scattering at the ground\\n  BMa: array<vec4f, 6>,   // aerosol absorption\\n  BO: array<vec4f, 6>,    // ozone absorption at the layer peak\\n  Alb: array<vec4f, 6>,   // ground albedo\\n  SunE: array<vec4f, 6>,  // solar irradiance at the top of the atmosphere\\n  MoonE: array<vec4f, 6>, // lunar irradiance\\n  SunK: array<vec4f, 6>,  // solar disc radiance at its centre\\n  SunA: array<vec4f, 6>,  // limb darkening exponent\\n  MoonK: array<vec4f, 6>, // lunar disc radiance scale\\n  Air: array<vec4f, 6>,   // airglow radiance at the zenith\\n  CMFx: array<vec4f, 6>, CMFy: array<vec4f, 6>, CMFz: array<vec4f, 6>,\\n  Star: array<vec4f, 96>, // blackbody spectra (16 temperatures × 6 groups), 1 cd/m² per unit\\n  atm: vec4f,      // x HR (Rayleigh scale height), y HM (aerosol scale height), z fog extinction, w fog scale height\\n  atm2: vec4f,     // x aerosol asymmetry g, y camera height km, z azimuth offset rad, w sun angular radius rad\\n  fogPh: vec4f,    // fog droplet phase (gHG, gD, alpha, wD)\\n  sunDir: vec4f,   // xyz, w sun on\\n  moonDir: vec4f,  // xyz, w moon on\\n  moonLight: vec4f,// direction of sunlight at the Moon, w moon angular radius\\n  pole: vec4f,     // celestial pole, w sun disc squash (refraction)\\n  eqX: vec4f, eqY: vec4f, eqZ: vec4f,   // equatorial frame; w: night, stars on, faintest star magnitude\\n  galX: vec4f, galY: vec4f, galZ: vec4f,// galactic frame; w: Milky Way strength, its spectrum index, include sun disc\\n  opts: vec4f,     // x atmosphere steps, y sky only (no ground), z sun disc on, w unused\\n}\\n\\nstruct Pass { rowOff: u32, frame: u32, W: u32, H: u32, colOff: u32, colEnd: u32, rowEnd: u32, pad: u32 }   // (a crop window renders part of the panorama)\\n\\nfn pcg3d(v0: vec3u) -> vec3u {\\n  var v = v0*1664525u + 1013904223u;\\n  v.x += v.y*v.z; v.y += v.z*v.x; v.z += v.x*v.y;\\n  v ^= v >> vec3u(16u);\\n  v.x += v.y*v.z; v.y += v.z*v.x; v.z += v.x*v.y;\\n  return v;\\n}\\nfn hash3(v: vec3u) -> vec3f { return vec3f(pcg3d(v))*(1.0/4294967295.0); }\\n\\n// ray/sphere around the planet centre from radius r, cos-zenith mu: (near, far), near < 0 … no hit gives (-1, -1)\\nfn sphereHit(r: f32, mu: f32, R: f32) -> vec2f {\\n  let b = -r*mu; let c = (r - R)*(r + R); let disc = b*b - c;\\n  if (disc < 0.0) { return vec2f(-1.0, -1.0); }\\n  let s = sqrt(disc); let q = select(b - s, b + s, b >= 0.0);\\n  let t1 = q; let t2 = select(0.0, c/q, abs(q) > 1e-12);\\n  return vec2f(min(t1, t2), max(t1, t2));\\n}\\nfn distToTop(r: f32, mu: f32) -> f32 { return max(sphereHit(r, mu, Rt).y, 0.0); }\\n// ground hit distance along the ray, or -1\\nfn groundHit(r: f32, mu: f32) -> f32 { let h = sphereHit(r, mu, Rg); if (h.x > 0.0) { return h.x; } return -1.0; }\\n\\nfn densR(h: f32) -> f32 { return exp(-h/F.atm.x); }\\nfn densM(h: f32) -> f32 { return exp(-h/F.atm.y); }\\nfn densO(h: f32) -> f32 { return max(0.0, 1.0 - abs(h - 25.0)/15.0); }\\nfn densF(h: f32) -> f32 { return F.atm.z*exp(-h/F.atm.w); }\\nfn extinctionAt(g: u32, h: f32) -> vec4f {\\n  return F.BR[g]*densR(h) + (F.BMs[g] + F.BMa[g])*densM(h) + F.BO[g]*densO(h) + vec4f(densF(h));\\n}\\nfn scatterAt(g: u32, h: f32) -> vec4f { return F.BR[g]*densR(h) + F.BMs[g]*densM(h) + vec4f(densF(h)); }\\n\\nfn phaseR(c: f32) -> f32 { let gm = 0.01415; return 3.0/(16.0*PI*(1.0 + 2.0*gm))*((1.0 + 3.0*gm) + (1.0 - gm)*c*c); }\\nfn phaseCS(c0: f32, g: f32) -> f32 { let c = clamp(c0, -1.0, 1.0); let g2 = g*g;\\n  return 3.0/(8.0*PI)*(1.0 - g2)*(1.0 + c*c)/((2.0 + g2)*pow(max(1.0 + g2 - 2.0*g*c, 1e-6), 1.5)); }\\nfn phaseHG(c0: f32, g: f32) -> f32 { let c = clamp(c0, -1.0, 1.0); let g2 = g*g; return (1.0 - g2)/(4.0*PI*pow(max(1.0 + g2 - 2.0*g*c, 1e-7), 1.5)); }\\nfn phaseDraine(c0: f32, g: f32, a: f32) -> f32 { let c = clamp(c0, -1.0, 1.0); let g2 = g*g;\\n  return (1.0 - g2)*(1.0 + a*c*c)/(4.0*PI*(1.0 + a*(1.0 + 2.0*g2)/3.0)*pow(max(1.0 + g2 - 2.0*g*c, 1e-7), 1.5)); }\\nfn phaseFog(c: f32) -> f32 { return mix(phaseHG(c, F.fogPh.x), phaseDraine(c, F.fogPh.y, F.fogPh.z), F.fogPh.w); }\\n\\nfn dirFromPixel(px: vec2f, W: f32, H: f32) -> vec3f {\\n  let az = (px.x/W - 0.5)*2.0*PI + F.atm2.z; let el = (0.5 - px.y/H)*PI;\\n  return normalize(vec3f(sin(az)*cos(el), sin(el), cos(az)*cos(el)));\\n}\\nfn toXYZ(L: array<vec4f, 6>) -> vec3f {\\n  var xyz = vec3f(0.0);\\n  for (var g = 0u; g < 6u; g++) { xyz += vec3f(dot(L[g], F.CMFx[g]), dot(L[g], F.CMFy[g]), dot(L[g], F.CMFz[g])); }\\n  return xyz;\\n}\\n\",\"display\":\"// ---------- display: the accumulated panorama, exposed and tone mapped (AgX), as a panorama or a pinhole camera ----------\\nstruct Disp {\\n  canvas: vec2f, pano: vec2f,      // canvas size px; panorama size px\\n  rect: vec4f,                     // panorama placement in the canvas (x, y, w, h)\\n  view: vec4f,                     // x mode (0 panorama, 1 look around, 2 luminance), y yaw, z pitch, w vertical fov\\n  ex: vec4f,                       // x exposure (multiplies cd/m²), y azimuth offset\\n}\\n@group(0) @binding(0) var<uniform> D: Disp;\\n@group(0) @binding(1) var<storage, read> accum: array<vec4f>;\\n@group(0) @binding(2) var<storage, read> accPrev: array<vec4f>;   // the last finished image, shown where the new one has not reached\\n\\nstruct VO { @builtin(position) pos: vec4f }\\n@vertex fn vs(@builtin(vertex_index) i: u32) -> VO {\\n  let p = vec2f(f32((i << 1u) & 2u), f32(i & 2u));\\n  var o: VO; o.pos = vec4f(p*2.0 - 1.0, 0.0, 1.0); return o;\\n}\\nfn agxContrast(x: vec3f) -> vec3f { let x2 = x*x; let x4 = x2*x2; return 15.5*x4*x2 - 40.14*x4*x + 31.96*x4 - 6.868*x2*x + 0.4298*x2 + 0.1191*x - 0.00232; }\\nfn agx(v0: vec3f) -> vec3f {\\n  let M = mat3x3f(0.842479062253094, 0.0423282422610123, 0.0423756549057051, 0.0784335999999992, 0.878468636469772, 0.0784336, 0.0792237451477643, 0.0791661274605434, 0.879142973793104);\\n  let Mi = mat3x3f(1.19687900512017, -0.0528968517574562, -0.0529716355144438, -0.0980208811401368, 1.15190312990417, -0.0980434501171241, -0.0990297440797205, -0.0989611768448433, 1.15107367264116);\\n  let mn = -12.47393; let mx = 4.026069;\\n  var v = M*v0; v = clamp(log2(max(v, vec3f(1e-10))), vec3f(mn), vec3f(mx)); v = (v - mn)/(mx - mn);\\n  return clamp(Mi*agxContrast(v), vec3f(0.0), vec3f(1.0));\\n}\\nfn turbo(x: f32) -> vec3f {\\n  let kR = vec4f(0.13572138, 4.61539260, -42.66032258, 132.13108234); let kR2 = vec2f(-152.94239396, 59.28637943);\\n  let kG = vec4f(0.09140261, 2.19418839, 4.84296658, -14.18503333); let kG2 = vec2f(4.27729857, 2.82956604);\\n  let kB = vec4f(0.10667330, 12.64194608, -60.58204836, 110.36276771); let kB2 = vec2f(-89.90310912, 27.34824973);\\n  let v4 = vec4f(1.0, x, x*x, x*x*x); let v2 = v4.zw*v4.z;\\n  return clamp(vec3f(dot(v4, kR) + dot(v2, kR2), dot(v4, kG) + dot(v2, kG2), dot(v4, kB) + dot(v2, kB2)), vec3f(0.0), vec3f(1.0));\\n}\\nfn texel(x: i32, y: i32) -> vec3f {\\n  let W = i32(D.pano.x); let H = i32(D.pano.y);\\n  let xx = ((x % W) + W) % W; let yy = clamp(y, 0, H - 1);\\n  var a = accum[u32(yy*W + xx)]; if (a.w <= 0.0) { a = accPrev[u32(yy*W + xx)]; } return a.xyz/max(a.w, 1e-6);\\n}\\nfn samplePano(uv: vec2f) -> vec3f {   // bilinear, wrapping in azimuth\\n  let p = uv*D.pano - 0.5; let i = floor(p); let f = p - i; let x = i32(i.x); let y = i32(i.y);\\n  return mix(mix(texel(x, y), texel(x + 1, y), f.x), mix(texel(x, y + 1), texel(x + 1, y + 1), f.x), f.y);\\n}\\n@fragment fn fs(v: VO) -> @location(0) vec4f {\\n  let fc = v.pos.xy; var xyz: vec3f;\\n  let mode = i32(D.view.x);\\n  if (mode == 1) {\\n    // look around: pinhole camera (yaw from north, clockwise; pitch up)\\n    let ndc = vec2f(fc.x/D.canvas.x*2.0 - 1.0, 1.0 - fc.y/D.canvas.y*2.0); let tf = tan(D.view.w*0.5);\\n    let dc = normalize(vec3f(ndc.x*tf*D.canvas.x/D.canvas.y, ndc.y*tf, 1.0));\\n    let cy = cos(D.view.y); let sy = sin(D.view.y); let cp = cos(D.view.z); let sp = sin(D.view.z);\\n    let fwd = vec3f(sy*cp, sp, cy*cp); let right = normalize(vec3f(cy, 0.0, -sy)); let up = cross(fwd, right);\\n    let d = normalize(fwd*dc.z + right*dc.x + up*dc.y);\\n    let az = atan2(d.x, d.z) - D.ex.y; let el = asin(clamp(d.y, -1.0, 1.0));\\n    xyz = samplePano(vec2f(fract(az/(2.0*PI) + 0.5), 0.5 - el/PI));\\n  } else {\\n    let q = (fc - D.rect.xy)/D.rect.zw;\\n    if (any(q < vec2f(0.0)) || any(q > vec2f(1.0))) { return vec4f(0.027, 0.035, 0.047, 1.0); }\\n    xyz = texel(i32(q.x*D.pano.x), i32(q.y*D.pano.y));\\n  }\\n  if (mode == 2) { let l = (log(max(xyz.y, 1e-7))/log(10.0) + 4.0)/13.0; return vec4f(turbo(clamp(l, 0.0, 1.0)), 1.0); }\\n  let X2R = mat3x3f(3.2404542, -0.9692660, 0.0556434, -1.5371385, 1.8760108, -0.2040259, -0.4985314, 0.0415560, 1.0572252);\\n  let lin = max(X2R*xyz, vec3f(0.0))*D.ex.x;\\n  return vec4f(agx(lin), 1.0);\\n}\\nconst PI: f32 = 3.14159265358979;\\n\",\"luts\":\"// ---------- atmosphere tables: transmittance, multiple scattering (Hillaire 2020), sky irradiance vs height ----------\\n// three entry points; each pipeline binds only what its entry point uses\\n@group(0) @binding(0) var<uniform> F: Frame;\\n@group(0) @binding(1) var transOut: texture_storage_2d_array<rgba16float, write>;\\n@group(0) @binding(2) var transTex: texture_2d_array<f32>;\\n@group(0) @binding(3) var msTex: texture_2d_array<f32>;\\n@group(0) @binding(4) var linSamp: sampler;\\n@group(0) @binding(5) var msOut: texture_storage_2d_array<rgba16float, write>;\\n@group(0) @binding(6) var<storage, read_write> ambOut: array<vec4f>;\\n@group(0) @binding(7) var<storage, read> amb: array<vec4f>;   // (unused here; atmo.wgsl names it)\\n\\n@compute @workgroup_size(8, 8, 1)\\nfn transLUT(@builtin(global_invocation_id) id: vec3u) {\\n  if (id.x >= 256u || id.y >= 64u) { return; }\\n  let g = id.z;\\n  let xmu = f32(id.x)/255.0; let xr = f32(id.y)/63.0;\\n  let H = sqrt(Rt*Rt - Rg*Rg); let rho = H*xr; let r = sqrt(rho*rho + Rg*Rg);\\n  let dmin = Rt - r; let dmax = rho + H; let d = dmin + xmu*(dmax - dmin);\\n  let mu = select(clamp((H*H - rho*rho - d*d)/(2.0*r*d), -1.0, 1.0), 1.0, d <= 0.0);\\n  var tau = vec4f(0.0); let N = 80; let dt = d/f32(N);\\n  for (var i = 0; i < N; i++) {\\n    let t = (f32(i) + 0.5)*dt; let h = sqrt(max(r*r + t*t + 2.0*r*mu*t, 0.0)) - Rg;\\n    tau += extinctionAt(g, max(h, 0.0))*dt;\\n  }\\n  textureStore(transOut, vec2u(id.xy), g, exp(-tau));\\n}\\n\\n@compute @workgroup_size(8, 8, 1)\\nfn msLUTpass(@builtin(global_invocation_id) id: vec3u) {\\n  if (id.x >= 32u || id.y >= 32u) { return; }\\n  let g = id.z;\\n  let uv = vec2f(id.xy)/31.0; let mus = uv.x*2.0 - 1.0; let h = max(uv.y*uv.y*100.0, 0.005); let r = Rg + h;\\n  let sd = vec3f(sqrt(max(1.0 - mus*mus, 0.0)), mus, 0.0); let pos = vec3f(0.0, r, 0.0);\\n  var L2 = vec4f(0.0); var fms = vec4f(0.0);\\n  for (var i = 0; i < 8; i++) { for (var j = 0; j < 8; j++) {\\n    let u = (f32(i) + 0.5)/8.0; let v = (f32(j) + 0.5)/8.0; let ct = 1.0 - 2.0*v; let st = sqrt(max(1.0 - ct*ct, 0.0)); let ph = 2.0*PI*u;\\n    let rd = vec3f(st*cos(ph), ct, st*sin(ph)); let mu = ct;\\n    let gN = groundHit(r, mu); let hitG = gN > 0.0;\\n    let tmax = select(distToTop(r, mu), gN, hitG);\\n    let N = 24; let dt = tmax/f32(N); var T = vec4f(1.0);\\n    for (var k = 0; k < N; k++) {\\n      let t = (f32(k) + 0.5)*dt; let p = pos + rd*t; let rr = length(p); let hh = rr - Rg; let up = p/rr;\\n      let sT = extinctionAt(g, hh); let sS = scatterAt(g, hh); let Ts = transmittance(g, rr, dot(up, sd));\\n      let att = exp(-sT*dt); let S = sS*Ts*(0.25/PI);\\n      L2 += T*(S - S*att)/max(sT, vec4f(1e-9)); fms += T*(sS - sS*att)/max(sT, vec4f(1e-9)); T *= att;\\n    }\\n    if (hitG) { let p = pos + rd*gN; let up = normalize(p); let m = dot(up, sd); L2 += T*transmittance(g, Rg, m)*max(m, 0.0)*F.Alb[g]/PI; }\\n  } }\\n  L2 /= 64.0; fms /= 64.0;\\n  textureStore(msOut, vec2u(id.xy), g, L2/max(vec4f(1.0) - fms, vec4f(1e-3)));\\n}\\n\\n// sky irradiance on a level surface at 32 heights (0 … 20 km, square-root spaced), cosine-weighted directions\\n@compute @workgroup_size(32, 1, 1)\\nfn ambPass(@builtin(global_invocation_id) id: vec3u) {\\n  let hi = id.x; let g = id.y;\\n  let x = f32(hi)/31.0; let h = x*x*20.0; let r = Rg + h; let pos = vec3f(0.0, r, 0.0);\\n  let Ls = F.sunDir.xyz; let Lm = F.moonDir.xyz;\\n  var E = vec4f(0.0);\\n  for (var i = 0; i < 8; i++) { for (var j = 0; j < 16; j++) {\\n    let u1 = (f32(i) + 0.5)/8.0; let u2 = (f32(j) + 0.5)/16.0; let rr = sqrt(u1); let ph = 2.0*PI*u2;\\n    let rd = vec3f(rr*cos(ph), sqrt(1.0 - u1), rr*sin(ph)); let tmax = distToTop(r, rd.y);\\n    let cS = dot(rd, Ls); let cM = dot(rd, Lm);\\n    let pRs = phaseR(cS); let pMs = phaseCS(cS, F.atm2.x); let pFs = phaseFog(cS);\\n    let pRm = phaseR(cM); let pMm = phaseCS(cM, F.atm2.x); let pFm = phaseFog(cM);\\n    let N = 16; var T = vec4f(1.0); var L = vec4f(0.0);\\n    for (var k = 0; k < N; k++) {\\n      let f0 = f32(k)/f32(N); let f1 = f32(k + 1)/f32(N); let ta = tmax*f0*f0; let tb = tmax*f1*f1; let dt = tb - ta;\\n      let p = pos + rd*(ta + 0.5*dt); let rp = length(p); let hp = rp - Rg; let up = p/rp;\\n      let dF = densF(hp); let sR = F.BR[g]*densR(hp); let sM = F.BMs[g]*densM(hp); let ext = extinctionAt(g, hp); let sT = sR + sM + vec4f(dF);\\n      let muS = dot(up, Ls); let muM = dot(up, Lm); var S = vec4f(0.0);\\n      if (F.sunDir.w > 0.5) { S += F.SunE[g]*((sR*pRs + sM*pMs + dF*pFs)*transmittance(g, rp, muS) + sT*msLUT(g, hp, muS)); }\\n      if (F.moonDir.w > 0.5) { S += F.MoonE[g]*((sR*pRm + sM*pMm + dF*pFm)*transmittance(g, rp, muM) + sT*msLUT(g, hp, muM)); }\\n      let att = exp(-ext*dt); L += T*(S - S*att)/max(ext, vec4f(1e-9)); T *= att;\\n    }\\n    E += L;\\n  } }\\n  ambOut[hi*6u + g] = E*(PI/128.0);\\n}\\n\",\"meter\":\"// ---------- metering: illuminance on the ground at the camera, under the clouds (for auto exposure) ----------\\n@group(0) @binding(0) var<uniform> F: Frame;\\n@group(0) @binding(1) var transTex: texture_2d_array<f32>;\\n@group(0) @binding(2) var msTex: texture_2d_array<f32>;\\n@group(0) @binding(3) var linSamp: sampler;\\n@group(0) @binding(4) var<storage, read> amb: array<vec4f>;\\n@group(0) @binding(5) var<storage, read_write> meterOut: array<f32>;\\n@group(0) @binding(6) var<uniform> CU: Cloud;\\n@group(0) @binding(7) var lightTex: texture_3d<f32>;\\n\\n@compute @workgroup_size(1)\\nfn main() {\\n  let h = F.atm2.y; let r = Rg + h;\\n  // the clouds over the camera: direct beam through them, and what they pass on diffusely (two-stream, as on the ground)\\n  var lg = vec4f(0.0);\\n  if (CU.band.z > 0.5) {\\n    // (averaged over a few hundred metres: the meter should not jump as a small cloud's shadow passes)\\n    for (var i = 0; i < 9; i++) { let o = vec2f(f32(i % 3) - 1.0, f32(i/3) - 1.0)*0.25; lg += lightAt(vec3f(o.x, 0.0, o.y)); }\\n    lg /= 9.0;\\n  }\\n  let shS = exp(-lg.x); let shM = exp(-lg.y); let dif = 1.0/(1.0 + 0.105*lg.z);\\n  var Ed = 0.0; var Esky = 0.0;\\n  for (var g = 0u; g < 6u; g++) {\\n    let a = ambE(g, h)*dif; Esky += dot(a, F.CMFy[g]);\\n    var dir = vec4f(0.0);\\n    if (F.sunDir.w > 0.5) { let m0 = max(F.sunDir.y, 0.0); var tt = shS;\\n      if (lg.z > 0.0 && m0 > 0.0) { let mm = min(m0, 1.0); tt = max((0.5 + 0.75*mm + (0.5 - 0.75*mm)*shS)/(1.0 + 0.105*lg.z), shS); }\\n      dir += F.SunE[g]*transmittance(g, r, F.sunDir.y)*m0*tt; }\\n    if (F.moonDir.w > 0.5) { dir += F.MoonE[g]*transmittance(g, r, F.moonDir.y)*max(F.moonDir.y, 0.0)*shM; }\\n    Ed += dot(dir, F.CMFy[g]);\\n  }\\n  meterOut[0] = Ed + Esky; meterOut[1] = Ed; meterOut[2] = Esky; meterOut[3] = 0.0;\\n}\\n\",\"noise\":\"// ---------- tileable 3D detail noise (128³): r billows (Perlin–Worley), g/b cellular fBm at 2× and 4×, a Perlin fBm ----------\\n@group(0) @binding(0) var noiseOut: texture_storage_3d<rgba8unorm, write>;\\n@group(0) @binding(9) var<uniform> F: Frame;   // (declared for common.wgsl; unused here)\\nfn remap(v: f32, a: f32, b: f32, c: f32, d: f32) -> f32 { return c + (v - a)/(b - a)*(d - c); }\\nfn gnoiseP(p: vec3f, per: vec3f, seed: u32) -> f32 {\\n  let i = floor(p); let f = p - i; let u = f*f*f*(f*(f*6.0 - 15.0) + 10.0); var v: array<f32, 8>;\\n  for (var k = 0u; k < 8u; k++) { let o = vec3f(f32(k & 1u), f32((k >> 1u) & 1u), f32((k >> 2u) & 1u)); let c = (i + o) - per*floor((i + o)/per);\\n    let gr = hash3(vec3u(c) + vec3u(seed, seed*3u + 1u, seed*7u + 2u))*2.0 - 1.0; v[k] = dot(normalize(gr + 1e-5), f - o); }\\n  return mix(mix(mix(v[0], v[1], u.x), mix(v[2], v[3], u.x), u.y), mix(mix(v[4], v[5], u.x), mix(v[6], v[7], u.x), u.y), u.z);\\n}\\nfn worleyP(p: vec3f, per: vec3f, seed: u32) -> f32 {\\n  let i = floor(p); let f = p - i; var d = 1e9;\\n  for (var z = -1; z <= 1; z++) { for (var y = -1; y <= 1; y++) { for (var x = -1; x <= 1; x++) {\\n    let o = vec3f(f32(x), f32(y), f32(z)); let c = (i + o) - per*floor((i + o)/per);\\n    let r = o + hash3(vec3u(c) + vec3u(seed*11u + 5u, seed*13u + 3u, seed*17u + 9u)) - f; d = min(d, dot(r, r)); } } }\\n  return 1.0 - clamp(sqrt(d), 0.0, 1.0);\\n}\\nfn perlinFbm(p: vec3f, f0: f32, oct: u32, seed: u32) -> f32 { var s = 0.0; var a = 1.0; var n = 0.0; var f = f0;\\n  for (var i = 0u; i < oct; i++) { s += gnoiseP(p*f, vec3f(f), seed + i)*a; n += a; a *= 0.5; f *= 2.0; } return s/n; }\\nfn worleyFbm(p: vec3f, f: f32, seed: u32) -> f32 { return worleyP(p*f, vec3f(f), seed)*0.625 + worleyP(p*f*2.0, vec3f(f*2.0), seed + 1u)*0.25 + worleyP(p*f*4.0, vec3f(f*4.0), seed + 2u)*0.125; }\\n@compute @workgroup_size(4, 4, 4)\\nfn main(@builtin(global_invocation_id) id: vec3u) {\\n  let N = 128u; if (any(id >= vec3u(N))) { return; }\\n  let p = (vec3f(id) + 0.5)/f32(N);\\n  var pf = perlinFbm(p, 4.0, 5u, 3u)*0.5 + 0.5; pf = clamp(remap(pf, 0.15, 0.85, 0.0, 1.0), 0.0, 1.0);\\n  let w1 = worleyFbm(p, 4.0, 20u);\\n  let billow = clamp(remap(pf, 0.0, 1.0, w1, 1.0), 0.0, 1.0);\\n  textureStore(noiseOut, id, vec4f(billow, worleyFbm(p, 8.0, 30u), worleyFbm(p, 16.0, 40u), clamp(0.5 + 1.3*perlinFbm(p, 4.0, 4u, 75u), 0.0, 1.0)));\\n}\\n\",\"sky\":\"// ---------- the panorama: one sample per pixel per pass, added into the accumulation buffer ----------\\n@group(0) @binding(0) var<uniform> F: Frame;\\n@group(0) @binding(1) var transTex: texture_2d_array<f32>;\\n@group(0) @binding(2) var msTex: texture_2d_array<f32>;\\n@group(0) @binding(3) var linSamp: sampler;\\n@group(0) @binding(4) var<storage, read> amb: array<vec4f>;\\n@group(0) @binding(5) var<uniform> PS: Pass;\\n@group(0) @binding(6) var<storage, read_write> accum: array<vec4f>;\\n@group(0) @binding(7) var<uniform> CU: Cloud;\\n@group(0) @binding(8) var densTex: texture_3d<f32>;\\n@group(0) @binding(9) var lightTex: texture_3d<f32>;\\n@group(0) @binding(10) var noiseTex: texture_3d<f32>;\\n@group(0) @binding(11) var wrapSamp: sampler;\\n\\nconst MARIA = /*@MARIA*/;\\nconst CRATERS = /*@CRATERS*/;\\nconst RAYS = /*@RAYS*/;\\n\\nfn vnoise(p: vec3f) -> f32 {\\n  let i = floor(p); var f = p - i; f = f*f*(3.0 - 2.0*f); let b = vec3u(vec3i(i) + vec3i(4096));\\n  let a000 = hash3(b).x; let a100 = hash3(b + vec3u(1u, 0u, 0u)).x; let a010 = hash3(b + vec3u(0u, 1u, 0u)).x; let a110 = hash3(b + vec3u(1u, 1u, 0u)).x;\\n  let a001 = hash3(b + vec3u(0u, 0u, 1u)).x; let a101 = hash3(b + vec3u(1u, 0u, 1u)).x; let a011 = hash3(b + vec3u(0u, 1u, 1u)).x; let a111 = hash3(b + vec3u(1u, 1u, 1u)).x;\\n  return mix(mix(mix(a000, a100, f.x), mix(a010, a110, f.x), f.y), mix(mix(a001, a101, f.x), mix(a011, a111, f.x), f.y), f.z);\\n}\\nfn fbm3(p0: vec3f) -> f32 { var s = 0.0; var a = 0.5; var p = p0; for (var i = 0; i < 5; i++) { s += a*vnoise(p); p *= 2.03; a *= 0.5; } return s; }\\nfn selDir(ll: vec2f) -> vec3f { let lo = radians(ll.x); let la = radians(ll.y); return vec3f(cos(la)*sin(lo), sin(la), cos(la)*cos(lo)); }\\nfn moonHeight(n: vec3f) -> f32 { return fbm3(n*16.0)*0.6 + vnoise(n*48.0)*0.3 + vnoise(n*140.0)*0.1; }\\nfn moonAlbedo(n: vec3f) -> f32 {\\n  var dark = 0.0;\\n  let wv = (fbm3(n*5.0 + 11.0) - 0.47)*2.0;\\n  for (var i = 0; i < i32(arrayLength_MARIA); i++) { let m = MARIA[i]; let ang = degrees(acos(clamp(dot(n, selDir(m.xy)), -1.0, 1.0))) + wv*m.z*0.45;\\n    dark = max(dark, m.w*(1.0 - smoothstep(m.z*0.55, m.z*1.2, ang))); }\\n  var a = 1.0 - dark*(0.75 + 0.5*fbm3(n*12.0)) + 0.09*(fbm3(n*9.0) - 0.5) + 0.07*(vnoise(n*42.0) - 0.5)*(1.0 - dark) + 0.05*(vnoise(n*130.0) - 0.5);\\n  a += 0.3*smoothstep(0.86, 0.97, vnoise(n*95.0))*(1.0 - 0.6*dark) + 0.2*smoothstep(0.9, 0.98, vnoise(n*230.0 + 5.0));\\n  for (var i = 0; i < i32(arrayLength_CRATERS); i++) { let c = CRATERS[i]; let ang = degrees(acos(clamp(dot(n, selDir(c.xy)), -1.0, 1.0))); a += c.w*(1.0 - smoothstep(c.z*0.6, c.z*1.3, ang)); }\\n  for (var i = 0; i < i32(arrayLength_RAYS); i++) { let r = RAYS[i]; let c = selDir(r.xy); let ang = degrees(acos(clamp(dot(n, c), -1.0, 1.0)));\\n    if (ang < r.z) { let e1 = normalize(cross(c, vec3f(0.0, 1.0, 0.0))); let e2 = cross(c, e1); let v = n - c*dot(n, c); let ph = atan2(dot(v, e2), dot(v, e1));\\n      let pat = pow(vnoise(vec3f(cos(ph)*11.0, sin(ph)*11.0, f32(i)*7.31)), 3.0) + 0.5*pow(vnoise(vec3f(cos(ph)*29.0, sin(ph)*29.0, f32(i)*3.7 + 40.0)), 4.0);\\n      a += r.w*pat*pow(1.0 - ang/r.z, 1.4)*smoothstep(1.0, 2.5, ang)*(0.7 + 0.6*vnoise(n*60.0)); } }\\n  return max(a, 0.2);\\n}\\nfn starSpec(t: u32, g: u32) -> vec4f { return F.Star[t*6u + g]; }\\n\\n// stars found near this direction (at most 9), their weights and blackbody index, gathered once per pixel\\nstruct Stars { w: array<f32, 9>, t: array<u32, 9>, n: u32 }\\n\\n@compute @workgroup_size(8, 8, 1)\\nfn main(@builtin(global_invocation_id) id: vec3u) {\\n  let W = PS.W; let H = PS.H; let py = id.y + PS.rowOff; let pxX = id.x + PS.colOff;\\n  if (pxX >= PS.colEnd || py >= PS.rowEnd) { return; }\\n  let fW = f32(W); let fH = f32(H);\\n  let n = PS.frame;\\n  let jit = select(vec2f(fract(0.5 + f32(n)*0.7548776662) - 0.5, fract(0.5 + f32(n)*0.5698402910) - 0.5), vec2f(0.0), n == 0u);\\n  let px = vec2f(f32(pxX), f32(py)) + 0.5 + jit;\\n  let rd = dirFromPixel(px, fW, fH);\\n  let camH = F.atm2.y; let ro = vec3f(0.0, camH, 0.0); let r0 = Rg + camH; let mu = rd.y;\\n  let gN = groundHit(r0, mu); let hitG = gN > 0.0 && F.opts.y < 0.5;\\n  let tEnd = select(distToTop(r0, mu), gN, gN > 0.0);\\n  let Ls = F.sunDir.xyz; let Lm = F.moonDir.xyz; let cS = dot(rd, Ls); let cM = dot(rd, Lm);\\n  let pRs = phaseR(cS); let pMs = phaseCS(cS, F.atm2.x); let pFs = phaseFog(cS);\\n  let pRm = phaseR(cM); let pMm = phaseCS(cM, F.atm2.x); let pFm = phaseFog(cM);\\n  let ign = fract(hash3(vec3u(pxX, py, 977u)).x + f32(n)*0.61803398875);\\n  let jt = select(fract(0.5 + f32(n)*0.61803398875 + (ign - 0.5)*0.3), 0.5, n == 0u);\\n  let NS = u32(F.opts.x);\\n\\n  // ---- what lies behind, as wavelength-independent factors: ground, sun disc, moon disc, stars, Milky Way\\n  var ground = vec4f(0.0, 0.0, 0.0, 0.0);   // x: μ_sun, y: μ_moon at the ground point (hitG)\\n  var sunSm: array<f32, 16>; var sunN = 0u;\\n  var moonAcc = 0.0; var inMoon = false; var mwL = 0.0; var st: Stars; st.n = 0u;\\n  let vr = 1.0/sqrt(max(1.0 - pow(Rg/(Rg + 95.0), 2.0)*(1.0 - mu*mu), 1e-4));   // airglow: van Rhijn brightening toward the horizon\\n  if (hitG) { let pg = ro + rd*gN; let up = normalize(pg - C0); ground = vec4f(dot(up, Ls), dot(up, Lm), 0.0, 0.0); }\\n  else if (gN <= 0.0) {\\n    let pa = PI/fH; let sunRad = F.atm2.w; let squash = F.pole.w;\\n    if (F.opts.z > 0.5 && length(rd - Ls) < sunRad/squash + 3.0*pa) {\\n      // the solar disc (limb-darkened, squashed by refraction near the horizon), 16 sub-samples\\n      let upT = select(vec3f(1.0, 0.0, 0.0), normalize(vec3f(0.0, 1.0, 0.0) - Ls*Ls.y), abs(Ls.y) < 0.999); let rtT = cross(upT, Ls);\\n      for (var k = 0u; k < 16u; k++) {\\n        let so = (vec2f(f32(k % 4u), f32(k/4u)) + 0.5)/4.0 - 0.5; let d = dirFromPixel(px + so, fW, fH); let v = d - Ls*dot(d, Ls);\\n        let x = length(vec2f(dot(v, rtT), dot(v, upT)/squash))/sunRad;\\n        if (x < 1.0 && dot(d, Ls) > 0.0) { sunSm[sunN] = max(sqrt(1.0 - x*x), 1e-4); sunN++; }\\n      }\\n    }\\n    let moonRad = F.moonLight.w;\\n    if (length(rd - Lm) < moonRad + 3.0*pa) {\\n      let zM = -Lm; let yM = normalize(F.pole.xyz - dot(F.pole.xyz, zM)*zM); let xM = cross(yM, Lm); let rho = sin(moonRad);\\n      for (var k = 0u; k < 16u; k++) {\\n        let so = (vec2f(f32(k % 4u), f32(k/4u)) + 0.5)/4.0 - 0.5; let d = dirFromPixel(px + so, fW, fH); let dist = length(cross(d, Lm));\\n        if (dist < rho && dot(d, Lm) > 0.0) {\\n          let tt = dot(d, Lm) - sqrt(rho*rho - dist*dist); let nn = (d*tt - Lm)/rho;\\n          let nm = vec3f(dot(nn, xM), dot(nn, yM), dot(nn, zM));\\n          let E = 0.004; let h0 = moonHeight(nm);\\n          let gm = vec3f(moonHeight(nm + vec3f(E, 0.0, 0.0)) - h0, moonHeight(nm + vec3f(0.0, E, 0.0)) - h0, moonHeight(nm + vec3f(0.0, 0.0, E)) - h0)/E;\\n          let gw = gm.x*xM + gm.y*yM + gm.z*zM; let nb = normalize(nn - 0.012*(gw - nn*dot(gw, nn)));\\n          let m0 = dot(nb, F.moonLight.xyz); let mv = max(dot(nn, -d), 0.0);\\n          moonAcc += moonAlbedo(nm)*select(2e-4*mv, m0/(m0 + mv), m0 > 0.0)*smoothstep(-0.02, 0.03, dot(nn, F.moonLight.xyz) + 0.02);\\n        }\\n      }\\n      moonAcc /= 16.0; inMoon = length(rd - Lm) < moonRad;\\n    }\\n    if (F.eqX.w > 0.5 && !inMoon) {\\n      let q = vec3f(dot(F.eqX.xyz, rd), dot(F.eqY.xyz, rd), dot(F.eqZ.xyz, rd));\\n      if (F.galX.w > 0.0) {\\n        let b = asin(clamp(dot(q, F.galZ.xyz), -1.0, 1.0)); let l = atan2(dot(q, F.galY.xyz), dot(q, F.galX.xyz)); let lw = abs(l);\\n        let disk = exp(-abs(b)/radians(7.5))*(0.32 + 0.68*exp(-lw*lw/2.0));\\n        let bulge = exp(-(l*l)/(2.0*0.30*0.30) - (b*b)/(2.0*0.16*0.16));\\n        let nz = fbm3(q*7.0 + 3.1);\\n        let lanes = 1.0 - 0.75*exp(-abs(b + 0.015*sin(l*5.0))/radians(2.2))*smoothstep(0.35, 0.75, fbm3(q*11.0 + 7.3))*exp(-lw*lw/(2.0*1.4*1.4));\\n        mwL = 6e-4*F.galX.w*(disk*(0.55 + 0.9*nz) + 1.3*bulge)*lanes;\\n      }\\n      if (F.eqY.w > 0.5) {\\n        // stars: a hashed catalogue on the faces of a cube in the equatorial frame, magnitudes from a power law\\n        let aq = abs(q); var face = 0u; var fuv = vec2f(0.0);\\n        if (aq.x >= aq.y && aq.x >= aq.z) { face = select(1u, 0u, q.x > 0.0); fuv = vec2f(q.z, q.y)/aq.x; }\\n        else if (aq.y >= aq.z) { face = select(3u, 2u, q.y > 0.0); fuv = vec2f(q.x, q.z)/aq.y; }\\n        else { face = select(5u, 4u, q.z > 0.0); fuv = vec2f(q.x, q.y)/aq.z; }\\n        let NC = 256.0; let cell = vec2i(floor((fuv*0.5 + 0.5)*NC)); let sig = 0.5*pa;\\n        for (var dy = -1; dy <= 1; dy++) { for (var dx = -1; dx <= 1; dx++) {\\n          let c = cell + vec2i(dx, dy); if (c.x < 0 || c.y < 0 || c.x >= 256 || c.y >= 256) { continue; }\\n          let hh = hash3(vec3u(u32(c.x), u32(c.y), face*7919u + 17u));\\n          let m = (log(max(hh.x, 1e-9)*393216.0)/log(10.0) - 0.9)/0.47; if (m > F.eqZ.w) { continue; }\\n          let h2 = hash3(vec3u(u32(c.y) + 911u, u32(c.x) + 313u, face*104729u + 3u));\\n          let suv = (vec2f(c) + hh.yz)/NC*2.0 - 1.0; var sd: vec3f;\\n          if (face == 0u) { sd = vec3f(1.0, suv.y, suv.x); } else if (face == 1u) { sd = vec3f(-1.0, suv.y, suv.x); }\\n          else if (face == 2u) { sd = vec3f(suv.x, 1.0, suv.y); } else if (face == 3u) { sd = vec3f(suv.x, -1.0, suv.y); }\\n          else if (face == 4u) { sd = vec3f(suv.x, suv.y, 1.0); } else { sd = vec3f(suv.x, suv.y, -1.0); }\\n          sd = normalize(sd); let ang = length(q - sd); if (ang > 4.0*sig) { continue; }\\n          let kern = exp(-ang*ang/(2.0*sig*sig))/(2.0*PI*sig*sig); let Ev = 2.54e-6*pow(10.0, -0.4*m);\\n          let u = h2.x; var Tk: f32;\\n          if (u < 0.12) { Tk = mix(3000.0, 3800.0, h2.y); } else if (u < 0.42) { Tk = mix(3900.0, 5200.0, h2.y); } else if (u < 0.70) { Tk = mix(5200.0, 6000.0, h2.y); }\\n          else if (u < 0.85) { Tk = mix(6000.0, 7500.0, h2.y); } else if (u < 0.95) { Tk = mix(7500.0, 10000.0, h2.y); } else { Tk = mix(10000.0, 25000.0, h2.y); }\\n          st.w[st.n] = Ev*kern; st.t[st.n] = u32(clamp(floor(15.0*log(Tk/2500.0)/log(10.0) + 0.5), 0.0, 15.0)); st.n++;\\n        } }\\n      }\\n    }\\n  }\\n\\n  // ---- the view ray: air in segments (spectral), and inside each segment the clouds (grey: water droplets scatter all\\n  // wavelengths alike, so everything inside the clouds is one number per step; colour comes from the light reaching them)\\n  var L: array<vec4f, 6>; var T: array<vec4f, 6>;\\n  for (var g = 0u; g < 6u; g++) { L[g] = vec4f(0.0); T[g] = vec4f(1.0); }\\n  var Tc = 1.0;                                   // transmittance through the clouds so far\\n  let cloudOn = CU.band.z > 0.5;\\n  let cs1 = phaseCloud(cS); let cm1 = phaseCloud(cM);\\n  let iso = 1.0/(4.0*PI);\\n  var cloudSteps = 0u;\\n  let rj = fract(hash3(vec3u(pxX, py, 4211u)).x + f32(n)*0.7548776662);\\n  for (var i = 0u; i < NS; i++) {\\n    let f0 = f32(i)/f32(NS); let f1 = f32(i + 1u)/f32(NS); let ta = tEnd*f0*f0; let tb = tEnd*f1*f1; let dt = tb - ta; let tAir = ta + dt*jt;\\n    // clouds in this segment\\n    var Fs = 0.0; var Fm = 0.0; var Fa = 0.0; var Fg = 0.0; var Fd = 0.0; var TcAir = Tc;\\n    let qa = volPos(ro + rd*ta); let qb = volPos(ro + rd*tb);\\n    let segLo = min(qa.y, qb.y); let segHi = max(qa.y, qb.y);\\n    if (cloudOn && Tc > 0.0 && segHi > CU.band.x - 0.3 && segLo < CU.band.y + 0.1) {\\n      var t = ta; var airDone = false;\\n      let base = clamp(ta*0.005, 0.02, 1.0);\\n      t += base*rj;\\n      loop {\\n        // practically opaque: what lies behind (the sun's disc above all, ~1e9 cd/m²) is cut off entirely rather than leaking\\n /* ---------- panel ---------- */
const CTRL = [];
function sliderPos(it, v){ return it.log ? Math.log(v/it.min)/Math.log(it.max/it.min) : v; }
function sliderVal(it, x){ return it.log ? it.min*Math.pow(it.max/it.min, x) : x; }
function buildPanel(){
  const panel = $('#panel'); panel.innerHTML = '';
  for (const sec of SECTIONS){
    const el = document.createElement('section'); el.className = 'sec'; if (sec.hidden && sec.hidden()) el.hidden = true; el.innerHTML = `<h2>${sec.title}</h2>`; const rows = document.createElement('div'); rows.className = 'rows'; el.appendChild(rows);
    for (const it of sec.items){
      const row = document.createElement('div'); row.className = 'row'; rows.appendChild(row);
      if (it.type === 'buttons'){ row.classList.add('full'); row.innerHTML = `<div class="btns">${it.btns.map((b, i) => `<button class="btn" data-i="${i}">${b[0]}</button>`).join('')}</div>`;
        row.querySelectorAll('button').forEach(bt => bt.onclick = () => it.btns[+bt.dataset.i][1]()); CTRL.push({it, row}); continue; }
      if (it.type === 'note'){ row.classList.add('full'); row.innerHTML = `<div class="note">${it.html}</div>`; CTRL.push({it, row}); continue; }
      const id = 'c_' + it.k;
      if (it.type === 'select'){ row.innerHTML = `<label for="${id}">${it.label}</label><select id="${id}">${it.opts.map(([v, t]) => `<option value="${v}">${t}</option>`).join('')}</select>`;
        const s = row.querySelector('select'); s.onchange = () => { P[it.k] = s.value; changed(); }; CTRL.push({it, row, set:() => { s.value = P[it.k]; }}); }
      else if (it.type === 'check'){ row.innerHTML = `<label for="${id}">${it.label}</label><input type="checkbox" id="${id}">`;
        const c = row.querySelector('input'); c.onchange = () => { P[it.k] = c.checked; changed(); }; CTRL.push({it, row, set:() => { c.checked = !!P[it.k]; }}); }
      else if (it.type === 'date' || it.type === 'time' || it.type === 'number'){ row.innerHTML = `<label for="${id}">${it.label}</label><input type="${it.type}" id="${id}" ${it.step ? `step="${it.step}"` : ''}>`;
        const c = row.querySelector('input'); c.onchange = () => { P[it.k] = it.type === 'number' ? +c.value : c.value; changed(); }; CTRL.push({it, row, set:() => { c.value = P[it.k]; }}); }
      else { // range
        row.innerHTML = `<label for="${id}">${it.label}</label><span class="val"></span><input type="range" id="${id}">`;
        const r = row.querySelector('input'), val = row.querySelector('.val');
        if (it.log){ r.min = 0; r.max = 1; r.step = 0.001; } else { r.min = it.min; r.max = it.max; r.step = it.step || 0.01; }
        r.oninput = () => { P[it.k] = sliderVal(it, +r.value); val.textContent = it.fmt ? it.fmt(P[it.k]) : P[it.k]; changed(true); };
        CTRL.push({it, row, set:() => { r.value = sliderPos(it, P[it.k]); val.textContent = it.fmt ? it.fmt(P[it.k]) : P[it.k]; }});
      }
    }
    panel.appendChild(el);
  }
  syncUI();
}
function syncUI(){ for (const c of CTRL){ if (c.set) c.set(); c.row.hidden = c.it.show ? !c.it.show() : false; } }

/* ---------- talking to the worker ---------- */
let sendPending = false;
function changed(fromSlider){ if (!fromSlider) syncUI(); else for (const c of CTRL) c.row.hidden = c.it.show ? !c.it.show() : false;
  if (sendPending) return; sendPending = true; requestAnimationFrame(() => { sendPending = false; sendParams(); }); }
function sendParams(){ if (worker) worker.postMessage({type:'params', P}); drawOverlay(); }
function sendView(extra){ if (!worker) return; worker.postMessage({type:'view', view:{...view, ...extra}}); }

function setStatus(t){ $('#status').textContent = t; }
function readouts(st){
  const d = st.derived || {}, m = st.meter || {}; const lux = v => v >= 1000 ? `${(v/1000).toFixed(1)} klx` : v >= 1 ? `${v.toFixed(1)} lx` : `${v.toPrecision(2)} lx`;
  const items = [['Sun', `${(d.sunEl ?? 0).toFixed(1)}° <small>az ${(d.sunAz ?? 0).toFixed(0)}°</small>`], ['Moon', `${(d.moonEl ?? 0).toFixed(1)}° <small>${Math.round((d.illum ?? 0)*100)}% lit</small>`],
    ['Visibility', d.vis ? `${d.vis >= 10 ? d.vis.toFixed(0) : d.vis.toFixed(1)} km` : '–'], ['Ground light', m.E ? `${lux(m.E)} <small>${lux(m.Ed || 0)} direct</small>` : '–'], ['Humidity', d.RHp ? `${Math.round(d.RHp)}%` : '–']];
  $('#readouts').innerHTML = items.map(([k, v]) => `<div class="ro"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
}

/* ---------- view: overlay (compass, horizon), dragging, sizing ---------- */
const cv = $('#gl');
function canvasSize(){ const r = $('#view').getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2); return [Math.max(1, Math.round(r.width*dpr)), Math.max(1, Math.round(r.height*dpr)), r]; }
function panoRect(){ const [, , r] = canvasSize(); let w = r.width, h = w/2; if (h > r.height){ h = r.height; w = h*2; } return {x:(r.width - w)/2, y:(r.height - h)/2, w, h}; }
function drawOverlay(){
  const ov = $('#overlay'); if (view.mode === 1){ ov.innerHTML = ''; return; }
  const pr = panoRect(); let html = `<div class="hline" style="left:${pr.x}px;width:${pr.w}px;top:${pr.y + pr.h/2}px"></div>`;
  ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'].forEach((n, i) => { const az = i*45; const u = (((az - P.azOff)/360 + 0.5) % 1 + 1) % 1; html += `<div class="compass" style="left:${pr.x + u*pr.w}px;top:${pr.y + pr.h/2 + 4}px">${n}</div>`; });
  ov.innerHTML = html; }
function resize(){ const [w, h] = canvasSize(); sendView({cw:w, ch:h}); drawOverlay(); }
new ResizeObserver(resize).observe($('#view'));
let drag = null;
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); drag = {x:e.clientX, y:e.clientY, yaw:view.yaw, pitch:view.pitch, moved:false}; });
cv.addEventListener('pointermove', e => { if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.hypot(dx, dy) > 3) drag.moved = true;
  if (view.mode === 1 && drag.moved){ const k = view.fov/cv.getBoundingClientRect().height; view.yaw = drag.yaw - dx*k; view.pitch = clamp(drag.pitch + dy*k, -1.5, 1.5); sendView(); }
  else if (view.mode !== 1 && P.mode === 'manual') placeSun(e); });
cv.addEventListener('pointerup', e => { if (drag && !drag.moved && view.mode !== 1 && P.mode === 'manual') placeSun(e); drag = null; });
cv.addEventListener('wheel', e => { if (view.mode !== 1) return; e.preventDefault(); view.fov = clamp(view.fov*Math.exp(e.deltaY*0.001), 10*D2R, 140*D2R); sendView(); }, {passive:false});
function placeSun(e){ const pr = panoRect(), r = $('#view').getBoundingClientRect(); const u = (e.clientX - r.left - pr.x)/pr.w, v = (e.clientY - r.top - pr.y)/pr.h; if (u < 0 || u > 1 || v < 0 || v > 1) return;
  P.sunAz = ((((u - 0.5)*360 + P.azOff) % 360) + 360) % 360; P.sunEl = clamp((0.5 - v)*180, -20, 90); changed(); }
document.querySelectorAll('#viewSeg button').forEach(b => b.onclick = () => { document.querySelectorAll('#viewSeg button').forEach(x => x.classList.toggle('on', x === b)); view.mode = +b.dataset.v; $('#legend').hidden = view.mode !== 2; sendView(); drawOverlay(); });
document.querySelectorAll('#resSeg button').forEach(b => b.onclick = () => { document.querySelectorAll('#resSeg button').forEach(x => x.classList.toggle('on', x === b)); P.previewRes = +b.dataset.r; changed(); });
$('#autoEx').onchange = e => { view.auto = e.target.checked; sendView(); };
$('#exSlider').oninput = e => { view.expoComp = +e.target.value; $('#exVal').textContent = `${view.expoComp >= 0 ? '+' : '−'}${Math.abs(view.expoComp).toFixed(1)} EV`; sendView(); };

/* ---------- start ---------- */
const pending = new Map(); let rbId = 0;
function start(){
  buildPanel(); readouts({});
  if (!navigator.gpu){ $('#ldStep').textContent = 'This browser has no WebGPU.'; setStatus('No WebGPU'); return; }
  const blob = new Blob([WORKER_SRC], {type:'text/javascript'}); worker = new Worker(URL.createObjectURL(blob));
  const off = cv.transferControlToOffscreen();
  worker.onmessage = e => { const m = e.data;
    if (m.type === 'log') console.log('[worker] ' + m.text);
    else if (m.type === 'stage') $('#ldStep').textContent = m.text[0].toUpperCase() + m.text.slice(1) + '…';
    else if (m.type === 'ready'){ ready = true; $('#loader').classList.add('gone'); resize(); sendParams(); window.__sky.adapter = m.adapter; }
    else if (m.type === 'status'){ lastStatus = m; readouts(m);
      setStatus(m.done ? `${m.W}×${m.H} · ${m.sample} samples · ${(m.total/1000).toFixed(1)} s` : `${m.W}×${m.H} · sample ${m.sample + 1}/${m.target} · ${Math.round(m.row/(m.rows || m.H)*100)}%`); }
    else if (m.type === 'error'){ console.error(m.message); setStatus('Error'); $('#loader').classList.remove('gone'); $('#ldTitle').textContent = 'Something went wrong'; $('#ldStep').textContent = m.message.slice(0, 400); window.__sky.error = m.message; }
    else if (m.type === 'probe'){ const r = pending.get(m.id); pending.delete(m.id); if (r) r(m); }
    else if (m.type === 'shot'){ const r = pending.get(m.id); pending.delete(m.id); if (r) r(m); }
    else if (m.type === 'pixels'){ const r = pending.get(m.id); pending.delete(m.id); if (r) r(m); } };
  worker.onerror = e => { console.error('worker', e.message); $('#ldStep').textContent = 'Worker error: ' + e.message; window.__sky.error = e.message; };
  const [w, h] = canvasSize(); off.width = w; off.height = h;
  worker.postMessage({type:'init', canvas: off, noPresent: !!P.noPresent}, [off]);
}
// test hooks (used by the automated checks)
window.__sky = {
  P, view,
  set(o){ Object.assign(P, o); syncUI(); sendParams(); },
  status: () => lastStatus, ready: () => ready,
  readback: () => new Promise(res => { const id = ++rbId; pending.set(id, res); worker.postMessage({type:'readback', id}); }),
  setView(o){ Object.assign(view, o); sendView(); },
  probe: (l, alt) => new Promise(res => { const id = ++rbId; pending.set(id, res); worker.postMessage({type:'probe', id, l, alt}); }),
  shot: () => new Promise(res => { const id = ++rbId; pending.set(id, res); worker.postMessage({type:'shot', id}); }),
};
start();

</script>
