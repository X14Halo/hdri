<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spectral Sky Next</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%23f0c27f%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#0a0d11; --panel:#10141a; --raise:#161b23; --line:#222a35; --line2:#2c3644;
  --fg:#dde3ea; --muted:#8893a1; --faint:#5c6774;
  --accent:#9ec5ff; --accent-ink:#0b1626; --sun:#f0c27f; --moon:#bcc7d8; --warn:#e8a35a; --bad:#e8766a;
  --ui:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.45 var(--ui);overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,select,input{font:inherit;color:inherit}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 372px}
#stage{min-width:0;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;border-right:1px solid var(--line)}
/* the tool strip sits over the top of the image on large screens and in its own row above it on small ones */
#stage>*{grid-column:1} #stage>.bar{grid-row:1} #stage>.view{grid-row:2/4} #stage>.tools{grid-row:2} #stage>.readouts{grid-row:4}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 16px;border-bottom:1px solid var(--line);min-width:0}
@media (max-width:1250px){.brand .tag{display:none}}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand b{font-weight:600;font-size:15px;letter-spacing:.01em}
.brand .tag{font:11px var(--mono);color:var(--muted);letter-spacing:.04em}
.mark{width:12px;height:12px;border-radius:50%;align-self:center;background:radial-gradient(circle at 50% 50%,#fff 0 18%,var(--sun) 30%,rgba(240,194,127,0) 70%),linear-gradient(#5f8fd6,#c7dcf5);}
.pre-wrap{position:relative;flex:none}
.pre-btn{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;max-width:300px}
.pre-btn .pre-lbl{color:var(--muted)}
.pre-btn b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pre-btn .caret{color:var(--muted);font-size:10px;transition:transform .15s}
.pre-btn[aria-expanded="true"] .caret{transform:rotate(180deg)}
.presets{position:absolute;top:calc(100% + 8px);left:0;z-index:40;width:min(540px,calc(100vw - 32px));max-height:min(70vh,560px);overflow:auto;
  background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:6px 14px 14px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.pre-grp h4{margin:10px 0 7px;font:600 10.5px var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.pre-chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{flex:none;border:1px solid var(--line2);background:transparent;border-radius:999px;padding:4px 11px;color:var(--muted);cursor:pointer;white-space:nowrap}
.chip:hover{color:var(--fg);border-color:var(--faint)}
.chip.on{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.view{position:relative;min-height:0;background:#07090c;overflow:hidden;touch-action:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.overlay{position:absolute;inset:0;pointer-events:none}
.compass{position:absolute;font:10px var(--mono);color:rgba(230,236,244,.7);transform:translateX(-50%);letter-spacing:.06em}
.hline{position:absolute;height:0;border-top:1px dashed rgba(230,236,244,.18)}
.tools{position:relative;z-index:15;align-self:start;justify-self:start;margin:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:calc(100% - 24px);min-width:0}
.seg{display:inline-flex;background:rgba(16,20,26,.86);border:1px solid var(--line2);border-radius:8px;padding:2px;backdrop-filter:blur(6px)}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:6px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--raise);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.seg button:hover{color:var(--fg)}
.expo{display:inline-flex;align-items:center;gap:8px;background:rgba(16,20,26,.86);border:1px solid var(--line2);border-radius:8px;padding:4px 10px;backdrop-filter:blur(6px)}
.expo input[type=range]{width:110px}
.expo .v{font:11px var(--mono);color:var(--muted);min-width:66px}
.status{position:absolute;right:12px;bottom:10px;font:11px var(--mono);color:var(--muted);background:rgba(10,13,17,.8);padding:3px 8px;border-radius:6px}
.brush{position:absolute;border:1.5px solid #5fd08c;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.45),inset 0 0 0 1px rgba(0,0,0,.25)}
.brush.rem{border-color:#f0675c}
.hint{position:absolute;left:12px;bottom:10px;font:11px var(--mono);color:var(--muted);background:rgba(10,13,17,.8);padding:3px 8px;border-radius:6px}
.map{width:100%;aspect-ratio:2/1;border-radius:6px;display:block;cursor:crosshair;background:#0f1a26;touch-action:none;max-width:100%}
.tgrid{display:flex;flex-wrap:wrap;gap:6px}
.tchip{border:1px solid var(--line2);background:var(--raise);border-radius:6px;padding:4px 8px;cursor:pointer;font:11px var(--mono);font-variant-numeric:tabular-nums;color:var(--fg);text-align:left;display:grid;gap:1px}
.tchip span{font:10px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tchip:hover{border-color:var(--faint)}
.btn.rand{flex:none;padding:5px 12px;border-radius:999px}
.variety{flex:none;display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted)}
.variety input[type=range]{width:84px}
.variety b{font:600 11px var(--mono);color:var(--fg);min-width:62px}
.legend{position:absolute;left:12px;bottom:10px;display:flex;align-items:center;gap:6px;font:10px var(--mono);color:var(--muted);background:rgba(10,13,17,.8);padding:4px 8px;border-radius:6px}
.legend i{display:block;width:180px;height:8px;border-radius:2px;background:linear-gradient(90deg,#30123b,#4662d7,#36aaf9,#1ae4b6,#72fe5e,#c7ef34,#faba39,#f66b19,#ca2a04,#7a0403)}
.readouts{display:flex;flex-wrap:wrap;gap:0;border-top:1px solid var(--line);background:var(--panel)}
.ro{padding:8px 14px;border-right:1px solid var(--line);min-width:0}
.ro .k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.ro .v{font:500 13px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.ro .v small{color:var(--muted);font-weight:400;font-size:11px}
#panel{background:var(--panel);overflow-y:auto;min-width:0;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.sec{border-bottom:1px solid var(--line)}
.sec>h2{margin:0;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:12px 16px 4px;display:flex;justify-content:space-between;align-items:center}
.sec>h2 span{font:10px var(--mono);letter-spacing:0;text-transform:none;color:var(--faint)}
.rows{display:grid;gap:2px;padding:4px 16px 14px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:2px 10px;padding:3px 0}
.row label{color:var(--fg);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .val{font:12px var(--mono);color:var(--accent);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.row input[type=range]{grid-column:1/-1}
.row select,.row input[type=date],.row input[type=time],.row input[type=number]{background:var(--raise);border:1px solid var(--line2);border-radius:6px;padding:4px 6px;max-width:190px}
.row.full{grid-template-columns:1fr}
.note{color:var(--muted);font-size:12px;line-height:1.45}
.note b{color:var(--fg);font-weight:500}
.mono{font-family:var(--mono)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--line2);border-radius:2px}
input[type=range]::-moz-range-track{height:3px;background:var(--line2);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--fg);margin-top:-5px;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--faint)}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--fg);border:2px solid var(--panel)}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 2px var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line2);background:var(--raise);border-radius:7px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tools .btn{padding:5px 12px}
.btn:disabled{opacity:.45;cursor:default}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.err{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--fg);background:var(--bg)}
.err p{max-width:52ch;color:var(--muted)}
.safe-note{position:absolute;left:12px;right:12px;bottom:12px;z-index:30;max-width:560px;background:rgba(16,20,26,.94);border:1px solid var(--warn);border-radius:10px;padding:10px 12px;color:var(--fg);font-size:12.5px;line-height:1.5}
.safe-note i{color:var(--warn);font-style:normal}
.safe-note .btn{margin-left:8px;padding:2px 10px}
.ldc-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin:4px 0 2px}
.ldc-sw{aspect-ratio:1;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.ldc-hist{width:100%;height:auto;display:block;background:var(--raise);border-radius:6px;margin-top:4px}
.swatch{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
/* small screens: the tools get their own row, so nothing covers the image */
@media (max-width:860px), (max-height:560px){
  #stage>.view{grid-row:3} #stage>.tools{grid-row:2}
  .tools{margin:0;padding:8px 10px;max-width:none;justify-self:stretch;gap:6px;border-bottom:1px solid var(--line);background:var(--bg)}
  .seg button{padding:5px 9px}
  .tools .seg{flex-wrap:wrap;max-width:100%}
  .expo input[type=range]{width:90px}
}
@media (max-width:860px){
  body{overflow:auto}
  #app{grid-template-columns:1fr;height:auto}
  /* a 2:1 panorama fills the width; look-around gets a little more height */
  #stage{border-right:0;grid-template-rows:auto auto clamp(200px, 62vw, 60vh) auto}
  #panel{overflow:visible}
  .bar{flex-wrap:wrap;gap:8px;padding:10px 12px}
  .presets{width:calc(100vw - 24px)}
  .ro{padding:6px 10px}
}
/* short landscape screens (phones turned sideways): one scrolling row of tools and of readouts, a narrower rack */
@media (max-height:560px) and (min-width:561px){
  body{overflow:hidden}
  #app{height:100%;grid-template-columns:minmax(0,1fr) min(320px, 40vw)}
  #stage{border-right:1px solid var(--line);grid-template-rows:auto auto minmax(0,1fr) auto}
  #panel{overflow-y:auto}
  .bar{flex-wrap:nowrap;overflow-x:auto;padding:6px 10px;gap:8px;scrollbar-width:none}
  .brand .tag{display:none}
  .tools{flex-wrap:nowrap;overflow-x:auto;padding:6px 10px;scrollbar-width:none}
  .tools>*{flex:none}
  .readouts{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .ro{padding:4px 10px;flex:none}
  .ro .k{font-size:9px}
  .ro .v{font-size:12px}
}
.loader{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(7,9,12,.86);transition:opacity .45s ease,background .45s ease}
.loader.light{background:rgba(7,9,12,.3)}
.loader.gone{opacity:0;pointer-events:none}
.ld-card{width:min(340px,100%);background:rgba(16,20,26,.94);border:1px solid var(--line2);border-radius:12px;padding:18px 20px 16px;text-align:center;box-shadow:0 16px 48px rgba(0,0,0,.5)}
.ld-spin{width:30px;height:30px;margin:0 auto 12px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--sun);animation:ldspin .9s linear infinite}
@keyframes ldspin{to{transform:rotate(360deg)}}
.ld-title{font-weight:600;font-size:14px}
.ld-step{color:var(--muted);margin-top:3px;min-height:1.45em;font-size:12.5px}
.ld-bar{height:3px;background:var(--line2);border-radius:2px;margin-top:12px;overflow:hidden}
.ld-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s ease}
.ld-hint{color:var(--faint);font-size:11.5px;margin-top:10px;line-height:1.45}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}.ld-spin{animation-duration:3s}.loader,.ld-bar i{transition:none}}

.markcv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#view.marking #gl{cursor:crosshair}
.notebox{width:100%;min-height:54px;resize:vertical;background:var(--bg2,#11161d);color:inherit;border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:6px;font:inherit;font-size:12px;box-sizing:border-box}

</style>
</head>
<body>
<div id="app">
  <section id="stage">
    <header class="bar">
      <div class="brand"><span class="mark" aria-hidden="true"></span><b>Spectral Sky</b><span class="tag">Next · WebGPU · 24-band</span></div>
    </header>
    <div class="tools" id="tools">
      <div class="seg" id="viewSeg" role="group" aria-label="View">
        <button data-v="0" class="on">Panorama</button><button data-v="1">Look around</button><button data-v="2">Luminance</button>
      </div>
      <button class="btn" id="ldBtn" title="Chrome ball, 18% grey ball and colour chart, lit by this sky">Look-dev</button>
      <div class="expo"><label><input type="checkbox" id="autoEx" checked> Auto</label><input type="range" id="exSlider" min="-8" max="8" step="0.1" value="0" aria-label="Exposure"><span class="v" id="exVal">±0.0 EV</span></div>
      <div class="seg" id="resSeg" role="group" aria-label="Preview resolution">
        <button data-r="1024" class="on">1K</button><button data-r="2048">2K</button><button data-r="4096">4K</button>
      </div>
    </div>
    <div class="view" id="view">
      <canvas id="gl"></canvas>
      <canvas id="markCv" class="markcv"></canvas>
      <div class="overlay" id="overlay"></div>
      <div class="loader" id="loader" role="status" aria-live="polite">
        <div class="ld-card"><div class="ld-spin" aria-hidden="true"></div>
          <div class="ld-title" id="ldTitle">Loading Spectral Sky</div>
          <div class="ld-step" id="ldStep">Starting…</div>
          <div class="ld-hint" id="ldHint">Needs a browser with WebGPU (Chrome, Edge, Safari 26 or newer).</div></div></div>
      <div class="legend" id="legend" hidden><span>10⁻⁴</span><i></i><span>10⁹ cd/m²</span></div>
      <div class="status" id="status">Starting…</div>
    </div>
    <footer class="readouts" id="readouts"></footer>
  </section>
  <aside id="panel"></aside>
</div>
<script>
// Spectral Sky Next — shared core: constants, spectral tables, vectors, ephemerides.
// Loaded by both the UI thread and the render worker.
// Units: lengths km, extinction 1/km, spectral irradiance W·m⁻²·nm⁻¹, radiance W·m⁻²·sr⁻¹·nm⁻¹; output CIE XYZ, Y in cd/m².
'use strict';
const NL = 24, NG = 6, DL = 15;
const LAM = Array.from({length:NL}, (_,i) => 387.5 + DL*i);
const f32 = a => new Float32Array(a);
const clamp = (x,a,b) => Math.min(b, Math.max(a, x));
const D2R = Math.PI/180, R2D = 180/Math.PI;

/* ---------- spectral tables ---------- */
function lerpT(t, x){ if (x<=t[0][0]) return t[0][1]; const n=t.length; if (x>=t[n-1][0]) return t[n-1][1];
  for (let i=1;i<n;i++) if (x<=t[i][0]){ const a=t[i-1], b=t[i]; return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0]); } }
const binAvg = (fn,l) => { let s=0; for (let k=-7;k<=7;k++) s+=fn(l+k); return s/15; };
// Extraterrestrial solar spectral irradiance at 1 AU (W m^-2 nm^-1), smoothed ASTM E-490
const SOLAR=[[380,1.10],[390,1.09],[400,1.69],[410,1.70],[420,1.75],[430,1.60],[440,1.83],[450,2.05],[460,2.07],[470,2.03],[480,2.07],[490,1.95],[500,1.95],[510,1.89],[520,1.85],[530,1.92],[540,1.86],[550,1.88],[560,1.83],[570,1.83],[580,1.84],[590,1.77],[600,1.75],[610,1.71],[620,1.66],[630,1.62],[640,1.60],[650,1.53],[660,1.52],[670,1.51],[680,1.47],[690,1.43],[700,1.41],[710,1.38],[720,1.35],[730,1.32],[740,1.28],[750,1.26],[760,1.23]];
// O3 absorption cross-section, 293 K (cm^2) — Chappuis band
const O3XS=[[380,0.2e-23],[400,1.0e-23],[425,6.0e-23],[450,2.7e-22],[475,6.5e-22],[500,1.4e-21],[525,2.5e-21],[550,3.3e-21],[575,4.6e-21],[600,5.1e-21],[625,4.2e-21],[650,2.6e-21],[675,1.4e-21],[700,0.8e-21],[725,0.55e-21],[750,0.4e-21],[780,0.3e-21]];
// CIE 1931 2° colour matching functions (Wyman–Sloan–Shirley multi-lobe fit)
const gl_ = (x,m,s1,s2) => { const t=(x-m)/(x<m?s1:s2); return Math.exp(-0.5*t*t); };
const xbar = l => 1.056*gl_(l,599.8,37.9,31.0)+0.362*gl_(l,442.0,16.0,26.7)-0.065*gl_(l,501.1,20.4,26.2);
const ybar = l => 0.821*gl_(l,568.8,46.9,40.5)+0.286*gl_(l,530.9,16.3,31.1);
const zbar = l => 1.217*gl_(l,437.0,11.8,36.0)+0.681*gl_(l,459.0,26.0,13.8);
const CMFX = LAM.map(l=>binAvg(xbar,l)*DL*683), CMFY = LAM.map(l=>binAvg(ybar,l)*DL*683), CMFZ = LAM.map(l=>binAvg(zbar,l)*DL*683);
const SOLAR_BIN = LAM.map(l=>binAvg(x=>lerpT(SOLAR,x),l));
// Spectral ground reflectance (directional-hemispherical, treated as Lambertian)
const SURFACES = {
  grey:{name:'Neutral (set albedo)', t:null},
  grass:{name:'Green grass', t:[[400,.04],[450,.05],[500,.07],[550,.12],[600,.08],[650,.06],[680,.05],[700,.15],[720,.35],[740,.45]]},
  drygrass:{name:'Dry grass / savanna', t:[[400,.07],[500,.10],[550,.14],[600,.20],[650,.24],[700,.28],[740,.32]]},
  sand:{name:'Desert sand', t:[[400,.15],[450,.20],[500,.27],[550,.33],[600,.39],[650,.43],[700,.46],[740,.48]]},
  soil:{name:'Bare soil', t:[[400,.06],[500,.09],[600,.13],[700,.17],[740,.19]]},
  snow:{name:'Fresh snow', t:[[400,.96],[550,.95],[700,.92],[740,.90]]},
  asphalt:{name:'Asphalt', t:[[400,.05],[740,.09]]},
  concrete:{name:'Concrete', t:[[400,.22],[550,.30],[740,.35]]},
  water:{name:'Water (diffuse approx.)', t:[[400,.08],[550,.05],[740,.03]]},
};
const AEROSOLS = {
  continental:{name:'Continental', alpha:1.3, ssa:()=>0.93, g:0.70, hyg:0.35},
  maritime:{name:'Maritime', alpha:0.45, ssa:()=>0.985, g:0.76, hyg:0.45},
  urban:{name:'Urban / industrial', alpha:1.45, ssa:()=>0.82, g:0.66, hyg:0.30},
  desert:{name:'Desert dust', alpha:0.25, ssa:l=>0.80+0.17*clamp((l-400)/300,0,1), g:0.73, hyg:0.05},
  smoke:{name:'Wildfire smoke', alpha:1.85, ssa:l=>0.86+0.06*clamp((l-400)/300,0,1), g:0.62, hyg:0.15},
  clean:{name:'Clean / polar', alpha:1.4, ssa:()=>0.97, g:0.70, hyg:0.30},
};

.mul(md, -1)), -1, 1));\n  if (P.moonOverride){ phase = Math.acos(clamp(2*P.moonIllum - 1, -1, 1)); const vm = V.mul(md, -1); let e = V.sub(sd, V.mul(vm, V.dot(sd, vm)));\n    if (V.len(e) < 1e-5) e = V.cross(vm, [0, 1, 0]); if (V.len(e) < 1e-5) e = [1, 0, 0]; e = V.norm(e);\n    ml = V.norm(V.add(V.mul(vm, Math.cos(phase)), V.mul(e, Math.sin(phase)))); }\n  const pole = dirAzEl(0, P.lat);\n  const phi = P.lat*D2R, Lr = lst*D2R; const xp = [0, Math.cos(phi), -Math.sin(phi)], eW = [-1, 0, 0], zp = [0, Math.sin(phi), Math.cos(phi)];\n  const eqX = V.add(V.mul(xp, Math.cos(Lr)), V.mul(eW, Math.sin(Lr))), eqY = V.sub(V.mul(xp, Math.sin(Lr)), V.mul(eW, Math.cos(Lr)));\n  // diurnal boundary layer: dawn = shallow, cool, moist stable layer (haze trapped low, radiation mist);\n  // dusk = deep afternoon mixed layer that has lofted dust and pollution to 1.5–2.5 km\n  const low = 1 - smooth(-6, 35, sunEl), east = 0.5 + 0.5*Math.sin(sunAz*D2R);\n  const dawn = P.diurnal ? low*east : 0, dusk = P.diurnal ? low*(1 - east) : 0;\n  const RHp = clamp(P.humidity + 22*dawn - 8*dusk, 0, 97);\n  const earthF = 1/(au*au), altK = Math.exp(-(P.siteAlt || 0)/8);\n  const ae = AEROSOLS[P.aerosol] || AEROSOLS.continental; const RH = RHp/100;\n  const grow = Math.pow((1 - RH)/0.5, -ae.hyg); const alphaE = ae.alpha*(1 - 0.25*clamp((RH - 0.5)/0.47, 0, 1));\n  const aodE = P.aod*grow*(1 - 0.2*dawn + 0.25*dusk), HM = P.aerH*(1 - 0.45*dawn + 0.35*dusk), betaM550 = aodE/HM;\n  const nO3 = P.ozone*2.687e20/15000;\n  const mist = dawn*smooth(72, 96, RHp); const mistS = mist > 0.05 ? 3.912/(40 + (1.5 - 40)*mist) : 0;\n  const userFog = P.fogVis >= 49.5 ? 0 : 3.912/P.fogVis;\n  const fogS = userFog + mistS, fogH = userFog > 0 ? P.fogH : (mistS > 0 ? 0.06 : P.fogH);\n  const surf = SURFACES[P.surface] || SURFACES.grey;\n  const dropF = dropletPhase(11);\n  const sunRad = 0.2666*D2R/au, omegaSun = 2*Math.PI*(1 - Math.cos(sunRad));\n  const moonRad = Math.asin(1737.4/moonDist), omegaMoon = 2*Math.PI*(1 - Math.cos(moonRad));\n  const phaseDeg = phase*R2D, allen = Math.pow(10, -0.4*(0.026*phaseDeg + 4e-9*phaseDeg**4));\n  const meanALS = moonDiskMean(md, ml, pole);\n  const F = new Float32Array(FRAME_OFF._size);\n  // town lights: a mix of high-pressure sodium (the orange of older street lighting: a broadened, self-reversed sodium line with\n  // weaker lines either side) and white LED (a blue emitter under a broad yellow phosphor), normalised to 1 cd/m²\n  const townSpec = (() => { const led = clamp(P.townLED ?? 0.5, 0, 1), g = (l, c, w) => Math.exp(-0.5*((l - c)/w)**2);\n    const s = LAM.map(l => (1 - led)*(1.0*g(l, 595, 9) + 0.8*g(l, 583, 7) + 0.25*g(l, 568, 4) + 0.3*g(l, 616, 5) + 0.12*g(l, 498, 4) + 0.1*g(l, 515, 4) + 0.04)\n                         + led*(0.9*g(l, 452, 10) + 1.0*g(l, 565, 55) + 0.25*g(l, 620, 40)));\n    let Y = 0; for (let i = 0; i < NL; i++) Y += s[i]*CMFY[i]; return s.map(v => v/Y); })();\n  // the towns: placed round the horizon at distances about the setting, each a disc of lit ground (radius km, mean upward\n  // luminance cd/m²: a town centre ~0.5, its suburbs a tenth of that)\n  { const n = P.townsOn ? clamp(Math.round(P.townN ?? 3), 1, 8) : 0, r = rng32((P.townSeed ?? 1)*7907 + 3);\n    for (let k = 0; k < 8; k++){ let v = [0, 0, 0, 0];\n      if (k < n){ const az = r()*2*Math.PI, d = (P.townDist ?? 15)*Math.exp(0.6*(r()*2 - 1)), rad = (0.8 + 3*r()*r())*(P.townSize ?? 1);\n        v = [d*Math.sin(az), d*Math.cos(az), rad, (P.townBright ?? 1)*0.25*(0.5 + r())]; }\n      F.set(v, FRAME_OFF.Town + 4*k); }\n    F.set([n, 0, 0, 0], FRAME_OFF.townO); }\n  const put = (k, i, v) => { F[FRAME_OFF[k] + i] = v; };\n  for (let i = 0; i < NL; i++){ const l = LAM[i];\n    const ext = betaM550*Math.pow(l/550, -alphaE); const ssa = 1 - (1 - ae.ssa(l))/Math.pow(grow, 0.7);\n    put('BR', i, BETA_R[i]*altK); put('BMs', i, ext*ssa); put('BMa', i, ext*(1 - ssa)); put('BO', i, nO3*lerpT(O3XS, l)*1e-4*1000);\n    put('Alb', i, surf.t ? lerpT(surf.t, l) : P.a t atmKey = [aodE, HM, alphaE, fogS, fogH, P.aerosol, P.ozone, P.surface, P.albedo, RH, P.siteAlt || 0].map(v => typeof v === 'number' ? v.toPrecision(5) : v).join('|');\n  const i550 = 11, h = P.camH, b550 = BETA_R[i550]*altK*Math.exp(-h/8) + (F[FRAME_OFF.BMs + i550] + F[FRAME_OFF.BMa + i550])*Math.exp(-h/HM) + fogS*Math.exp(-h/fogH);\n  const derived = {sunAz, sunEl, moonAz, moonEl, vis:3.912/b550, aodE, illum:(1 + Math.cos(phase))/2, phaseDeg, RHp, dawn, dusk, mistVis:mistS ? 3.912/mistS : 0};\n  return {frame:F, atmKey, derived};\n}\n\n// Spectral Sky Next — cloud layers: from the settings to what the GPU builds the cloud volume from.\n// Every cloud type is its own layer with its own controls; they are all built into one 3D volume and lit the same way.\n'use strict';\n\n// ---------- small deterministic random numbers (same clouds on every machine) ----------\nfunction rng32(seed){ let h = (Math.imul(seed | 0, 2654435761) ^ 0x9e3779b9) >>> 0;\n  return () => { h = (h + 0x6d2b79f5) >>> 0; let z = h; z = Math.imul(z ^ (z >>> 15), z | 1); z ^= z + Math.imul(z ^ (z >>> 7), z | 61); return ((z ^ (z >>> 14)) >>> 0)/4294967296; }; }\nconst gaussR = r => Math.sqrt(-2*Math.log(Math.max(r(), 1e-12)))*Math.cos(2*Math.PI*r());\n// smooth value noise in 2D (for the mesoscale moisture that groups clouds), deterministic\nfunction vnoise2(x, y, seed){ const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;\n  const h = (i, j) => { let z = (Math.imul(i, 374761393) + Math.imul(j, 668265263) + Math.imul(seed, 1442695041)) | 0; z = Math.imul(z ^ (z >>> 13), 1274126177); return (((z ^ (z >>> 16)) >>> 0)/4294967296)*2 - 1; };\n  const u = fx*fx*(3 - 2*fx), v = fy*fy*(3 - 2*fy);\n  return (h(xi, yi)*(1 - u) + h(xi + 1, yi)*u)*(1 - v) + (h(xi, yi + 1)*(1 - u) + h(xi + 1, yi + 1)*u)*v; }\nfunction fbm2(x, y, seed, oct){ let s = 0, a = 0.5, n = 0; for (let i = 0; i < oct; i++){ s += a*vnoise2(x, y, seed + 17*i); n += a; x *= 2.03; y *= 2.03; a *= 0.5; } return s/n; }\n\n/ (> 0.5) or less (< 0.5), by direction from the camera\\n\\n// painted cloud at p: the paint over the panorama (upper half: azimuth across, zenith to horizon down) at the direction of p\\n// from the camera, −1 (clear it) … 1 (more cloud); every cloud field is raised or lowered by it there, so painting changes\\n// where the clouds form, not what they are made of\\nfn paintBias(p: vec3f) -> f32 {\\n  if (LY.pnt.x < 0.5) { return 0.0; }\\n  let el = atan2(p.y, max(length(p.xz), 1e-3)); let az = atan2(p.x, p.z) - LY.pnt.z;\\n  let uv = vec2f(fract(az/6.2831853 + 0.5), clamp(1.0 - el/1.5707963, 0.0, 1.0));\\n  return (textureSampleLevel(paintTex, clampSamp, uv, 0.0).r - 0.5)*2.0*LY.pnt.y;\\n}\\n\\n// the layered (field) cloud types. x cover, y base km, z thickness km, w form; second: x cell size km, y seed, z extinction /km,\\n// w wind direction (rad); thr: the coverage threshold of each layer, found so its cover matches the setting\\n// cumulus field: cu x cover, y base km, z depth of the convection km, w development; cu2 x field scale km, y seed, z extinction\\n// factor, w map margin km; cu3 x grouping, y streets, z roll spacing km, w the field's strong-core value; cu4 x shear (km per km\\n// of height), y size code of the surface detail, z clearing over the camera (0 off … 1), w its radius km\\n// cu5: x showers (rain under the strong cores, 0…1), y how far rain falls before it has evaporated km, z anvils (0…1), w anvil\\n// length downwind km\\n// pnt: painted cloud — x on, y strength, z the view's azimuth offset (rad); drift: xy how far the clouds have moved with the\\n// wind (km; timelapses)\\nstruct Layers { sc: vec4f, sc2: vec4f, ac: vec4f, ac2: vec4f, ci: vec4f, ci2: vec4f, wind: vec4f, thr: vec4f, cu: vec4f, cu2: vec4f, cu3: vec4f, cu4: vec4f, cu5: vec4f, pnt: vec4f, drift: vec4f }\\n\\n// (levelE comes from cloudu.wgsl)\\nconst GRID: f32 = 2.0; const DOMAIN: f32 = 512.0; const NC: u32 = 256u;\\n\\nfn smax(a: f32, b: f32, k: f32) -> f32 { let h = clamp(0.5 + 0.5*(b - a)/k, 0.0, 1.0); return mix(a, b, h) + k*h*(1.0 - h); }\\n\\n// one cumulus: turrets (bubbles of rising air) stacked over a flat base, leaning downwind with the shear.\\n// returns (signed distance km, height within the cloud 0…1); distance < -0.5 when far outside\\nfn cuEval(p: vec3f, k: u32) -> vec2f {\\n  let a = cuRec[3u*k]; let b = cuRec[3u*k + 1u];\\n  let base = a.w; let H = b.x; let R = a.z; let y = p.y - base;\\n  if (y < -0.4 || y > H*1.35 + 0.1) { return vec2f(-1.0, 0.0); }\\n  let c2 = cuRec[3u*k + 2u]; let el = max(c2.z, 1.0);\\n  var q0 = p.xz - a.xy - b.zw*max(y, 0.0);\\n  if (dot(q0, q0) > (R*1.45*el + 0.3)*(R*1.45*el + 0.3)) { return vec2f(-1.0, 0.0); }\\n  let seed = u32(b.y); let dev = c2.y;\\n  // into the cloud's own frame: stretched along its long axis, outline made irregular by a gentle warp\\n  let ca = cos(c2.w); let sa = sin(c2.w); q0 = vec2f(ca*q0.x + sa*q0.y, -sa*q0.x + ca*q0.y); q0.x /= el;\\n  let hw = hash3(vec3u(seed, 91u, 3u));\\n  let wq = q0/R;\\n  q0 += R*0.3*vec2f(sin(wq.y*2.3 + 6.28*hw.x) + 0.5*sin(wq.x*4.1 + wq.y*1.7 + 6.28*hw.y), sin(wq.x*2.1 + 6.28*hw.z) + 0.5*sin(wq.y*3.7 - wq.x*1.3 + 6.28*hw.x));\\n  // a smooth ~1.3 km warp of space that changes with height: towers and sides wander and bulge (cauliflower outlines) while the\\n  // cloud stays one connected mass, rather than being a straight extrusion of its footprint\\n  let hy = clamp(y/max(H, 0.05), 0.0, 1.2);\\n  q0 += (vec2f(nz(vec3f(p.x/1.3, p.y*0.9, p.z/1.3) + vec3f(0.6, 0.2, 0.9)), nz(vec3f(p.x/1.3, p.y*0.9, p.z/1.3) + vec3f(0.17, 0.71, 0.37))) - 0.5)*min(R, 1.2)*(0.25 + 0.5*hy);\\n  // body: a half-ellipsoid on the base (R across, H up); turrets: bubbles of rising air bulging from its upper surface,\\n  // smaller and more numerous on tall clouds (cauliflower), a few broad lumps on flat fair-weather ones\\n  let tall = clamp(H/(2.0*R), 0.0, 3.0);\\n  // (sides near vertical, top domed: h(r) = H·√(1 − (r/R)^2.5))\\n  // (continuous across the rim: a jump in the distance field would show as straight voxel-aligned edges)\\n  let rr = length(q0)/R; let ht = H*sqrt(max(1.0 - pow(min(rr, 1.0), 2.5), 0.0));\\n  var d = min((1.0 - rr)*R*0.8, (ht - y)*0.8);\\n  let nb = 9u + u32(6.0*clamp(tall, 0.0, 1.0)) + u32(5.0*dev);\\n  for (var i = 0u; i < nb; i++) {\\n    let h = hash3(vec3u(seed, i, 7u)); let h2 = hash3(vec3u(seed, i, 19u));\\n    // a point on the upper surface of the body: azimuth, and elevation weighted toward the top\\n    let az = 6.2831853*h.x; let el = mix(0.25, 1.45, pow(h.y, 0.7));\\n    let dir = vec3f(cos(az)*cos(el), sin(el), sin(az)*cos(el));\\n    let rb = min(R, H*1.3)*(0.2 + 0.24*h2.x)*(1.0 - 0.25*sin(el));\\n    // on the dome, but not bulging out past the base: a cloud is widest at or near its base\\n    let cr = min(cos(el)*(0.55 + 0.4*h.z), max(1.0 - 1.1*rb/R, 0.0)); let ch = H*sqrt(max(1.0 - pow(cr, 2.5), 0.0));\\n    let c = vec3f(cos(az)*cr*R, max(ch*(0.82 + 0.1*h2.z), rb*0.7), sin(az)*cr*R);\\n    let e = (vec3f(q0.x, y, q0.y) - c)/vec3f(rb, rb*(0.85 + 0.3*h2.y), rb);\\n    d = smax(d, (1.0 - length(e))*rb, 0.02 + 0.03*rb);\\n  }\\n  // the flat base (the condensation level), gently uneven\\n  let bn = (hash3(vec3u(u32(floor(q0.x*4.0) + 4096.0), u32(floor(q0.y*4.0) + 4096.0), seed)).x - 0.5)*0.0;\\n  d = min(d, y + bn);\\n  return vec2f(d, clamp(base/8.0, 0.0, 1.0));   // (this cloud's base altitude, for the extinction profile with height above it)\\n}\\n\\n// ---------- noise for the layer fields: the tileable noise volume read at incommensurate scales (nothing repeats) ----------\\nfn nz(p: vec3f) -> f32 { return textureSampleLevel(noiseTex, wrapSamp, p, 0.0).a; }\\nfn nzb(p: vec3f) -> f32 { return textureSampleLevel(noiseTex, wrapSamp, p, 0.0).r; }\\nfn n2(xz: vec2f, km: f32, s: f32) -> f32 { return nz(vec3f(xz.x/km, s, xz.y/km)); }\\nfn fbm2s(xz: vec2f, km: f32, s: f32) -> f32 { return 0.6*n2(xz, km, s) + 0.4*n2(xz, km*0.377, s + 0.31); }\\n// cellular noise in 2D: (distance to nearest cell point, to second nearest)\\nfn worley2(p: vec2f, seed: u32) -> vec2f {\\n  let i = floor(p); let f = p - i; var d1 = 9.0; var d2 = 9.0;\\n  for (var y = -1; y <= 1; y++) { for (var x = -1; x <= 1; x++) {\\n    let o = vec2f(f32(x), f32(y)); let c = vec2u(vec2i(i + o) + vec2i(65536));\\n    let r = o + hash3(vec3u(c, seed)).xy - f; let d = dot(r, r);\\n    if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) { d2 = d; } } }\\n  return sqrt(vec2f(d1, d2));\\n}\\nfn rot(xz: vec2f, a: f32) -> vec2f { let c = cos(a); let s = sin(a); return vec2f(c*xz.x + s*xz.y, -s*xz.x + c*xz.y); }\\n\\n// ---------- stratocumulus / stratus: a deck of convective cells. Closed cells: cloud fills them, thin gaps between;\\n// open cells: cloud on the rims; stratus: a featureless sheet. Returns (coverage field, how central in its cell)\\nfn scField(xz: vec2f) -> vec2f {\\n  let cs = LY.sc2.x; let seed = u32(LY.sc2.y); let form = LY.sc.w;\\n  let w = vec2f(n2(xz, cs*3.1, 0.13) - 0.5, n2(xz, cs*3.1, 0.57) - 0.5)*cs*1.1;\\n  let q = rot(xz + w, LY.sc2.w)/vec2f(cs*1.35, cs);           // (a little stretched along the wind)\\n  // cells of uneven size: the pattern drifts between larger and smaller cells from place to place, rather than one size\\n  // tiled evenly over the whole sky\\n  let fA = worley2(q, seed); let fB = worley2(q*1.7 + vec2f(17.3, 5.1), seed + 31u);\\n  let mixB = smoothstep(0.35, 0.65, n2(xz, 21.0, 0.44));\\n  let edge = mix(fA.y - fA.x, (fB.y - fB.x)*0.85, mixB);\\n  let closed = smoothstep(0.02, 0.4, edge);\\n  // open cells: the cloud sits on the rims as chains of lumps (the rims' convective cells), not as thin continuous rings\\n  let clump = 1.0 - smoothstep(0.1, 0.65, worley2(q*2.9 + vec2f(3.7, 9.1), seed + 7u).x);\\n  let open = (1.0 - smoothstep(0.0, 0.42, edge))*(0.45 + 0.55*clump);\\n  let cell = mix(mix(1.0, closed, smoothstep(0.0, 0.45, form)), open, smoothstep(0.55, 1.0, form));\\n  let det = fbm2s(xz, cs*0.45, 0.71);\\n  // grouping: thicker, more continuous areas and broken or clear ones (10–40 km), so the deck is not the same everywhere\\n  let meso = n2(xz, 38.0, 0.91) - 0.5 + 0.6*(n2(xz, 13.7, 0.29) - 0.5);\\n  return vec2f(0.7*cell + 0.3*det + 0.6*meso, cell);\\n}\\n// ---------- altocumulus / altostratus: a sheet of cloudlets in rows across the wind (billows of the shear), in patches;\\n// altostratus: a thick grey veil with soft undulations. Returns (coverage field, lump height)\\nfn acField(xz: vec2f) -> vec2f {\\n  let cs = LY.ac2.x; let seed = u32(LY.ac2.y); let form = LY.ac.w;\\n  let w = vec2f(n2(xz, cs*4.3, 0.21) - 0.5, n2(xz, cs*4.3, 0.63) - 0.5)*cs*1.6;\\n  let q = rot(xz + w, LY.ac2.w)/vec2f(cs*0.8, cs*1.25);       // rows lie across the wind\\n  let f = worley2(q, seed + 5u);\\n  let lump = 1.0 - smoothstep(0.05, 0.75, f.x);\\n  let wave = 0.5 + 0.5*sin(6.2831853*q.x*0.9 + 4.0*n2(xz, cs*6.0, 0.37));\\n  let veil = 0.75 + 0.25*fbm2s(xz, 6.0, 0.45);\\n  // (altocumulus comes in patches and sheets with clear sky between, at 20–60 km scales, not evenly over the whole sky)\\n  let meso = fbm2s(xz, 22.0, 0.83) - 0.5 + 0.8*(n2(xz, 13.0, 0.27) - 0.5);\\n  // (within a patch the cloudlets merge; toward its edges they shrink apart, with blue between, rather than the patch ending in\\n  // one hard outline)\\n  let c = mix(veil, 0.8*lump + 0.2*wave, form) + mix(1.0, 0.5, form)*meso;\\n  return vec2f(c, mix(veil, lump, form));\\n}\\n// ---------- cirrus: ice from generating cells high up, trailing fall streaks that hang back and curve as they sink into\\n// slower air (mares' tails); cirrostratus: a thin even veil; cirrocumulus: tiny ripples. (coverage field, fibre strength)\\nfn ciField(xz: vec2f) -> vec2f {\\n  let cs = LY.ci2.x; let seed = u32(LY.ci2.y); let form = LY.ci.w;\\n  let q = rot(xz, LY.ci2.w);\\n  let warp = (n2(xz, cs*5.0, 0.17) - 0.5)*cs*2.5 + (nz(RM2*vec3f(xz.x/(cs*17.0), 0.51, xz.y/(cs*13.0))) - 0.5)*cs*6.0;\\n  // fibres along the wind (sampled through slanted rotations of the noise volume: no repeating comb of parallel strands)\\n  let fib = nz(RM1*vec3f(q.x/(cs*9.0), 0.33, (q.y + warp)/(cs*0.55)));\\n  let fib2 = nz(RM2*vec3f(q.x/(cs*3.0), 0.77, (q.y + warp*0.6)/(cs*0.21)));\\n  let heads = 1.0 - smoothstep(0.1, 0.6, worley2(q/vec2f(cs*4.0, cs*1.2), seed + 9u).x);\\n  let veil = 0.8 + 0.2*fbm2s(xz, 9.0, 0.53);\\n  let cc = 1.0 - smoothstep(0.1, 0.7, worley2(q/(cs*0.12), seed + 13u).x);       // cirrocumulus grains\\n  let streak = 0.55*fib + 0.3*fib2 + 0.15*heads;\\n  var c = mix(veil, streak, smoothstep(0.0, 0.5, form));\\n  c = mix(c, 0.5*cc + 0.5*fib, smoothstep(0.6, 1.0, form));\\n  let meso = fbm2s(xz, 30.0, 0.29) - 0.5;\\n  return vec2f(c + 0.6*meso, fib);\\n}\\n\\n\\n// ---------- cumulus as one continuous field (the way real cumulus fields and good procedural skies work): where the boundary\\n// layer's thermals are strong enough, cloud forms. A non-repeating, domain-warped fBm stands for the strength of the\\n// convection; the cover sets the threshold (a measured quantile), and how far a place is above it sets how deep the cloud\\n// grows there. So the edges of every cloud are shallow and wispy, clouds merge into irregular complexes, sizes follow a\\n// power law by themselves, and towers rise only out of the strongest cores, inside the groups rather than alone in clear sky.\\n// gradient noise from hashed lattice points (no tiling anywhere in the 512 km domain), about −0.7 … 0.7\\nfn g2h(i: vec2f, s: u32) -> vec2f { let u = vec2u(bitcast<u32>(i32(i.x)), bitcast<u32>(i32(i.y))); let h = hash3(vec3u(u, s)); let a = 6.2831853*h.x; return vec2f(cos(a), sin(a)); }\\nfn gnoise2(p: vec2f, s: u32) -> f32 {\\n  let i = floor(p); let f = p - i; let u = f*f*f*(f*(f*6.0 - 15.0) + 10.0);\\n  let a = dot(g2h(i, s), f); let b = dot(g2h(i + vec2f(1.0, 0.0), s), f - vec2f(1.0, 0.0));\\n  let c = dot(g2h(i + vec2f(0.0, 1.0), s), f - vec2f(0.0, 1.0)); let d = dot(g2h(i + vec2f(1.0, 1.0), s), f - vec2f(1.0, 1.0));\\n  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);\\n}\\nfn cuMeso(xz: vec2f, s: u32) -> f32 { return gnoise2(xz/26.0 + vec2f(3.1, 7.7), s + 40u) + 0.5*gnoise2(xz/11.3 + vec2f(1.9, 4.3), s + 41u); }\\n// returns (the field, its broad part: the first two octaves and the grouping, i.e. the strength of the thermal a cloud sits on)\\nfn cuField(xz: vec2f) -> vec2f {\\n  let L = LY.cu2.x; let s = u32(LY.cu2.y)*97u + 11u;\\n  var p = xz/L;\\n  // two warps: the big one bends the groups into irregular, merging complexes; the smaller one makes outlines wander\\n  p += 0.65*vec2f(gnoise2(p*0.31 + vec2f(5.2, 1.3), s + 1u), gnoise2(p*0.31 + vec2f(1.7, 9.2), s + 2u));\\n  p += 0.3*vec2f(gnoise2(p*1.13 + vec2f(2.9, 6.1), s + 3u), gnoise2(p*1.13 + vec2f(8.3, 0.7), s + 4u));\\n  // fBm: each octave turned and scaled by an irrational step, so no direction or size is preferred and nothing repeats; the\\n  // fine octaves strong enough that outlines are fractal (lobed and notched at every scale, as measured cumulus perimeters are)\\n  var f = 0.0; var a = 1.0; var na = 0.0; var q = p;\\n  var fl = 0.0;\\n  for (var i = 0u; i < 6u; i++) { f += a*gnoise2(q, s + 10u + i); na += a; q = rot(q, 0.6435)*2.137 + vec2f(3.17, 7.93); a *= 0.58; if (i == 1u) { fl = f; } }\\n  f /= na; fl /= na;\\n  var o = 0.0;\\n  // grouping: mesoscale moisture (20–50 km; it shifts how many clouds form, a little, without fusing them into one mass), with\\n  // the camera's own neighbourhood kept average (the cover setting describes the\\n  // sky you are under); streets: rolls lined up with the wind, ~2–3 boundary-layer depths apart, wandering\\n  let org = LY.cu3.x;\\n  if (org > 0.0) { o += 0.2*org*(cuMeso(xz, s) - cuMeso(vec2f(0.0), s)*exp(-dot(xz, xz)/1800.0)); }\\n  if (LY.cu3.y > 0.0) { let c = dot(xz, vec2f(-LY.wind.y, LY.wind.x));\\n    o += 0.1*LY.cu3.y*cos(6.2831853*c/LY.cu3.z + 2.2*gnoise2(xz/9.0, s + 50u)); }\\n  return vec2f(f + o, fl + o);\\n}\\n// the map of the field for level l (its texels span the level plus a margin for the lean and wander of the towers)\\nfn cuMapHW(l: u32) -> f32 { return 0.5*levelE(l) + LY.cu2.w; }\\nconst CUMAP: f32 = 640.0;\\n// (xz in the field's own coordinates, which drift with the wind; the maps stay centred on the camera)\\nfn cuMapF(xz: vec2f, l: u32) -> vec2f { let uv = (xz + LY.drift.xy)/(2.0*cuMapHW(l)) + 0.5; return textureSampleLevel(cuMap, clampSamp, uv, i32(l), 0.0).rg; }\\n@compute @workgroup_size(8, 8, 1)\\nfn cuMapMain(@builtin(global_invocation_id) id: vec3u) {\\n  if (f32(id.x) >= CUMAP || f32(id.y) >= CUMAP) { return; }\\n  let hw = cuMapHW(GP.x); let xz = ((vec2f(id.xy) + 0.5)/CUMAP*2.0 - 1.0)*hw;\\n  textureStore(cuMapOut, vec2u(id.xy), GP.x, vec4f(cuField(xz - LY.drift.xy), 0.0, 0.0));\\n}\\n// the cloud at p from the field: a flat base at the condensation level; above it the cloud reaches a height that grows with\\n// the field's excess over the threshold: steep-sided at its margin (the edge of an updraft), deeper toward strong cores, up to\\n// the top of the convection. Columns lean downwind with the shear and wander with height.\\n// Returns (signed distance km, excess, size: 0 a fragment off a weak thermal … 1 part of a big one)\\nfn cuFieldEval(p: vec3f, l: u32) -> vec3f {\\n  let base = LY.cu.y; let Hm = LY.cu.z; let y0 = p.y - base;\\n  if (y0 < -0.45 || y0 > Hm + 0.35) { return vec3f(-1.0, 0.0, 0.0); }\\n  let L = LY.cu2.x; let hy = clamp(y0/max(Hm, 0.3), 0.0, 1.0);\\n  var xz = p.xz - LY.wind.xy*LY.cu4.x*max(y0, 0.0);\\n  let wq = vec3f(xz.x/(1.37*L), p.y/(0.83*L), xz.y/(1.37*L));\\n  xz += (vec2f(nz(wq + vec3f(0.61, 0.23, 0.87)), nz(wq + vec3f(0.17, 0.71, 0.37))) - 0.5)*L*(0.12 + 0.3*hy);\\n  // (and a finer, faster-changing wander: the sides bulge and tuck in every couple of hundred metres of height, so no part of\\n  // a cloud is a straight vertical extrusion of its outline — seen from below, extruded columns read as streaks radiating\\n  // from overhead)\\n  let wq2 = RM1*vec3f(xz.x/(0.47*L), p.y/(0.21*L), xz.y/(0.47*L));\\n  xz += (vec2f(nz(wq2 + vec3f(0.33, 0.91, 0.12)), nz(wq2 + vec3f(0.78, 0.05, 0.64))) - 0.5)*L*(0.07 + 0.08*hy);\\n  // (the slope over ~a tenth of the field scale, not one texel: the finest octaves make the local slope steep and noisy, and\\n  // dividing by it put wide stretches of clear air just \\\"outside\\\" a surface, where the surface detail then grew a haze)\\n  let hw = cuMapHW(l); let h = max(2.0*hw/CUMAP, 0.1*L);\\n  let M = cuMapF(xz, l); let F = M.x;\\n  var g = vec2f(cuMapF(xz + vec2f(h, 0.0), l).x - cuMapF(xz - vec2f(h, 0.0), l).x, cuMapF(xz + vec2f(0.0, h), l).x - cuMapF(xz - vec2f(0.0, h), l).x)/(2.0*h);\\n  let thr = LY.thr.w; let sp = max(LY.cu3.w - thr, 1e-3);\\n  // (an optional clearing over the camera: the field lowered in a soft disc around the zenith, so a panorama is not filled by\\n  // one cloud overhead; off by default)\\n  var Fc = F;\\n  let xl = xz + LY.drift.xy;   // (where this is relative to the camera)\\n  if (LY.cu4.z > 0.0) { let R = LY.cu4.w; let G = 1.5*LY.cu4.z*sp*exp(-dot(xl, xl)/(2.0*R*R)); Fc -= G; g += G*xl/(R*R); }\\n  Fc += 1.3*sp*paintBias(p + vec3f(LY.drift.x, 0.0, LY.drift.y));\\n  let e = (Fc - thr)/sp;\\n  // how big a thermal this cloud sits on: from the broad part of the field. Clouds made only by its fine octaves are\\n  // fragments (small, shallow, diluted); those on a broad strong thermal are deep, with walls\\n  let sf = smoothstep(-0.2, 0.25, (M.y - thr)/sp);\\n  // column depth: a steep wall at the margin (the edge of an updraft: a cumulus is about as deep at its edge as a little way\\n  // in, not a thin skirt), up to a share of the convection's depth, then domed higher toward the strong cores, steeply so with\\n  // development: fair-weather fields are many flat-based mounds of similar depth, deep convection a few towers in its cores\\n  let eS = 0.04; let k = mix(0.5, 1.7, LY.cu.w); let wall = mix(0.4, 0.12, LY.cu.w)*mix(0.3, 1.0, sf);\\n  // the base: level (the condensation level), undulating a few tens of metres, and curving up into the sides over the outer\\n  // part of the cloud (seen from below, a dark flat middle and rounded, lighter margins rather than a cut-off sheet)\\n  let bn = (nz(vec3f(p.x/0.43, 0.29, p.z/0.43)) - 0.5)*0.05 + (nz(vec3f(p.x/0.13, 0.67, p.z/0.13)) - 0.5)*0.02;\\n  let y = y0 - bn - 0.18*Hm*wall*(1.0 - smoothstep(0.0, 5.0*eS, max(e, 0.0)));\\n  // (outside the footprint: the horizontal distance to its edge, but above the height its wall reaches, at least a share of\\n  // the height above that: a plain extrusion of the footprint's edge put \\\"near the surface\\\" curtains of clear air up to the\\n  // top of the convection, which the surface detail then filled with a haze)\\n  if (e <= 0.0) { let Tw = Hm*wall; return vec3f(min(min((Fc - thr)/max(length(g), 0.02), -0.35*(y - Tw)), y), e, sf); }\\n  let em = min(e, 1.0); let edge = sqrt(min(e/eS, 1.0)); let pk = pow(max(em, 1e-4), k); let core = wall + (1.0 - wall)*pk;\\n  // (turrets and dips: the column's depth varies by ±20% over a few hundred metres, so the cloud above a base is not uniformly\\n  // thick and the base seen from below shades into darker and lighter patches)\\n  let tn = nz(RM2*vec3f(xz.x/(0.55*L), 0.37, xz.y/(0.55*L)));\\n  let T = Hm*edge*core*(0.8 + 0.4*tn);\\n  let dT = (0.8 + 0.4*tn)*Hm*(select(0.0, 0.5*edge/max(e, 1e-4), e < eS)*core + select(0.0, edge*(1.0 - wall)*k*pk/max(em, 1e-4), e < 1.0));\\n  let gT = min(dT/sp*length(g), 60.0);\\n  // (the distance to the local tangent plane; above the cloud, at least a share of the height above it, for the same reason)\\n  return vec3f(min(y, select((T - y)/sqrt(1.0 + gT*gT), min((T - y)/sqrt(1.0 + gT*gT), -0.35*(y - T)), y > T)), e, sf);\\n}\\n\\n// ---------- what falls out of and spreads from the convection ----------\\n// The strength of the broad thermal at xz (the field's first octaves: showers and anvils come from whole cores, not lumps)\\nfn cuBroad(xz: vec2f, l: u32) -> f32 { let thr = LY.thr.w; let sp = max(LY.cu3.w - thr, 1e-3); return (cuMapF(xz, l).y - thr)/sp; }\\n// Showers: under the strongest cores, once the cloud is deep enough to rain (congestus onward), rain falls from just under the\\n// base in curtains ~2–5 km across, drifting downwind as it falls. In dry air it evaporates on the way down (virga: streaks\\n// that end in mid-air); in moist air it reaches the ground. Rain is a thin medium (extinction ~0.5–3 /km), not cloud.\\n// Returns (signed distance km, extinction /km)\\nfn cuRainEval(p: vec3f, l: u32) -> vec2f {\\n  let base = LY.cu.y; let fall = base - p.y;                       // how far below the base\\n  if (fall < 0.08 || p.y < -0.05) { return vec2f(-1.0, 0.0); }\\n  let xz = p.xz - LY.wind.xy*0.25*fall + (vec2f(nz(vec3f(p.x/3.1, p.y/1.7, p.z/3.1)), nz(vec3f(p.x/3.1 + 0.4, p.y/1.7, p.z/3.1 + 0.7))) - 0.5)*0.6;\\n  let eR = mix(0.55, 0.3, LY.cu.w);                                // (only strong cores rain, more of them in deep convection)\\n  let b = cuBroad(xz, l) - eR;\\n  let dh = b*1.6*LY.cu2.x;\\n  // evaporation: the shaft thins and ends where the rain has evaporated (virga) or carries on to the ground\\n  let Lf = LY.cu5.y; let left = 1.0 - smoothstep(0.55*Lf, Lf, fall);\\n  let d = min(min(dh, fall - 0.08), select(p.y + 0.05, Lf - fall, Lf < base));\\n  let s = LY.cu5.x*(0.4 + 1.6*LY.cu.w)*smoothstep(0.0, 0.25, b)*mix(0.35, 1.0, left)*smoothstep(0.08, 0.3, fall);\\n  return vec2f(d, s);\\n}\\n// Anvils: where deep convection reaches the tropopause its updraft spreads out sideways as a thick ice sheet, carried downwind\\n// by the upper winds for tens of km, thinning and sinking a little as it goes; flat on top. From the strong cores upwind.\\n// Returns (signed distance km, extinction /km, height fraction in the sheet)\\nfn cuAnvilEval(p: vec3f, l: u32) -> vec3f {\\n  let top = LY.cu.y + LY.cu.z; let La = LY.cu5.w; let Ha = 0.6 + 1.6*LY.cu5.z;\\n  if (p.y > top + 0.2 || p.y < top - Ha - 0.6) { return vec3f(-1.0, 0.0, 0.0); }\\n  // (the core this air came from: upwind, at increasing distances, closely enough spaced that a core's anvil is one continuous\\n  // plume, not a row of copies of the core)\\n  var best = -9.0; var sAt = 0.0;\\n  for (var i = 0u; i < 12u; i++) {\\n    let s = f32(i)/11.0;\\n    // (looked up two levels coarser: the cores it came from can lie tens of km upwind, beyond this level's map)\\n    let a = cuBroad(p.xz - LY.wind.xy*s*La, min(l + 2u, 5u)) - 0.55 - 0.35*s;\\n    if (a > best) { best = a; sAt = s; }\\n  }\\n  let a = best + 0.08*(nz(vec3f(p.x/5.3, p.y/2.1, p.z/5.3)) - 0.5);\\n  // (tapering to nothing at its edges, thickest over the cores: not a flat-sided slab)\\n  let th = Ha*smoothstep(-0.02, 0.3, a)*(1.0 - 0.45*sAt);\\n  let tp = top - 0.2*sAt*Ha - 0.3*Ha*(1.0 - smoothstep(-0.02, 0.2, a));   // (sinking a little downwind and at its edges)\\n  let bot = tp - th;\\n  let d = min(min(a*1.2*LY.cu2.x, p.y - bot), tp - p.y);\\n  // (thin and fibrous toward its edges and far downwind, dense over the cores)\\n  let sig = 7.0*LY.cu5.z*smoothstep(-0.02, 0.35, a)*(1.0 - 0.7*sAt);\\n  return vec3f(d, sig, clamp((p.y - bot)/max(tp - bot, 0.1), 0.0, 1.0));\\n}\\n\\nstruct Hit { d: f32, sig: f32, v: f32, r: f32 }\\nfn evalAt(p0: vec3f) -> Hit {\\n  // (the clouds' own coordinates: drifted with the wind)\\n  let p = p0 - vec3f(LY.drift.x, 0.0, LY.drift.y);\\n  var best = Hit(-1.0, 0.0, 0.0, 0.0);\\n  // the layers (alpha codes the style for the renderer: < 0.5 cumulus by size, 0.5–0.62 lumpy water layers by lump size,\\n  // 0.7 smooth water sheets, 0.9 ice)\\n  if (LY.sc.x > 0.0 && p.y > LY.sc.y - 0.35 && p.y < LY.sc.y + 1.4*LY.sc.z + 0.3) {\\n    // cells are domes: thickest in the middle, thinning to their edges (thin bright rims, dark cores seen from below), merging\\n    // into a continuous deck where the cover is high\\n    // (the cell pattern wanders a little with height, so the cells' sides billow instead of being straight extrusions)\\n    let hy = p.y*1.7; let wob = vec2f(n2(p.xz, 0.8, 0.31 + hy) - 0.5, n2(p.xz, 0.8, 0.77 + hy) - 0.5)*0.35;\\n    // (some cells grow thicker and wetter than others: a deck seen from below is a mosaic of darker and lighter cells)\\n    let vth = n2(p.xz, LY.sc2.x*2.3, 0.83);\\n    var f = scField(p.xz + wob); f.x += 0.5*paintBias(p0); let th = LY.sc.z*(0.6 + 0.8*vth); let m = smoothstep(LY.thr.x - 0.03, LY.thr.x + 0.28, f.x);\\n    // (a deck under an inversion: the top nearly flat, ±20–50 m, a little lower at the thin cell rims; the base undulating\\n    // ±50–150 m and rising toward the gaps)\\n    // (cells are pillows: full depth in their middles, thinning to their rims mostly by the base rising, so the deck reads\\n    // as flattened cells packed side by side rather than as separate puffs)\\n    let top = LY.sc.y + th*(0.85 + 0.15*m) + th*0.08*(n2(p.xz, 1.7, 0.41) - 0.5);\\n    let bot = LY.sc.y + th*0.5*(1.0 - m) + 0.2*(n2(p.xz, 4.3, 0.19) - 0.5) + 0.06*(n2(p.xz, 1.1, 0.67) - 0.5);\\n    // (pillow cross-section: the sides bulge at mid-height and curve in to the top and the base)\\n    let hf = clamp((p.y - bot)/max(top - bot, 0.03), 0.0, 1.0);\\n    let dv = min(p.y - bot, top - p.y); let dh = (f.x - LY.thr.x)*LY.sc2.x*0.35 + th*(0.22*sin(3.14159*hf) - 0.1);\\n    let d = min(dv, dh);\\n    // lumpy (cumuliform) except for stratus: the size code drives the renderer's billows in proportion to the deck\\n    // (softer lumps than cumulus: the cells are only 1–2 layer depths across)\\n    let st = select(0.7, 0.5 + 0.12*clamp(LY.sc2.x*0.35/1.2, 0.02, 1.0), LY.sc.w > 0.15);\\n    if (d > best.d) { best = Hit(d, LY.sc2.z*(0.7 + 0.6*vth), clamp(LY.sc.y/8.0, 0.0, 1.0), st); }   // (the deck's nominal base: adiabatic profile above it; a constant, so\\n    // its 8-bit storage cannot draw contours)\\n  }\\n  if (LY.ac.x > 0.0 && p.y > LY.ac.y - 0.3 && p.y < LY.ac.y + LY.ac.z + 0.3) {\\n    var f = acField(p.xz); f.x += 0.5*paintBias(p0); let th = LY.ac.z; let form = LY.ac.w;\\n    let top = LY.ac.y + th*mix(0.85 + 0.15*f.y, 0.35 + 0.65*f.y, form);\\n    let bot = LY.ac.y + th*mix(0.05*(1.0 - f.y), 0.35*(1.0 - f.y), form);\\n    let dv = min(p.y - bot, top - p.y); let dh = (f.x - LY.thr.y)*LY.ac2.x*0.3;\\n    let d = min(dv, dh);\\n    let st = select(0.7, 0.5 + 0.12*clamp(LY.ac2.x*0.45/1.2, 0.02, 1.0), form > 0.3);\\n    if (d > best.d) { best = Hit(d, LY.ac2.z, clamp(LY.ac.y/8.0, 0.0, 1.0), st); }\\n  }\\n  if (LY.ci.x > 0.0 && p.y > LY.ci.y - LY.wind.w - 0.2 && p.y < LY.ci.y + LY.ci.z + 0.2) {\\n    // below the generating level the ice falls in streaks; a streak at depth dz traces back to a head displaced downwind\\n    let topI = LY.ci.y + LY.ci.z; let dz = max(topI - p.y, 0.0);\\n    let back = LY.wind.xy*LY.wind.z*pow(dz, 1.3);\\n    var f = ciField(p.xz + back); f.x += 0.4*paintBias(p0);\\n    let inLayer = 1.0 - smoothstep(LY.ci.z*0.6, LY.ci.z, dz);\\n    let tail = exp(-max(dz - LY.ci.z*0.6, 0.0)/max(LY.wind.w*0.45, 0.05))*smoothstep(0.0, 0.3, LY.ci.w);\\n    let prof = max(inLayer, tail*f.y);\\n    let dv = min(p.y - (LY.ci.y - LY.wind.w*select(0.0, 1.0, LY.ci.w > 0.2)), topI - p.y);\\n    let dh = (f.x*prof - LY.thr.z)*LY.ci2.x*0.25;\\n    let d = min(dv, dh);\\n    if (d > best.d) { best = Hit(d, LY.ci2.z*(0.4 + 0.6*prof), clamp(1.0 - dz/(LY.ci.z + LY.wind.w), 0.0, 1.0), 0.9); }\\n  }\\n  if (LY.cu.x > 0.0) {\\n    let r = cuFieldEval(p, GP.x);\\n    if (r.x > best.d) {\\n      // stage and dilution: some parts of the field are dissolving (thinned by mixing: lower extinction, softer, more eaten\\n      // edges); and a thermal entrains surrounding air at a rate ∝ 1/its size, so small, shallow clouds and the thin margins\\n      // of big ones hold a smaller share of their adiabatic water (mixed fraction ~D/(D + 0.25 km); σ ∝ LWC^(2/3))\\n      // (varying in 3D, not by column: a column-wise pattern seen from below streaks out from overhead)\\n      let sx = p.xz/(3.7*LY.cu2.x);\\n      let st = smoothstep(0.32, 0.58, nz(RM2*vec3f(sx.x, p.y/(1.9*LY.cu2.x), sx.y)) + 0.25*r.y);\\n      // (by the size of the thermal the cloud sits on, not by closeness to its edge: the margins of a big cloud are its mixing\\n      // shell, handled by the renderer, and diluting them too made every outline a translucent smear)\\n      let De = mix(0.12, 1.2, r.z)*(1.0 + LY.cu.w);\\n      let Rcf = LY.cu4.y; let dil = pow(De/(De + 0.25), 0.6667)/pow(Rcf/(Rcf + 0.25), 0.6667);\\n      best = Hit(r.x, LY.cu2.z*mix(0.45, 1.0, st)*min(dil, 1.0), clamp(LY.cu.y/8.0, 0.0, 1.0), 0.5*clamp(Rcf/2.4, 0.0, 1.0));\\n    }\\n    if (LY.cu5.z > 0.0) { let a = cuAnvilEval(p, GP.x); if (a.x > best.d) { best = Hit(a.x, a.y, a.z, 0.9); } }\\n    // (rain: style 0.75; it only counts where nothing else is)\\n    if (LY.cu5.x > 0.0 && best.d < 0.0) { let rr = cuRainEval(p, GP.x); if (rr.x > best.d && rr.y > 0.0) { best = Hit(rr.x, rr.y, 0.0, 0.75); } }\\n  }\\n  if (GP.w > 0u) {\\n    let c = vec2i(floor((p.xz + 0.5*DOMAIN)/GRID));\\n    if (c.x >= 0 && c.y >= 0 && c.x < i32(NC) && c.y < i32(NC)) {\\n      let cell = u32(c.y)*NC + u32(c.x); let s0 = cuStart[cell]; let s1 = cuStart[cell + 1u];\\n      for (var j = s0; j < s1; j++) { let k = cuIdx[j]; let r = cuEval(p, k);\\n        if (r.x > best.d) { best = Hit(r.x, cuRec[3u*k + 2u].x, r.y, 0.5*clamp(cuRec[3u*k].z/2.4, 0.0, 1.0)); } }\\n    }\\n  }\\n  return best;\\n}\\nfn encodeSig(s: f32) -> f32 { return select(clamp(log2(s/0.05)/13.0, 1.0/255.0, 1.0), 0.0, s <= 0.0); }\\n\\n@compute @workgroup_size(4, 4, 4)\\nfn main(@builtin(global_invocation_id) id: vec3u) {\\n  let NX = u32(CU.res.x); let NZ = u32(CU.res.y); let l = GP.x;\\n  if (id.x >= NX || id.y >= NX || id.z >= GP.z) { return; }\\n  let k = GP.y + id.z; if (k >= NZ) { return; }\\n  let E = levelE(l); let vx = E/f32(NX); let alt = sliceToAlt(f32(k) + 0.5, f32(NZ)); let vz = sliceToAlt(f32(k) + 1.0, f32(NZ)) - sliceToAlt(f32(k), f32(NZ));\\n  let p = vec3f((f32(id.x) + 0.5)/f32(NX)*E - 0.5*E, alt, (f32(id.y) + 0.5)/f32(NX)*E - 0.5*E);\\n  var o = vec4f(0.0);\\n  if (f32(l) < CU.vol.w) {\\n    let h = evalAt(p);\\n    if (h.d > -0.5) { o = vec4f(clamp(h.d, -0.5, 0.5) + 0.5, encodeSig(h.sig), h.v, h.r); }\\n  } else {\\n    // coverage: the fraction of 8 points spread through the voxel that are inside a cloud\\n    var cov = 0.0; var sg = 0.0; var vv = 0.0; var st = 0.0;\\n    for (var s = 0u; s < 8u; s++) {\\n      let jt = (vec3f(f32(s & 1u), f32((s >> 1u) & 1u), f32((s >> 2u) & 1u)) - 0.5)*0.5 + (hash3(vec3u(id.x, id.y, k*8u + s)) - 0.5)*0.4;\\n      let h = evalAt(p + jt*vec3f(vx, vz, vx));\\n      // (the fraction of the voxel the renderer's near-field density would fill: the same fine-detail erosion, on average,\\n      // and the same soft ramp for ice, so the cloud field keeps its look across the change from distances to coverage)\\n      var inside = 0.0;\\n      if (h.r > 0.8) { inside = smoothstep(0.0, 0.12, h.d + 0.06); }\\n      else if (h.r < 0.63) {\\n        let Rc = clamp(select((h.r - 0.5)/0.12*1.2, h.r/0.5*2.4, h.r < 0.5), 0.05, 2.4);\\n        let Ae = 0.5*min(0.3*pow(Rc, 0.8), 0.45)*select(1.0, 0.45, h.r >= 0.5);\\n        inside = smoothstep(-0.03, 0.03, h.d - Ae + 0.03);\\n      } else { inside = smoothstep(0.0, 0.035, h.d); }\\n      // (the style is a code, not an amount: never scaled; rain's only where no cloud shares the voxel)\\n      let isRain = h.r > 0.72 && h.r < 0.78;\\n      cov += inside; sg = max(sg, select(h.sig, 0.0, isRain && st > 0.0)); vv += h.v*inside;\\n      if (inside > 0.0) { if (isRain) { if (st == 0.0) { st = h.r; } } else { if (st > 0.72 && st < 0.78) { st = 0.0; sg = h.sig; } st = max(st, h.r); } }\\n    }\\n    // (extinction code, base and style stored premultiplied by the coverage: filtering against empty neighbours then dilutes\\n    // the coverage only, and the renderer divides back; the codes themselves never get blended toward zero)\\n    if (cov > 0.0) { let c = cov/8.0; o = vec4f(c, encodeSig(sg)*c, vv/cov*c, st*c); }\\n  }\\n  textureStore(densOut, vec3u(id.x, id.y, l*NZ + k), o);\\n}\\n\\n// the coverage field of one layer (GP.x: 0 low deck, 1 mid, 2 high, 3 cumulus) on a 256² grid over the central 64 km, for calibration\\n@compute @workgroup_size(8, 8, 1)\\nfn fieldMain(@builtin(global_invocation_id) id: vec3u) {\\n  if (id.x >= 256u || id.y >= 256u) { return; }\\n  let xz = (vec2f(id.xy) + 0.5)/256.0*64.0 - 32.0;\\n  var c = 0.0;\\n  if (GP.x == 0u) { c = scField(xz).x; } else if (GP.x == 1u) { c = acField(xz).x; } else if (GP.x == 2u) { c = ciField(xz).x; } else { c = cuField(xz).x; }\\n  fieldOut[id.y*256u + id.x] = c;\\n}\\n\",\"cloudlight\":\"// ---------- the light volume: optical depth from each point to the sun, the moon, the sky above and the ground below ----------\\n@group(0) @binding(0) var<uniform> F: Frame;\\n@group(0) @binding(1) var<uniform> CU: Cloud;\\n@group(0) @binding(2) var densTex: texture_3d<f32>;\\n@group(0) @binding(3) var noiseTex: texture_3d<f32>;\\n@group(0) @binding(4) var linSamp: sampler;\\n@group(0) @binding(5) var wrapSamp: sampler;\\n@group(0) @binding(6) var lightOut: texture_storage_3d<rgba16float, write>;\\n@group(0) @binding(7) var<uniform> GP: vec4u;   // x level\\n@group(0) @binding(8) var detailTex: texture_3d<f32>;   // (declared for cloudvol.wgsl; the light pass needs no fine detail)\\n\\n// optical depth along a straight line from p (world) toward L, through the cloud band (macro density, no erosion)\\nfn tauToward(p0: vec3f, L: vec3f) -> f32 {\\n  var tau = 0.0; var t = 0.0; let top = CU.band.y + 0.1;\\n  // (all the way out of the band or the domain: a low sun is hidden by cloud banks 100+ km away, and so is everything they\\n  // shadow, the near clouds and the air included; ~30 steps per level reach the edge of the domain even for a grazing sun)\\n  for (var i = 0; i < 288; i++) {\\n    let p = p0 + L*t; let q = volPos(p);\\n    if (q.y > top || q.y < -0.05 || max(abs(q.x), abs(q.z)) > 0.5*levelE(u32(CU.vol.z) - 1u) || tau > 60.0) { break; }\\n    let lb = levelOf(q.xz); let vs = levelE(u32(lb.x))/CU.res.x;   // step about one voxel of the level it is in\\n    let ds = clamp(vs*0.9, 0.04, 4.0);\\n    tau += densMacro(volPos(p0 + L*(t + 0.5*ds)))*ds; t += ds;\\n  }\\n  return tau;\\n}\\nfn tauVertical(q0: vec3f, dir: f32) -> f32 {\\n  var tau = 0.0; let dz = 0.06;\\n  var y = q0.y;\\n  let y1 = select(0.0, CU.band.y + 0.1, dir > 0.0);\\n  let n = min(i32(ceil(abs(y1 - y)/dz)), 160);\\n  let ds = abs(y1 - y)/max(f32(n), 1.0);\\n  for (var i = 0; i < n; i++) { let yy = y + dir*(f32(i) + 0.5)*ds; tau += densMacro(vec3f(q0.x, yy, q0.z))*ds; }\\n  return tau;\\n}\\n\\n@compute @workgroup_size(4, 4, 4)\\nfn main(@builtin(global_invocation_id) id: vec3u) {\\n  let NX = u32(CU.res.z); let NZ = u32(CU.res.w); let l = GP.x;\\n  if (id.x >= NX || id.y >= NX || id.z >= NZ) { return; }\\n  let E = levelE(l);\\n  let q = vec3f((f32(id.x) + 0.5)/f32(NX)*E - 0.5*E, sliceToAlt(f32(id.z) + 0.5, f32(NZ)), (f32(id.y) + 0.5)/f32(NX)*E - 0.5*E);\\n  var o = vec4f(0.0);\\n  if (q.y < CU.band.y + 0.1) {\\n    // world position of the voxel: x/z on the tangent plane, altitude along the local vertical\\n    let up = normalize(vec3f(q.x, Rg, q.z)); let p = C0 + up*(Rg + q.y);\\n    if (F.sunDir.w > 0.5 && F.sunDir.y > -0.2) { o.x = tauToward(p, F.sunDir.xyz); }\\n    if (F.moonDir.w > 0.5) { o.y = tauToward(p, F.moonDir.xyz); }\\n    o.z = tauVertical(q, 1.0);\\n    if (q.y > CU.band.x - 0.3) { o.w = tauVertical(q, -1.0); }\\n  }\\n  textureStore(lightOut, vec3u(id.x, id.y, l*NZ + id.z), o);\\n}\\n\",\"cloudlit\":\"// ---------- cloud light lookups (needs lightTex) ----------\\nfn rawLight(xz: vec2f, alt: f32, l: u32) -> vec4f { return textureSampleLevel(lightTex, linSamp, volUVW(xz, alt, l, CU.res.z, CU.res.w), 0.0); }\\n// optical depths at q: x toward the sun, y toward the moon, z straight up to the cloud tops, w straight down to the ground\\nfn lightAt(q: vec3f) -> vec4f {\\n  if (CU.band.z < 0.5 || q.y > CU.band.y + 0.1) { return vec4f(0.0); }\\n  let lb = levelOf(q.xz); let l = u32(lb.x);\\n  var s = rawLight(q.xz, max(q.y, 0.0), l); if (lb.y > 0.0) { s = mix(s, rawLight(q.xz, max(q.y, 0.0), l + 1u), lb.y); } return s;\\n}\\n\",\"cloudu\":\"// ---------- the cloud volume: lookups shared by the light pass and the renderer ----------\\n// Camera-centred levels (each twice as wide as the last) stacked along z in one 3D texture; all span altitude 0 … ZTOP km.\\n// Near levels (< SDF_LEVELS) store a signed distance to the cloud surface (km, ±0.5) so edges stay sharp below the voxel\\n// size and can be eroded by fine noise; far levels store coverage (the voxel-averaged fraction of cloud), which keeps small\\n// distant clouds' total extinction instead of losing them between voxels.\\n// texel: r distance/coverage, g core extinction (log), b height within the cloud (0 base … 1 top), a cloud style\\nstruct Cloud {\\n  vol: vec4f,    // x E0 (km, width of level 0), y ZTOP, z number of levels, w levels holding distances\\n  res: vec4f,    // x voxels across, y voxels up, z light voxels across, w light voxels up\\n  band: vec4f,   // x lowest cloud base, y highest cloud top (km), z cloud on, w erosion strength\\n  cph: vec4f,    // cloud droplet phase (gHG, gD, alpha, wD)\\n  ms: vec4f,     // x, y how far the clouds have drifted with the wind (km), z unused, w ambient strength\\n  wind: vec4f,   // x/y wind direction (x, z), z ice-fibre length km, w unused\\n}\\n\\nfn levelE(l: u32) -> f32 { return CU.vol.x*exp2(f32(l)); }\\n// the finest level holding p (horizontal), and how far toward the next level's edge it is (0 … 1, for blending)\\nfn levelOf(xz: vec2f) -> vec2f {\\n  let m = max(abs(xz.x), abs(xz.y)); let nl = CU.vol.z;\\n  let l = clamp(ceil(log2(max(m/(0.42*CU.vol.x), 1e-6))), 0.0, nl - 1.0);\\n  let e = 0.42*levelE(u32(l)); let b = clamp((m - 0.85*e)/(0.15*e), 0.0, 1.0);\\n  return vec2f(l, select(b, 0.0, l >= nl - 1.0));\\n}\\n// altitude ↔ slice: the lower 6 km (all but the highest clouds) get three quarters of the slices, the rest the upper 10 km\\nconst ZS: f32 = 6.0; const FZ: f32 = 0.75;\\nfn altToSlice(alt: f32, nz: f32) -> f32 { return select((FZ + (alt - ZS)/(CU.vol.y - ZS)*(1.0 - FZ))*nz, alt/ZS*FZ*nz, alt < ZS); }\\nfn sliceToAlt(z: f32, nz: f32) -> f32 { let f = z/nz; return select(ZS + (f - FZ)/(1.0 - FZ)*(CU.vol.y - ZS), f/FZ*ZS, f < FZ); }\\nfn volUVW(xz: vec2f, alt: f32, l: u32, nxz: f32, nz: f32) -> vec3f {\\n  let E = levelE(l); let u = xz/E + 0.5;\\n  let z = clamp(altToSlice(alt, nz), 0.5, nz - 0.5);\\n  return vec3f(u.x, u.y, (f32(l)*nz + z)/(nz*CU.vol.z));\\n}\\n\",\"cloudvol\":\"// ---------- cloud density lookups (needs densTex, noiseTex, linSamp, wrapSamp) ----------\\nfn rawCloud(xz: vec2f, alt: f32, l: u32) -> vec4f {\\n  let v = textureSampleLevel(densTex, linSamp, volUVW(xz, alt, l, CU.res.x, CU.res.y), 0.0);\\n  if (f32(l) >= CU.vol.w) { let c = max(v.r, 0.02); return vec4f(v.r, min(v.g/c, 1.0), min(v.b/c, 1.0), min(v.a/c, 1.0)); }   // (coverage levels: premultiplied)\\n  return v;\\n}\\nfn sigmaOf(v: vec4f) -> f32 { return select(0.05*exp2(v.g*13.0), 0.0, v.g <= 0.0); }\\nfn profileOf(v: f32) -> f32 { return 0.35 + 0.65*smoothstep(0.0, 0.8, v); }   // layers: denser toward the tops (v: height fraction)\\n// cumulus and water layers: extinction from the height above the cloud's own base (b channel: the base altitude / 8 km; stored\\n// per cloud rather than as a height, so it is constant within each cloud and the profile stays smooth). Liquid water grows adiabatically with\\n// height (~2 g/m³ per km) and is diluted by entrainment (adiabatic fraction falling from ~0.9 near the base to ~0.4 at 2 km);\\n// with a fixed droplet number (~300/cm³, continental) σ ∝ LWC^(2/3): ~25/km 50 m above the base, ~85 at 0.4 km, ~140 at 1 km,\\n// ~190 at 2 km (observed: fair-weather cumulus ~20 → 60–110 → 100+, congestus 50–200); the cloud's own factor (g channel) scales it\\nconst CU_BSCALE: f32 = 8.0;\\nfn cuSigmaZ(z: f32) -> f32 { let zz = max(z, 0.0); return max(85.0*pow(zz/(1.0 + 0.35*zz)/0.351, 0.6667), 10.0); }\\n// (all liquid clouds, cumulus and the water layers alike, from their own base; ice by height fraction)\\n// small cumulus are diluted: a thermal entrains surrounding air at a rate ∝ 1/radius, so the small ones hold a much smaller\\n// share of their adiabatic water (their mixed fraction ~R/(R + 0.25 km)); σ ∝ LWC^(2/3). A lone 200 m cloud ends up ~half as\\n// dense as the core of a big one, a 100 m fragment about a third\\nfn cuDil(a: f32) -> f32 { if (a >= 0.5) { return 1.0; } let R = clamp(a/0.5*2.4, 0.05, 2.4); return pow(R/(R + 0.25), 0.6667); }\\nfn isRain(a: f32) -> bool { return a > 0.72 && a < 0.78; }\\nfn profileV(v: vec4f, alt: f32) -> f32 { if (isRain(v.a)) { return 1.0; } return select(profileOf(v.b), cuSigmaZ(alt - v.b*CU_BSCALE)*cuDil(v.a), v.a < 0.8); }\\n// rain falls in curtains: streaks stretched down the fall, a few hundred metres across, with gaps between\\nfn rainStreak(q0: vec3f) -> f32 {\\n  let q = q0 - vec3f(CU.ms.x, 0.0, CU.ms.y);\\n  let n1 = nzs(RM1*vec3f(q.x/0.53, q.y/3.7, q.z/0.53) + vec3f(0.21, 0.66, 0.42)).a;\\n  let n2 = nzs(RM2*vec3f(q.x/0.17, q.y/1.9, q.z/0.17) + vec3f(0.84, 0.31, 0.15)).a;\\n  return clamp(0.15 + 1.2*smoothstep(0.3, 0.75, 0.65*n1 + 0.35*n2), 0.0, 1.35);\\n}\\n\\n// position in volume coordinates: horizontal x/z, altitude above the curved ground\\n// (gnomonic: the horizontal coordinates are where the point's vertical meets the tangent plane at the camera)\\nfn volPos(p: vec3f) -> vec3f { let d = p - C0; let r = length(d); let k = Rg/max(d.y, 1.0); return vec3f(d.x*k, r - Rg, d.z*k); }\\n\\n// extinction (1/km) without the fine erosion: for the light pass and quick tests\\nfn densMacroL(q: vec3f, l: u32) -> f32 {\\n  let v = rawCloud(q.xz, q.y, l);\\n  if (f32(l) < CU.vol.w) { let d = v.r - 0.5; return sigmaOf(v)*profileV(v, q.y)*smoothstep(-0.02, 0.06, d); }\\n  return sigmaOf(v)*profileV(v, q.y)*v.r;\\n}\\nfn densMacro(q: vec3f) -> f32 {\\n  if (q.y < CU.band.x - 0.3 || q.y > CU.band.y + 0.1) { return 0.0; }\\n  let lb = levelOf(q.xz); let l = u32(lb.x);\\n  var s = densMacroL(q, l); if (lb.y > 0.0) { s = mix(s, densMacroL(q, l + 1u), lb.y); } return s;\\n}\\n// signed distance to the nearest cloud surface (km, level 0–2 only; > 0 inside), for stepping through empty air\\n// how far the fine detail can push a cumulus surface outward (km), from the cloud's size code\\nfn cuPush(a: f32) -> f32 { return select(0.09, 0.15, a < 0.5); }   // (cumulus: down to the ragged fragments under its base)\\n// (the far levels hold coverage, not distances: there an empty voxel lets the ray skip half a voxel, anything else is sampled)\\nfn hintL(q: vec3f, l: u32) -> f32 {\\n  let v = rawCloud(q.xz, q.y, l);\\n  if (f32(l) < CU.vol.w) { return v.r - 0.5 + cuPush(v.a); }\\n  if (v.r <= 0.0) { return -0.5*levelE(l)/CU.res.x; }\\n  return 0.0;\\n}\\nfn distHint(q: vec3f) -> f32 {\\n  if (q.y < CU.band.x - 0.3 || q.y > CU.band.y + 0.1) { return 1e9; }\\n  let lb = levelOf(q.xz); let l = u32(lb.x);\\n  var h = hintL(q, l); if (lb.y > 0.0) { h = max(h, hintL(q, l + 1u)); }\\n  return h;\\n}\\nfn nzs(q: vec3f) -> vec4f { return textureSampleLevel(noiseTex, wrapSamp, q, 0.0); }\\n// how much of the finest detail this sample can show (1 near, fading where a pixel spans more than ~15 m; the sky sets it)\\nvar<private> detailLod: f32 = 1.0;\\n// a smooth random vector field (from the volume's smooth Perlin channel), about −0.5…0.5\\nfn wv(q: vec3f, s: f32, o: vec3f) -> vec3f { return vec3f(nzs(q/s + o).a, nzs(q/s + o + vec3f(0.37, 0.11, 0.53)).a, nzs(q/s + o + vec3f(0.71, 0.59, 0.23)).a) - 0.5; }\\nfn t3D(q: vec3f) -> vec4f { return textureSampleLevel(detailTex, wrapSamp, q, 0.0); }\\nfn remap(v: f32, a: f32, b: f32, c: f32, d: f32) -> f32 { return c + (v - a)/(b - a)*(d - c); }\\n// the billowy shape noise: Perlin–Worley, carved by the cellular fBm (lobes with sharp creases between them)\\nfn pwShape(q: vec3f) -> f32 { let s = nzs(q); return clamp(remap(s.r, s.g*0.6 + s.b*0.4 - 1.0, 1.0, 0.0, 1.0), 0.0, 1.0); }\\n// The cloud's surface, in the way the first tool built it (which read as natural): the macro shape (the volume's signed\\n// distance) is carved into lobes by shape noise at two scales, puffs on puffs, then displaced by a cascade of finer octaves:\\n// cellular billows (rounded, the cauliflower) and curly wisps (shredded). Each finer octave is carried round by the eddies of\\n// the coarser one, so small features curl into each other instead of sitting as separate balls. Where the cloud mixes with\\n// clear air (its sides, its base, small and dissolving clouds) the billows give way to wisps and the margin frays: a band of\\n// partial cloud, notched and fringed. Only the tops of growing towers stay hard: the rising core pushes the surface out faster\\n// than mixing can eat it. Returns (the cloud's field in km, > 0 inside; the edge softness in km; an interior variation 0–1).\\nfn cuSurface(q0: vec3f, d: f32, z: f32, Rc: f32, A: f32, decay: f32, hfac: f32, lay: bool) -> vec3f {\\n  let q = q0 - vec3f(CU.ms.x, 0.0, CU.ms.y);   // (noise in the clouds' own coordinates, drifting with them)\\n  let S = mix(0.45, 1.0, clamp(Rc/1.5, 0.0, 1.0))*select(1.0, 0.7, lay);   // feature scale (km): smaller clouds, smaller lumps\\n  let Hc = 2.0*Rc*mix(0.35, 0.65 + 1.6*CU.wind.w, clamp(Rc/1.5, 0.0, 1.0));\\n  let topCrisp = select(smoothstep(0.45, 0.9, z/max(Hc, 0.05))*(1.0 - decay), 0.0, lay);\\n  let rag = mix(1.0, 0.3, topCrisp)*(1.0 + 0.6*decay);\\n  // the slow swirl: towers and sides wander and bulge, more so higher up\\n  let qw = q + wv(q, 1.3*S, vec3f(0.11, 0.53, 0.29))*vec3f(0.35, 0.15, 0.35)*S*(0.5 + hfac);\\n  let qv = qw*vec3f(1.0, select(0.7, 1.0, lay), 1.0);   // (convective lobes a little taller than wide)\\n  // puffs on puffs: big lobes ~2.6 S, smaller lobes ~0.9 S on them\\n  let B1 = pwShape(qv/(2.6*S) + vec3f(0.37, 0.11, 0.73)); let B2 = pwShape(qv/(0.9*S) + vec3f(0.83, 0.47, 0.19));\\n  let big = B1*(0.35 + 0.8*B2);\\n  var f = d - A*(1.0 - min(big, 1.0)) + 0.04;\\n  let f0 = f;\\n  // the cascade: billows (cellular fBm) and wisps (curly fBm) at 1.2, 0.4 and 0.13 S, the finer ones advected by the coarser\\n  let d1 = t3D(qw/(1.2*S) + vec3f(0.0, 0.29, 0.0));\\n  let d2 = t3D((qw + (d1.gba - 0.5)*0.11*S)/(0.4*S) + vec3f(0.31, 0.53, 0.17));\\n  let d3 = t3D((qw + (d1.rgb - 0.5)*0.05*S + (d2.gba - 0.5)*0.035*S)/(0.13*S) + vec3f(0.71, 0.13, 0.43));\\n  let W1 = d1.r*0.625 + d1.g*0.25 + d1.b*0.125; let W2 = d2.r*0.625 + d2.g*0.25 + d2.b*0.125; let W3 = d3.r*0.625 + d3.g*0.25 + d3.b*0.125;\\n  var billow = (W1 - 0.56)*0.55 + (W2 - 0.56)*0.3 + (W3 - 0.56)*0.15;\\n  var wisp = (d1.a - 0.5)*0.5 + (d2.a - 0.5)*0.3 + (d3.a - 0.5)*0.2;\\n  if (detailLod > 0.01) {   // a ~45 m octave, close to the camera only\\n    let d4 = t3D((qw + (d2.rgb - 0.5)*0.02*S)/(0.042*S) + vec3f(0.19, 0.61, 0.61));\\n    billow += ((d4.r*0.625 + d4.g*0.25 + d4.b*0.125) - 0.56)*0.12*detailLod; wisp += (d4.a - 0.5)*0.16*detailLod; }\\n  let amp = (0.09 + 0.1*S)*CU.band.w*select(1.0, 0.6, lay);\\n  // margins: billows give way to wisps, so edges fray rather than ending in smooth balls\\n  let edgeB = 1.0 - smoothstep(0.0, 0.07, f0);\\n  let bw = clamp(hfac*(1.0 - 0.6*decay)*(1.0 - 0.45*edgeB*rag), 0.0, 1.0);\\n  var disp = mix(wisp, billow, bw)*amp*(2.4 + 1.2*decay);\\n  if (disp > 0.0) { disp *= 0.4*smoothstep(-0.1*amp, 0.02, f); }   // detail mostly cuts in; it pushes out only near the surface\\n  f += disp;\\n  f -= (0.06 + 0.1*decay)*CU.band.w*(1.0 - smoothstep(0.0, 0.25, f))*max(d2.a - 0.35, 0.0);\\n  // the margin itself: fringes and notches within a band whose width follows how ragged this part is\\n  let band = exp(-(f*f)/(0.0012 + 0.0024*rag));\\n  f += ((d2.a - 0.5)*0.6 + (d3.a - 0.5)*0.4 + (W3 - 0.56)*0.5)*1.5*amp*rag*band*CU.band.w;\\n  f -= (0.05 + 0.04*rag)*CU.band.w*(1.0 - smoothstep(0.0, 0.12, f))*max(d3.a - 0.45, 0.0)*2.0;\\n  // the edge itself: hard on growing tops, a ramp of tens of metres where the cloud is mixing (liquid water fades out)\\n  // (tens of metres: liquid water ends within a few tens of metres of a cumulus's surface; the breakup of the outline is the\\n  // fray and the notches above, not a blur — a wide ramp read as smoke from below)\\n  let soft = mix(0.045, 0.012, clamp(topCrisp*mix(0.7, 1.0, hfac), 0.0, 1.0))*(1.0 + 0.8*decay);\\n  let iv = smoothstep(0.2, 0.85, W1*0.6 + B2*0.4);\\n  return vec3f(f, soft, iv);\\n}\\n// ice fibres drawn out along the wind (crystals spread by shear into long thin strands, 0.1–1 km across). The strands bend and\\n// wander (a slow warp across the wind), come in bundles that fade in and out, and are sampled through slanted rotations of the\\n// noise volume, so the field never repeats\\nfn iceFib(q0: vec3f) -> f32 {\\n  let q = q0 - vec3f(CU.ms.x, 0.0, CU.ms.y);\\n  let wd = CU.wind.xy; var al = dot(q.xz, wd); var ac = dot(q.xz, vec2f(-wd.y, wd.x)); let L = CU.wind.z;\\n  let w0 = nzs(RM2*vec3f(al/(9.1*L), q.y/2.3, ac/(6.7*L)) + vec3f(0.29, 0.61, 0.13)).a - 0.5;\\n  let w1 = nzs(RM1*vec3f(al/(3.3*L), q.y/1.1, ac/(2.6*L)) + vec3f(0.83, 0.07, 0.47)).a - 0.5;\\n  ac += w0*2.4*L + w1*0.7*L; al += w1*1.5*L;\\n  let f1 = nzs(RM1*vec3f(al/(4.0*L), q.y/0.6, ac/(0.25*L)) + vec3f(0.17, 0.41, 0.83)).a;\\n  let f2 = nzs(RM2*vec3f(al/(1.3*L), q.y/0.3, ac/(0.07*L)) + vec3f(0.53, 0.29, 0.07)).a;\\n  let bundle = smoothstep(0.3, 0.7, nzs(RM2*vec3f(al/(6.1*L), q.y/1.7, ac/(1.3*L)) + vec3f(0.71, 0.37, 0.59)).a);\\n  return smoothstep(0.35, 0.75, clamp(0.55*f1 + 0.45*f2*mix(0.4, 1.0, bundle), 0.0, 1.0))*mix(0.55, 1.0, bundle);\\n}\\nfn densFullL(q: vec3f, l: u32) -> f32 {\\n  let v = rawCloud(q.xz, q.y, l);\\n  let sig = sigmaOf(v); if (sig <= 0.0) { return 0.0; }\\n  if (f32(l) < CU.vol.w) {\\n    let d = v.r - 0.5; if (d < -cuPush(v.a) - 0.02) { return 0.0; }\\n    if (v.a < 0.63) {\\n      // cumulus: lumps push the surface out and cut into it (deep notches, separate turrets); the flat base stays nearly intact\\n      let Rc = clamp(select((v.a - 0.5)/0.12*1.2, v.a/0.5*2.4, v.a < 0.5), 0.05, 2.4);\\n      // the flat base stays nearly intact, but the cloud's sides are lumpy right down to it (they make its outline seen from\\n      // below): erosion is held back only where the base, not a side, is the nearest surface\\n      let z = q.y - v.b*CU_BSCALE; let hfac = 0.42 + 0.58*max(smoothstep(0.03, 0.35, z), smoothstep(0.01, 0.07, z - max(d, 0.0)));\\n      // erosion: subtractive (the surface is cut back between lumps, never inflated), deeper on big clouds\\n      // decaying clouds (low extinction factor): blurred, more deeply eaten edges\\n      let decay = clamp((0.8 - sig)/0.45, 0.0, 1.0);\\n      // (in proportion to the cloud: ~100 m on a 0.5 km cloud, 0.3 km on a 2 km one, a stratocumulus deck ~20% of its depth)\\n      // (layers: lumps at their cells' scale but shallow, the deck's top and base stay continuous)\\n      let A = CU.band.w*min(0.3*pow(Rc, 0.8), 0.45)*hfac*(1.0 + 0.5*decay)*select(1.0, 0.45, v.a >= 0.5);\\n      let su = cuSurface(q, d, z, Rc, A, decay, hfac, v.a >= 0.5);\\n      let de = su.x; let soft = su.y;\\n      // the mixing shell: dry air is stirred into a cloud's outer part (inhomogeneous mixing: fewer droplets, the same size),\\n      // so its water content falls over the outer ~10–20% of its size (more on dissolving clouds), patchily: translucent,\\n      // ragged edges rather than a hard surface; the cores keep their full density\\n      let shellW = clamp(0.12*Rc, 0.03, 0.18)*(1.0 + decay)*select(1.0, 0.6, v.a >= 0.5);\\n      let sh = smoothstep(0.0, shellW, de);\\n      let edge = 0.45 + 0.55*sh;\\n      // inside: water content varies from lobe to lobe (dark folds, bright bulges); in cumulus strongly (updraft cores against\\n      // diluted downdraft pockets, roughly 2–3× apart), which is also what gives a base seen from below its darker and lighter\\n      // patches\\n      let body = sig*cuSigmaZ(z)*cuDil(v.a)*select(0.5 + 1.0*su.z, 0.65 + 0.7*su.z, v.a >= 0.5)*edge*smoothstep(0.0, soft, de);\\n      // ragged fragments hanging under the base (fractus, scud: air dragged up into the condensation level by eddies and\\n      // condensing patchily), from just below the base to ~150 m under it, beside and under the cloud only; darker than the base\\n      // (less light reaches under it), they give a base seen from below its texture and break up its edge\\n      if (v.a < 0.5 && z < 0.05 && z > -0.17 && d > -0.15) {\\n        let qs = (q - vec3f(CU.ms.x, 0.0, CU.ms.y))*vec3f(1.0, 1.7, 1.0);\\n        let sn = t3D(RM1*qs/0.19 + vec3f(0.27, 0.61, 0.09)).a; let sb = t3D(RM2*qs/0.071 + vec3f(0.55, 0.13, 0.81));\\n        let hang = smoothstep(-0.17, -0.05, z)*(1.0 - smoothstep(0.0, 0.05, z))*smoothstep(-0.15, -0.03, d);\\n        let scud = sig*30.0*smoothstep(0.56, 0.8, 0.7*sn + 0.3*(sb.r*0.625 + sb.g*0.375))*hang*CU.band.w;\\n        return max(body, scud);\\n      }\\n      return body;\\n    }\\n    if (v.a > 0.8) {\\n      // ice: fibres drawn out along the wind (crystals spread by shear into long thin strands), soft-edged and wispy\\n      // (thick ice — an anvil — is a continuous sheet with fibrous edges, not separate strands)\\n      return sig*profileOf(v.b)*smoothstep(0.0, 0.12, d + 0.06)*mix(iceFib(q)*1.6, 0.75 + 0.5*iceFib(q), smoothstep(1.5, 4.0, sig));\\n    }\\n    if (isRain(v.a)) { return sig*smoothstep(-0.03, 0.2, d)*rainStreak(q); }\\n    // water sheets (stratus, altostratus): fine and shallow detail (their texture is in their fields)\\n    let e = CU.band.w*0.04;\\n    let qd = q - vec3f(CU.ms.x, 0.0, CU.ms.y);\\n    let n = nzs(qd/0.237 + vec3f(0.6, 0.2, 0.4)).r*0.6 + nzs(qd/0.071 + vec3f(0.1, 0.5, 0.9)).r*0.4;\\n    return sig*cuSigmaZ(q.y - v.b*CU_BSCALE)*smoothstep(0.0, 0.035, d - e*(1.0 - n) + 0.02);\\n  }\\n  var far = sig*profileV(v, q.y)*v.r;\\n  if (v.a > 0.8) { far *= mix(iceFib(q)*1.6, 0.75 + 0.5*iceFib(q), smoothstep(1.5, 4.0, sig)); } else if (isRain
